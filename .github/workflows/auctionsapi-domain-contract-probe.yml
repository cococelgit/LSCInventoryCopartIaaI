name: AuctionsAPI Domain Contract Probe

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "AuctionsAPI domain ID: 1=IAAI, 3=Copart"
        required: true
        type: string
      per_page:
        description: "Number of provider rows to inspect"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

env:
  BASE_URL: https://auctionsapi.com/api

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          [[ "${{ inputs.domain }}" == "1" || "${{ inputs.domain }}" == "3" ]]
          [[ "${{ inputs.per_page }}" =~ ^[1-9][0-9]?$|^100$ ]]
      - name: Call provider list endpoint and summarize fields
        env:
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
          DOMAIN: ${{ inputs.domain }}
          PER_PAGE: ${{ inputs.per_page }}
        run: |
          set -euo pipefail
          test -n "$AUCTIONS_API_KEY"
          url="$BASE_URL/cars?domain_id=$DOMAIN&page=1&per_page=$PER_PAGE"
          tmp="$(mktemp)"
          status="$(curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 45 \
            -H "x-api-key: $AUCTIONS_API_KEY" -H "accept: application/json" \
            -o "$tmp" -w '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$status"
          python3 - "$tmp" <<'PY'
          import json, sys
          from collections import Counter
          raw = open(sys.argv[1], encoding='utf-8').read()
          print('RESPONSE_BYTES=' + str(len(raw.encode())))
          value = json.loads(raw)
          if not isinstance(value, dict):
              print('RESPONSE_TYPE=' + type(value).__name__)
              raise SystemExit(1)
          print('TOP_LEVEL_KEYS=' + ','.join(sorted(value.keys())))
          data = value.get('data', value)
          print('DATA_TYPE=' + type(data).__name__)
          rows = data if isinstance(data, list) else data.get('lots', data.get('cars', data.get('results', []))) if isinstance(data, dict) else []
          print('ROW_COUNT=' + str(len(rows)))
          if not rows:
              print('ROW_KEYS=')
              raise SystemExit(0)
          key_counts = Counter()
          path_counts = Counter()
          status_counts = Counter()
          shape_counts = Counter()
          target_keys = {'lot','lots','condition','seller','seller_name','sellerName','consignor','owner','images','media','damage','location','odometer','keys_available','key_available','run_and_drive','run_and_drive_label','run_drive','runs_and_drives','run_condition','start_code','condition_code','vehicle_condition','airbags','trim','series','model_detail','body_style','vehicle_type','sale_date','title','title_type','title_type_label','manufacturer','model','bid','buy_now','status','keys'}
          def walk(value, path=''):
              if isinstance(value, dict):
                  for key, child in value.items():
                      current = f'{path}.{key}' if path else key
                      key_counts[key] += 1
                      if key in target_keys and child not in (None, '', [], {}):
                          path_counts[current] += 1
                      if key in {'seller','seller_type','condition','run_and_drive','run_condition','engine','status','title'} and child not in (None, '', [], {}):
                          shape = 'object:' + ','.join(sorted(child.keys())) if isinstance(child, dict) else type(child).__name__
                          shape_counts[f'{current}={shape}'] += 1
                      walk(child, current)
              elif isinstance(value, list):
                  for child in value:
                      walk(child, path + '[]')
          def nonempty(value):
              return value not in (None, '', [], {})
          units = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              nested = row.get('lots') if isinstance(row.get('lots'), list) else []
              units.extend([(row, lot) for lot in nested if isinstance(lot, dict)] or [(row, row)])
              walk(row)
          for parent, lot in units:
              raw_status = lot.get('status') or parent.get('status') or 'MISSING'
              if isinstance(raw_status, dict):
                  status = str(raw_status.get('name') or raw_status.get('NAME') or raw_status.get('value') or raw_status.get('id') or 'MISSING')
              else:
                  status = str(raw_status)
              status = status.strip().upper() or 'MISSING'
              status_counts[status] += 1
              for field in ('sale_date','seller','seller_name','seller_type','consignor','run_and_drive','run_drive','runs_and_drives','run_condition','start_code','vehicle_condition','airbags','keys_available','condition','images','odometer'):
                  if nonempty(lot.get(field)) or nonempty(parent.get(field)):
                      path_counts[f'by_status.{status}.{field}'] += 1
          print('UNIT_COUNT=' + str(len(units)))
          print('ROW_KEYS=' + ','.join(sorted(key_counts)))
          print('FIELD_PATH_PRESENCE=' + ','.join(f'{k}:{path_counts[k]}' for k in sorted(path_counts)))
          print('FIELD_SHAPES=' + ','.join(f'{k}:{shape_counts[k]}' for k in sorted(shape_counts)))
          print('STATUS_COUNTS=' + ','.join(f'{k}:{status_counts[k]}' for k in sorted(status_counts)))
          PY
          test "$status" = "200"
