name: PostgreSQL Network Migration - Approved IP

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE_POSTGRES_NETWORK to authorize the production network migration"
        required: true
        type: string
      approved_ip:
        description: "Single approved public IPv4 address"
        required: true
        default: "48.221.10.88"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: postgres-network-migration-prod
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  POSTGRES_SERVER: psql-lsc-inventory-cu
  APPROVED_IP: 48.221.10.88
  FIREWALL_RULE: allow-osniel-readonly-48-221-10-88
  DATA_VNET: vnet-lsc-data-prod-centralus
  PRIVATE_ENDPOINT_SUBNET: snet-private-endpoints
  APP_VNET: vnet-lsc-inventory-prod-eus2
  LEGACY_APP_VNET: vnet-lsc-inventory-prod
  PRIVATE_ENDPOINT_NAME: pe-psql-lsc-inventory-cu
  PRIVATE_CONNECTION_NAME: pec-psql-lsc-inventory-cu
  PRIVATE_DNS_ZONE: privatelink.postgres.database.azure.com
  PRIVATE_DNS_ZONE_GROUP: postgres-private-dns
  INVENTORY_API_APP: ca-lsc-inventory-api-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_AUTO_JOB: job-lsc-copart-auto-prod
  COPART_MANUAL_JOB: job-lsc-copart-excel-prod

jobs:
  migrate:
    name: Migrate PostgreSQL network and preserve private connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Validate explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "MIGRATE_POSTGRES_NETWORK"
          test "${{ inputs.approved_ip }}" = "$APPROVED_IP"
          [[ "$APPROVED_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "Authorization and approved /32 IP validated."

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install required Azure CLI extensions
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture protected production baseline and abort on active jobs
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          server_json="$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER" \
            --output json)"
          server_state="$(jq -r '.state // .userVisibleState // empty' <<<"$server_json")"
          test "$server_state" = "Ready"

          delegated_subnet="$(jq -r '.network.delegatedSubnetResourceId // empty' <<<"$server_json")"
          public_access="$(jq -r '.network.publicNetworkAccess // empty' <<<"$server_json")"
          fqdn="$(jq -r '.fullyQualifiedDomainName // empty' <<<"$server_json")"
          server_id="$(jq -r '.id // empty' <<<"$server_json")"
          location="$(jq -r '.location // empty' <<<"$server_json")"
          test -n "$fqdn"
          test -n "$server_id"
          test -n "$location"

          expected_subnet_id="$(az network vnet subnet show \
            --resource-group "$RESOURCE_GROUP" \
            --vnet-name "$DATA_VNET" \
            --name "$PRIVATE_ENDPOINT_SUBNET" \
            --query id -o tsv)"
          test -n "$expected_subnet_id"

          pe_policies="$(az network vnet subnet show \
            --resource-group "$RESOURCE_GROUP" \
            --vnet-name "$DATA_VNET" \
            --name "$PRIVATE_ENDPOINT_SUBNET" \
            --query privateEndpointNetworkPolicies -o tsv)"
          [[ "$pe_policies" = "Disabled" || "$pe_policies" = "NetworkSecurityGroupEnabled" || "$pe_policies" = "RouteTableEnabled" ]]

          forward_state="$(az network vnet peering show \
            --resource-group "$RESOURCE_GROUP" \
            --vnet-name "$DATA_VNET" \
            --name peer-to-eastus2-app \
            --query peeringState -o tsv)"
          reverse_state="$(az network vnet peering show \
            --resource-group "$RESOURCE_GROUP" \
            --vnet-name "$APP_VNET" \
            --name peer-to-centralus-data \
            --query peeringState -o tsv)"
          test "$forward_state" = "Connected"
          test "$reverse_state" = "Connected"

          for job in "$IAAI_JOB" "$COPART_AUTO_JOB" "$COPART_MANUAL_JOB"; do
            active_count="$(az containerapp job execution list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job" \
              --query "[?properties.status=='Running' || properties.status=='Processing' || properties.status=='Pending'] | length(@)" \
              -o tsv)"
            if [[ "${active_count:-0}" != "0" ]]; then
              echo "ABORT: $job has $active_count active execution(s)." >&2
              exit 20
            fi
          done

          api_image="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$INVENTORY_API_APP" \
            --query 'properties.template.containers[0].image' -o tsv)"
          iaai_hash="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$IAAI_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"
          copart_auto_hash="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$COPART_AUTO_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"
          copart_manual_hash="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$COPART_MANUAL_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"

          mkdir -p migration-evidence
          jq '{id,name,location,state,version,sku,storage,backup,highAvailability,authConfig,network,fullyQualifiedDomainName}' <<<"$server_json" > migration-evidence/postgres-before.json
          az network vnet subnet show --resource-group "$RESOURCE_GROUP" --vnet-name "$DATA_VNET" --name "$PRIVATE_ENDPOINT_SUBNET" -o json > migration-evidence/private-endpoint-subnet-before.json
          az network vnet peering list --resource-group "$RESOURCE_GROUP" --vnet-name "$DATA_VNET" -o json > migration-evidence/data-vnet-peerings-before.json
          az network vnet peering list --resource-group "$RESOURCE_GROUP" --vnet-name "$APP_VNET" -o json > migration-evidence/app-vnet-peerings-before.json

          {
            echo "fqdn=$fqdn"
            echo "server_id=$server_id"
            echo "location=$location"
            echo "delegated_subnet=$delegated_subnet"
            echo "public_access=$public_access"
            echo "api_image=$api_image"
            echo "iaai_hash=$iaai_hash"
            echo "copart_auto_hash=$copart_auto_hash"
            echo "copart_manual_hash=$copart_manual_hash"
          } >> "$GITHUB_OUTPUT"

          echo "SERVER_STATE=$server_state"
          echo "SERVER_FQDN=$fqdn"
          echo "CURRENT_DELEGATED_SUBNET=${delegated_subnet:-none}"
          echo "CURRENT_PUBLIC_ACCESS=${public_access:-none}"
          echo "ACTIVE_JOBS=0"
          echo "PROTECTED_API_IMAGE=$api_image"

      - name: Migrate from VNet integration when required
        shell: bash
        run: |
          set -euo pipefail
          delegated_subnet="${{ steps.preflight.outputs.delegated_subnet }}"
          if [[ -n "$delegated_subnet" ]]; then
            az postgres flexible-server migrate-network \
              --resource-group "$RESOURCE_GROUP" \
              --name "$POSTGRES_SERVER" \
              --only-show-errors
          else
            echo "Server is already on the Private Endpoint-capable network model; migration skipped."
          fi

          for attempt in $(seq 1 60); do
            state="$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" --query state -o tsv 2>/dev/null || true)"
            echo "POSTGRES_STATE attempt=$attempt state=${state:-unknown}"
            [[ "$state" = "Ready" ]] && exit 0
            sleep 30
          done
          echo "PostgreSQL did not return to Ready within 30 minutes." >&2
          exit 21

      - name: Create Private Endpoint and DNS integration
        shell: bash
        run: |
          set -euo pipefail
          server_id="${{ steps.preflight.outputs.server_id }}"
          location="${{ steps.preflight.outputs.location }}"

          if ! az network private-dns zone show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_DNS_ZONE" >/dev/null 2>&1; then
            az network private-dns zone create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_DNS_ZONE" \
              --only-show-errors >/dev/null
          fi
          zone_id="$(az network private-dns zone show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_DNS_ZONE" --query id -o tsv)"

          for spec in \
            "link-data-vnet|$DATA_VNET" \
            "link-app-vnet-eus2|$APP_VNET" \
            "link-app-vnet|$LEGACY_APP_VNET"; do
            link_name="${spec%%|*}"
            vnet_name="${spec#*|}"
            vnet_id="$(az network vnet show --resource-group "$RESOURCE_GROUP" --name "$vnet_name" --query id -o tsv)"
            if ! az network private-dns link vnet show \
              --resource-group "$RESOURCE_GROUP" \
              --zone-name "$PRIVATE_DNS_ZONE" \
              --name "$link_name" >/dev/null 2>&1; then
              az network private-dns link vnet create \
                --resource-group "$RESOURCE_GROUP" \
                --zone-name "$PRIVATE_DNS_ZONE" \
                --name "$link_name" \
                --virtual-network "$vnet_id" \
                --registration-enabled false \
                --only-show-errors >/dev/null
            fi
          done

          if ! az network private-endpoint show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PRIVATE_ENDPOINT_NAME" >/dev/null 2>&1; then
            az network private-endpoint create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$PRIVATE_ENDPOINT_NAME" \
              --location "$location" \
              --vnet-name "$DATA_VNET" \
              --subnet "$PRIVATE_ENDPOINT_SUBNET" \
              --private-connection-resource-id "$server_id" \
              --group-id postgresqlServer \
              --connection-name "$PRIVATE_CONNECTION_NAME" \
              --only-show-errors >/dev/null
          fi

          if ! az network private-endpoint dns-zone-group show \
            --resource-group "$RESOURCE_GROUP" \
            --endpoint-name "$PRIVATE_ENDPOINT_NAME" \
            --name "$PRIVATE_DNS_ZONE_GROUP" >/dev/null 2>&1; then
            az network private-endpoint dns-zone-group create \
              --resource-group "$RESOURCE_GROUP" \
              --endpoint-name "$PRIVATE_ENDPOINT_NAME" \
              --name "$PRIVATE_DNS_ZONE_GROUP" \
              --private-dns-zone "$zone_id" \
              --zone-name "$PRIVATE_DNS_ZONE" \
              --only-show-errors >/dev/null
          fi

          pe_state="$(az network private-endpoint show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT_NAME" --query provisioningState -o tsv)"
          connection_state="$(az network private-endpoint show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT_NAME" --query 'privateLinkServiceConnections[0].privateLinkServiceConnectionState.status' -o tsv)"
          private_ip="$(az network private-endpoint show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT_NAME" --query 'customDnsConfigs[0].ipAddresses[0]' -o tsv)"
          test "$pe_state" = "Succeeded"
          test "$connection_state" = "Approved"
          test -n "$private_ip"
          echo "PRIVATE_ENDPOINT_STATE=$pe_state"
          echo "PRIVATE_CONNECTION_STATE=$connection_state"
          echo "PRIVATE_IP=$private_ip"

      - name: Verify private PostgreSQL access through Inventory API
        shell: bash
        run: |
          set -euo pipefail
          api_fqdn="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$INVENTORY_API_APP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          token_secret_ref="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$INVENTORY_API_APP" \
            --query "properties.template.containers[0].env[?name=='InventoryApi__Token'].secretRef | [0]" -o tsv)"
          test -n "$api_fqdn"
          test -n "$token_secret_ref"
          inventory_token="$(az containerapp secret list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$INVENTORY_API_APP" \
            --show-values \
            --query "[?name=='$token_secret_ref'].value | [0]" -o tsv)"
          test -n "$inventory_token"

          api_response="$(mktemp)"
          trap 'rm -f "$api_response"' EXIT
          http_code="$(curl --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --output "$api_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $inventory_token" \
            "https://${api_fqdn}/api/v1/inventory/search?page=1&pageSize=1&platform=copart")"
          unset inventory_token
          test "$http_code" = "200"
          jq -e 'type == "object"' "$api_response" >/dev/null
          rm -f "$api_response"
          trap - EXIT
          echo "PRIVATE_DATABASE_QUERY_VIA_API=Succeeded"

      - name: Enable public access and allow only the approved IP
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER" \
            --public-network-access Enabled \
            --only-show-errors >/dev/null

          if az postgres flexible-server firewall-rule show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER" \
            --rule-name "$FIREWALL_RULE" >/dev/null 2>&1; then
            az postgres flexible-server firewall-rule update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$POSTGRES_SERVER" \
              --rule-name "$FIREWALL_RULE" \
              --start-ip-address "$APPROVED_IP" \
              --end-ip-address "$APPROVED_IP" \
              --only-show-errors >/dev/null
          else
            az postgres flexible-server firewall-rule create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$POSTGRES_SERVER" \
              --rule-name "$FIREWALL_RULE" \
              --start-ip-address "$APPROVED_IP" \
              --end-ip-address "$APPROVED_IP" \
              --only-show-errors >/dev/null
          fi

          unexpected_rules="$(az postgres flexible-server firewall-rule list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER" \
            --query "[?!(name=='$FIREWALL_RULE' && startIpAddress=='$APPROVED_IP' && endIpAddress=='$APPROVED_IP')] | length(@)" \
            -o tsv)"
          test "${unexpected_rules:-0}" = "0"

      - name: Verify final configuration and protected resources
        shell: bash
        run: |
          set -euo pipefail
          server_json="$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" -o json)"
          test "$(jq -r '.state // .userVisibleState // empty' <<<"$server_json")" = "Ready"
          test "$(jq -r '.network.publicNetworkAccess // empty' <<<"$server_json")" = "Enabled"
          test -z "$(jq -r '.network.delegatedSubnetResourceId // empty' <<<"$server_json")"
          test "$(jq -r '.authConfig.passwordAuth // empty' <<<"$server_json")" = "Enabled"

          rule_json="$(az postgres flexible-server firewall-rule show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_SERVER" \
            --rule-name "$FIREWALL_RULE" -o json)"
          test "$(jq -r '.startIpAddress' <<<"$rule_json")" = "$APPROVED_IP"
          test "$(jq -r '.endIpAddress' <<<"$rule_json")" = "$APPROVED_IP"

          api_image_after="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$INVENTORY_API_APP" --query 'properties.template.containers[0].image' -o tsv)"
          iaai_hash_after="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$IAAI_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"
          copart_auto_hash_after="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$COPART_AUTO_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"
          copart_manual_hash_after="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$COPART_MANUAL_JOB" -o json | jq 'del(.properties.provisioningState,.systemData)' | sha256sum | awk '{print $1}')"

          test "$api_image_after" = "${{ steps.preflight.outputs.api_image }}"
          test "$iaai_hash_after" = "${{ steps.preflight.outputs.iaai_hash }}"
          test "$copart_auto_hash_after" = "${{ steps.preflight.outputs.copart_auto_hash }}"
          test "$copart_manual_hash_after" = "${{ steps.preflight.outputs.copart_manual_hash }}"

          api_fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$INVENTORY_API_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          test -n "$api_fqdn"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "https://${api_fqdn}/healthz" >/dev/null

          mkdir -p migration-evidence
          jq '{id,name,location,state,version,sku,storage,backup,highAvailability,authConfig,network,fullyQualifiedDomainName}' <<<"$server_json" > migration-evidence/postgres-after.json
          az network private-endpoint show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT_NAME" -o json > migration-evidence/private-endpoint-after.json
          az network private-dns zone show --resource-group "$RESOURCE_GROUP" --name "$PRIVATE_DNS_ZONE" -o json > migration-evidence/private-dns-zone-after.json
          az network private-dns link vnet list --resource-group "$RESOURCE_GROUP" --zone-name "$PRIVATE_DNS_ZONE" -o json > migration-evidence/private-dns-links-after.json
          az postgres flexible-server firewall-rule list --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" -o json > migration-evidence/firewall-after.json

          echo "POSTGRES_NETWORK_MIGRATION_COMPLETED"
          echo "SERVER_FQDN=${{ steps.preflight.outputs.fqdn }}"
          echo "PUBLIC_NETWORK_ACCESS=Enabled"
          echo "FIREWALL_RULE=$FIREWALL_RULE"
          echo "APPROVED_IP=$APPROVED_IP/32"
          echo "PRIVATE_ENDPOINT=$PRIVATE_ENDPOINT_NAME"
          echo "PRIVATE_DNS_ZONE=$PRIVATE_DNS_ZONE"
          echo "API_IMAGE_UNCHANGED=$api_image_after"
          echo "IAAI_JOB_UNCHANGED=true"
          echo "COPART_AUTO_JOB_UNCHANGED=true"
          echo "COPART_MANUAL_JOB_UNCHANGED=true"
          echo "NO_JOB_EXECUTION_STARTED=true"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-network-migration-evidence-${{ github.run_id }}
          path: migration-evidence
          if-no-files-found: warn
          retention-days: 30
