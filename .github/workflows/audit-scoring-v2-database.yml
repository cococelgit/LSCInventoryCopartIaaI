name: Audit Inventory V2 Scoring Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUDIT_INVENTORY_V2_SCORING_DATABASE"
        required: true
        type: string
      policy_version:
        description: "Expected scoring policy version"
        required: true
        default: "lsc_pre_grade_v1"
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  POSTGRES_HOST: psql-lsc-inventory-cu.postgres.database.azure.com
  POSTGRES_DATABASE: lsc_inventory
  POSTGRES_USER: id-lsc-inventory-db-runtime-prod

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard read-only authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = AUDIT_INVENTORY_V2_SCORING_DATABASE

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Query scoring and Inventory V2 integrity read-only
        env:
          POLICY_VERSION: ${{ inputs.policy_version }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)"
          export PGPASSWORD="$token"
          connection="host=$POSTGRES_HOST port=5432 dbname=$POSTGRES_DATABASE user=$POSTGRES_USER sslmode=require"
          psql "$connection" --tuples-only --no-align --field-separator='|' <<SQL
          select 'DATABASE' as section, current_user, current_database(), now();
          with active as (
              select lot_key, lower(coalesce(platform, 'unknown')) as platform, last_seen_at
              from public.inventory_current_v2
              where is_active
          ), joined as (
              select active.*, score.policy_version, score.source_observed_at,
                     score.scored_at, score.lot_key as score_lot_key
              from active
              left join public.inventory_vehicle_score_current score
                on score.lot_key = active.lot_key
          )
          select 'SUMMARY' as section,
                 platform,
                 count(*)::bigint as active_count,
                 count(*) filter (where score_lot_key is not null)::bigint as score_join_count,
                 count(*) filter (where score_lot_key is null)::bigint as score_missing_count,
                 count(*) filter (where score_lot_key is not null and policy_version = '${POLICY_VERSION}')::bigint as policy_match_count,
                 count(*) filter (where score_lot_key is not null and source_observed_at = last_seen_at)::bigint as timestamp_match_count,
                 count(*) filter (where score_lot_key is not null and source_observed_at < last_seen_at)::bigint as score_older_count,
                 count(*) filter (where score_lot_key is not null and source_observed_at > last_seen_at)::bigint as score_newer_count
          from joined
          group by platform
          order by platform;
          with active as (
              select lot_key, lower(coalesce(platform, 'unknown')) as platform, last_seen_at
              from public.inventory_current_v2
              where is_active
          ), joined as (
              select active.*, score.policy_version, score.source_observed_at,
                     score.scored_at, score.lot_key as score_lot_key
              from active
              left join public.inventory_vehicle_score_current score
                on score.lot_key = active.lot_key
          )
          select 'SAMPLE_MISMATCH' as section,
                 platform, lot_key, last_seen_at, source_observed_at,
                 policy_version, scored_at
          from joined
          where score_lot_key is not null
            and (source_observed_at <> last_seen_at or policy_version <> '${POLICY_VERSION}')
          order by platform, lot_key
          limit 20;
          SQL
          unset PGPASSWORD
