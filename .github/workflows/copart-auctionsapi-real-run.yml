name: Copart AuctionsAPI real run

on:
  workflow_dispatch:
    inputs:
      maximum:
        description: "Maximum Copart lots to process"
        required: true
        default: "200"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-auctionsapi-real-run
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  COPART_API_JOB_NAME: job-lsc-copart-auto-prod

jobs:
  run:
    name: Run Copart AuctionsAPI with writes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Enable writes and fix real-run command without activating schedule
        shell: bash
        env:
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
          MAXIMUM: ${{ inputs.maximum }}
        run: |
          set -euo pipefail
          case "$MAXIMUM" in ''|*[!0-9]*) echo "maximum must be numeric" >&2; exit 2 ;; esac
          test "$MAXIMUM" -ge 1 && test "$MAXIMUM" -le 200
          test -n "$AUCTIONS_API_KEY"
          job_json="$(az containerapp job show --name "$COPART_API_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          patch_body="$(echo "$job_json" | jq --arg key "$AUCTIONS_API_KEY" --arg maximum "$MAXIMUM" '
            .properties.template.containers[0] |= del(.imageType)
            | .properties.template.containers[0].command = ["/app/run-auctionsapi-dry-run.sh"]
            | .properties.template.containers[0].args = ["copart", "run", $maximum]
            | .properties.template.containers[0].env = ((.properties.template.containers[0].env // [])
              | map(select(.name != "AuctionsApi__ApiKey" and .name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites"))
              + [
                  {name:"AuctionsApi__ApiKey", value:$key},
                  {name:"AuctionsApi__Enabled", value:"true"},
                  {name:"AuctionsApi__AllowWrites", value:"true"}
                ])
            | {properties:{template:{containers:[.properties.template.containers[0]]}}}' )"
          uri="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/jobs/${COPART_API_JOB_NAME}?api-version=2024-03-01"
          az rest --method patch --uri "$uri" --body "$patch_body" --output none

      - name: Start exactly one real run
        id: start
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --name "$COPART_API_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          echo "$execution" | jq .
          execution_name="$(echo "$execution" | jq -r '.name // .properties.name // empty')"
          test -n "$execution_name"
          echo "EXECUTION_NAME=$execution_name" >> "$GITHUB_ENV"

      - name: Wait and collect final logs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            execution_json="$(az containerapp job execution show --name "$COPART_API_JOB_NAME" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION_NAME" -o json)"
            status="$(echo "$execution_json" | jq -r '.properties.status // .status // "Unknown"')"
            echo "attempt=$attempt status=$status"
            case "$status" in Succeeded|Failed|Canceled|Cancelled) break ;; esac
            sleep 10
          done
          az containerapp job logs show --name "$COPART_API_JOB_NAME" --resource-group "$RESOURCE_GROUP" --execution "$EXECUTION_NAME" --container "$COPART_API_JOB_NAME" --tail 300 || true
          test "$status" = "Succeeded"

      - name: Restore safe state
        if: always()
        shell: bash
        env:
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          job_json="$(az containerapp job show --name "$COPART_API_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          patch_body="$(echo "$job_json" | jq --arg key "$AUCTIONS_API_KEY" '
            .properties.template.containers[0] |= del(.imageType)
            | .properties.template.containers[0].args = ["copart", "dry-run"]
            | .properties.template.containers[0].env = ((.properties.template.containers[0].env // [])
              | map(select(.name != "AuctionsApi__ApiKey" and .name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites"))
              + [
                  {name:"AuctionsApi__ApiKey", value:$key},
                  {name:"AuctionsApi__Enabled", value:"true"},
                  {name:"AuctionsApi__AllowWrites", value:"false"}
                ])
            | {properties:{template:{containers:[.properties.template.containers[0]]}}}' )"
          uri="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/jobs/${COPART_API_JOB_NAME}?api-version=2024-03-01"
          az rest --method patch --uri "$uri" --body "$patch_body" --output none
          echo "COPART_API_RESTORED_WRITES=false"
          echo "COPART_API_SCHEDULE_UNCHANGED=true"
          echo "COPART_EXCEL_REMAINED_PAUSED=true"
