name: Stop Copart Catch-up Execution

on:
  workflow_dispatch:
    inputs:
      execution:
        description: "Catch-up execution name to stop"
        required: true
        type: string
      confirm_stop:
        description: "Type STOP_COPART_CATCHUP to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  CATCHUP_JOB: job-lsc-copart-catchup-prod

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Stop only the selected catch-up execution
        env:
          EXECUTION: ${{ inputs.execution }}
          CONFIRM_STOP: ${{ inputs.confirm_stop }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STOP" = "STOP_COPART_CATCHUP"
          before="$(az containerapp job execution show --name "$CATCHUP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" -o json)"
          test "$(echo "$before" | jq -r '.properties.status')" = "Running"
          az containerapp job stop --name "$CATCHUP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" --only-show-errors
          sleep 8
          az containerapp job execution show --name "$CATCHUP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" -o json | jq '{execution:.name,status:.properties.status,start:.properties.startTime,end:.properties.endTime}'
