name: Diagnose Scoring Hash Gaps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  POSTGRES_HOST: psql-lsc-inventory-cu.postgres.database.azure.com
  POSTGRES_DATABASE: lsc_inventory
  POSTGRES_USER: id-lsc-inventory-loader-prod

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Query scoring gaps read-only
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS https://api.ipify.org)"
          firewall_rule="allow-scoring-gap-diagnostic-${GITHUB_RUN_ID}"
          cleanup() {
            unset PGPASSWORD || true
            az postgres flexible-server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server-name psql-lsc-inventory-cu --name "$firewall_rule" --yes --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name psql-lsc-inventory-cu \
            --name "$firewall_rule" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors >/dev/null
          token="$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)"
          export PGPASSWORD="$token"
          conn="host=$POSTGRES_HOST port=5432 dbname=$POSTGRES_DATABASE user=$POSTGRES_USER sslmode=require"
          for attempt in $(seq 1 12); do
            if psql "$conn" -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null 2>&1; then break; fi
            sleep 5
          done
          echo '--- scoring gap counts by platform ---'
          psql "$conn" -v ON_ERROR_STOP=1 -P pager=off -c "
            with active as (
              select lot_key, lower(coalesce(platform, 'unknown')) as platform, score_input_hash
              from public.inventory_current_v2
              where is_active
            ), joined as (
              select active.*, score.lot_key as score_lot_key,
                     score.policy_version as score_policy_version,
                     score.input_hash as score_input_hash_current,
                     queue.status as queue_status,
                     queue.attempts as queue_attempts,
                     queue.input_hash as queue_input_hash
              from active
              left join public.inventory_vehicle_score_current score on score.lot_key = active.lot_key
              left join public.inventory_vehicle_scoring_queue queue on queue.lot_key = active.lot_key
            )
            select platform,
                   count(*) as active,
                   count(*) filter (where score_lot_key is null) as missing_score,
                   count(*) filter (where score_lot_key is null and score_input_hash is null) as missing_score_and_input_hash,
                   count(*) filter (where score_lot_key is null and score_input_hash is not null) as missing_score_eligible_by_hash,
                   count(*) filter (where score_lot_key is null and queue_status is null) as missing_score_without_queue,
                   count(*) filter (where score_lot_key is null and queue_status is not null) as missing_score_with_queue,
                   count(*) filter (where score_lot_key is null and queue_status = 'completed') as missing_score_queue_completed,
                   count(*) filter (where score_lot_key is null and queue_status = 'failed') as missing_score_queue_failed
            from joined
            group by platform
            order by platform;
          "
          echo '--- queue status totals ---'
          psql "$conn" -v ON_ERROR_STOP=1 -P pager=off -c "
            select status, count(*) as rows, count(*) filter (where attempts >= 3) as attempts_at_limit
            from public.inventory_vehicle_scoring_queue
            group by status
            order by status;
          "
          echo '--- sample missing score rows ---'
          psql "$conn" -v ON_ERROR_STOP=1 -P pager=off -c "
            with active as (
              select lot_key, platform, score_input_hash
              from public.inventory_current_v2
              where is_active
            )
            select active.lot_key, active.platform, active.score_input_hash,
                   queue.status, queue.attempts, queue.last_error
            from active
            left join public.inventory_vehicle_score_current score on score.lot_key = active.lot_key
            left join public.inventory_vehicle_scoring_queue queue on queue.lot_key = active.lot_key
            where score.lot_key is null
            order by active.platform, active.lot_key
            limit 20;
          "
