name: Audit Inventory SMS Alert Capability
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Inspect existing alert resources and job metric state
        shell: bash
        run: |
          set -euo pipefail
          az monitor action-group list --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | {name,shortName:.groupShortName,enabled,smsReceiverCount:(.smsReceivers | length)}]'
          az monitor metrics alert list --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | {name,enabled:.properties.enabled,scopes:.properties.scopes,conditions:.properties.criteria.allOf,actionGroupIds:[.properties.actions[]?.actionGroupId]}]'
          az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Insights/scheduledQueryRules -o json | jq '[.[] | {name,id}]'
          for job in job-lsc-copart-inc-v2-prod job-lsc-iaai-inc-v2-prod; do
            id="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
            echo "JOB=$job ID=$id"
            az monitor metrics list-definitions --resource "$id" --query "[?name.value=='Executions'].{metric:name.value,dimensions:dimensions[].value,aggregations:supportedAggregationTypes}" -o json
            az monitor metrics list --resource "$id" --metric Executions --interval PT1M --aggregation Total --dimension state --offset 1h -o json | jq '{metrics:[.value[]|{name:.name.value,series:[.timeseries[]|{dimensions:.metadatavalues,counts:[.data[]|select(.total>0)|{timeStamp,total}]}]}]}'
          done
