name: Read Sold Lot Retention Dry Run Logs

on:
  workflow_dispatch:
    inputs:
      execution_name:
        description: Completed retention dry-run execution name
        required: true
        default: job-lsc-copart-catchup-prod-rg04lkj
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  TEMPORARY_JOB: job-lsc-copart-catchup-prod

jobs:
  read-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Query only the completed dry-run console logs
        shell: bash
        env:
          EXECUTION_NAME: ${{ inputs.execution_name }}
        run: |
          set -euo pipefail
          [[ "$EXECUTION_NAME" =~ ^job-lsc-copart-catchup-prod-[a-z0-9]+$ ]] || { echo 'Invalid execution name' >&2; exit 1; }
          environment_id="$(az containerapp job show --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" --query 'properties.environmentId' -o tsv)"
          workspace_id="$(az resource show --ids "$environment_id" --query 'properties.appLogsConfiguration.logAnalyticsConfiguration.customerId' -o tsv)"
          test -n "$workspace_id" && test "$workspace_id" != None
          query="union isfuzzy=true ContainerAppConsoleLogs_CL, ContainerAppSystemLogs_CL | where TimeGenerated between (datetime(2026-09-10T13:14:00Z) .. datetime(2026-09-10T13:16:00Z)) | where ContainerGroupName_s startswith '$EXECUTION_NAME' | project TimeGenerated, ContainerGroupName_s, ContainerName_s, Log_s, Reason_s | order by TimeGenerated asc | take 500"
          az monitor log-analytics query --workspace "$workspace_id" --analytics-query "$query" -o json > retention-dry-run-logs.json
          jq '[.[] | {TimeGenerated, ContainerGroupName_s, ContainerName_s, Log_s, Reason_s}]' retention-dry-run-logs.json

      - name: Upload log evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sold-lot-retention-dry-run-logs-${{ github.run_id }}
          path: retention-dry-run-logs.json
          if-no-files-found: warn
          retention-days: 30
