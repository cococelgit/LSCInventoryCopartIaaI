name: Stop Stalled Future Auction Load
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STOP_STALLED_FUTURE_LOAD"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  TEMP_JOB: job-lsc-future-v2-load-prod
  EXECUTION: job-lsc-future-v2-load-prod-16aqo2y
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify explicit authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = STOP_STALLED_FUTURE_LOAD
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Stop only matching temporary execution and verify regular jobs stay paused
        shell: bash
        run: |
          set -euo pipefail
          current="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" -o json)"
          status="$(echo "$current" | jq -r '.properties.status')"
          echo "BEFORE=$EXECUTION STATUS=$status"
          if [ "$status" = Running ] || [ "$status" = Pending ]; then
            az containerapp job stop --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" --only-show-errors
          fi
          for attempt in $(seq 1 36); do
            status="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION" --query properties.status -o tsv 2>/dev/null || true)"
            echo "STOP_WAIT attempt=$attempt status=$status"
            case "$status" in Running|Pending) sleep 5 ;; *) break ;; esac
          done
          test "$status" != Running && test "$status" != Pending
          for job in job-lsc-copart-inc-v2-prod job-lsc-iaai-inc-v2-prod; do
            trigger="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" --query properties.configuration.triggerType -o tsv)"
            echo "POST_STOP_JOB=$job TRIGGER=$trigger"
            test "$trigger" = Manual
          done
