name: Promote search performance to production canary

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROMOTE-907A5D8-CANARY to authorize this production canary"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: inventory-search-performance-production-canary
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  API_NAME: ca-lsc-inventory-api-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  CANDIDATE_REF: manus/search-latency-prod-base
  TEMP_BOOTSTRAP_USER: github-actions-searchperf-prod
  TEMP_BOOTSTRAP_OBJECT_ID: 547895b8-3b4e-490a-8135-a3d82d7fdeca

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Guard explicit production authorization
        shell: bash
        run: test "${{ inputs.confirm }}" = "PROMOTE-907A5D8-CANARY"

      - name: Checkout exact approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture and validate Production prechecks
        id: prechecks
        shell: bash
        run: |
          set -euo pipefail
          app_json="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_NAME" -o json)"
          api_image="$(jq -r '.properties.template.containers[0].image' <<<"$app_json")"
          api_revision="$(jq -r '.properties.latestRevisionName' <<<"$app_json")"
          ready_revision="$(jq -r '.properties.latestReadyRevisionName' <<<"$app_json")"
          active_mode="$(jq -r '.properties.configuration.activeRevisionsMode' <<<"$app_json")"
          ingress_fqdn="$(jq -r '.properties.configuration.ingress.fqdn' <<<"$app_json")"
          sync="$(jq -r '.properties.template.containers[0].env[]? | select(.name=="Sync__Enabled") | .value' <<<"$app_json")"
          migrations="$(jq -r '.properties.template.containers[0].env[]? | select(.name=="Persistence__RunMigrations") | .value' <<<"$app_json")"
          warmup="$(jq -r '.properties.template.containers[0].env[]? | select(.name=="SearchProjection__WarmupOnStartup") | .value' <<<"$app_json")"
          test -n "$api_image" && test "$api_image" != "null"
          test -n "$api_revision" && test "$api_revision" != "null"
          test "$ready_revision" = "$api_revision"
          case "$active_mode" in
            Single|Multiple) ;;
            *) echo "Unsupported active revisions mode: $active_mode"; exit 1 ;;
          esac
          test -n "$ingress_fqdn" && test "$ingress_fqdn" != "null"
          test "$sync" = "false"
          test "$migrations" = "false"
          test "$warmup" = "true"
          health_ok=false
          for health_attempt in $(seq 1 12); do
            health_response="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 40 --write-out '\nHTTP_STATUS=%{http_code}\n' "https://$ingress_fqdn/healthz" 2>&1 || true)"
            echo "Production health precheck attempt=$health_attempt response=$health_response"
            if grep -q 'HTTP_STATUS=200' <<<"$health_response"; then
              health_ok=true
              break
            fi
            sleep 10
          done
          test "$health_ok" = "true"
          api_uai_resource_id="$(jq -r '.identity.userAssignedIdentities | keys[0] // empty' <<<"$app_json")"
          test -n "$api_uai_resource_id"
          app_env() { jq -r --arg n "$1" '.properties.template.containers[0].env[]? | select(.name==$n) | (.value // empty)' <<<"$app_json"; }
          db_host="$(app_env Persistence__PostgreSqlHost)"
          db_name="$(app_env Persistence__Database)"
          db_client_id="$(app_env Persistence__ManagedIdentityClientId)"
          db_user="$(app_env Persistence__DatabaseUser)"
          runtime_name="$(app_env Persistence__RuntimePrincipalName)"
          runtime_object_id="$(app_env Persistence__RuntimePrincipalObjectId)"
          for value in "$db_host" "$db_name" "$db_client_id" "$db_user" "$runtime_name" "$runtime_object_id"; do test -n "$value"; done
          env_id="$(jq -r '.properties.environmentId' <<<"$app_json")"
          test -n "$env_id" && test "$env_id" != "null"
          {
            echo "CURRENT_API_IMAGE=$api_image"
            echo "CURRENT_API_REVISION=$api_revision"
            echo "CURRENT_API_MODE=$active_mode"
            echo "API_FQDN=$ingress_fqdn"
            echo "API_UAI_RESOURCE_ID=$api_uai_resource_id"
            echo "POSTGRES_HOST=$db_host"
            echo "POSTGRES_DATABASE=$db_name"
            echo "POSTGRES_CLIENT_ID=$db_client_id"
            echo "POSTGRES_DATABASE_USER=$db_user"
            echo "RUNTIME_PRINCIPAL_NAME=$runtime_name"
            echo "RUNTIME_PRINCIPAL_OBJECT_ID=$runtime_object_id"
            echo "CONTAINER_ENVIRONMENT_ID=$env_id"
          } >> "$GITHUB_ENV"
          echo "Production prechecks passed for revision=$api_revision image=$api_image fqdn=$ingress_fqdn"

      - name: Build immutable candidate image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="api-searchperf-907a5d8-${GITHUB_RUN_NUMBER}"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$image_tag" --file Dockerfile .
          echo "CANDIDATE_IMAGE=$ACR_SERVER/$IMAGE_NAME:$image_tag" >> "$GITHUB_ENV"

      - name: Run internal production migration job
        shell: bash
        run: |
          set -euo pipefail
          job="job-lsc-spmig-${GITHUB_RUN_NUMBER}"
          az containerapp job create \
            -g "$RESOURCE_GROUP" -n "$job" \
            --environment "$CONTAINER_ENVIRONMENT_ID" \
            --trigger-type Manual \
            --replica-timeout 900 \
            --parallelism 1 \
            --replica-completion-count 1 \
            --image "$CANDIDATE_IMAGE" \
            --registry-server "$ACR_SERVER" \
            --registry-identity "$API_UAI_RESOURCE_ID" \
            --mi-user-assigned "$API_UAI_RESOURCE_ID" \
            --command dotnet \
            --args Lsc.Inventory.Api.dll production-migration \
            --env-vars \
              "Persistence__Provider=Postgres" \
              "Persistence__PostgreSqlHost=$POSTGRES_HOST" \
              "Persistence__Database=$POSTGRES_DATABASE" \
              "Persistence__ManagedIdentityClientId=$POSTGRES_CLIENT_ID" \
              "Persistence__DatabaseUser=$POSTGRES_DATABASE_USER" \
              "Persistence__RuntimePrincipalName=$RUNTIME_PRINCIPAL_NAME" \
              "Persistence__RuntimePrincipalObjectId=$RUNTIME_PRINCIPAL_OBJECT_ID" \
              "Persistence__RunMigrations=true" \
              "Sync__Enabled=false" \
            --only-show-errors >/dev/null
          echo "MIGRATION_JOB=$job" >> "$GITHUB_ENV"
          az containerapp job start -g "$RESOURCE_GROUP" -n "$job" --only-show-errors >/dev/null
          for attempt in $(seq 1 60); do
            execution="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$job" --query '[0].name' -o tsv 2>/dev/null || true)"
            status="$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$job" --query '[0].properties.status' -o tsv 2>/dev/null || true)"
            echo "migration attempt=$attempt execution=$execution status=$status"
            [[ "$status" == "Succeeded" ]] && break
            if [[ "$status" == "Failed" || "$status" == "Stopped" ]]; then
              replica="$(az containerapp job replica list -g "$RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].name' -o tsv 2>/dev/null || true)"
              container="$(az containerapp job replica list -g "$RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].properties.containers[0].name' -o tsv 2>/dev/null || true)"
              echo "production migration replica=$replica container=$container"
              if [[ -n "$replica" && -n "$container" ]]; then
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$job" --execution "$execution" --replica "$replica" --container "$container" --tail 100 --format text || true
              fi
              exit 1
            fi
            sleep 10
          done
          test "${status:-}" = "Succeeded"

      - name: Remove migration job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MIGRATION_JOB:-}" ]]; then
            az containerapp job delete -g "$RESOURCE_GROUP" -n "$MIGRATION_JOB" --yes --only-show-errors >/dev/null || true
          fi

      - name: Switch to multiple revision mode and deploy canary with flags off
        id: canary
        shell: bash
        run: |
          set -Eeuo pipefail
          rollback() {
            if [[ -n "${NEW_REVISION:-}" && -n "${CURRENT_API_REVISION:-}" ]]; then
              az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=100" "$NEW_REVISION=0" --only-show-errors || true
              az containerapp revision deactivate -g "$RESOURCE_GROUP" -n "$API_NAME" --revision "$NEW_REVISION" --only-show-errors || true
              az containerapp revision set-mode -g "$RESOURCE_GROUP" -n "$API_NAME" --mode Single --only-show-errors || true
            fi
          }
          trap rollback ERR
          az containerapp revision set-mode -g "$RESOURCE_GROUP" -n "$API_NAME" --mode Multiple --only-show-errors
          az containerapp update \
            -g "$RESOURCE_GROUP" -n "$API_NAME" \
            --image "$CANDIDATE_IMAGE" \
            --revision-suffix "sp${GITHUB_RUN_NUMBER}" \
            --set-env-vars \
              "Sync__Enabled=false" \
              "Persistence__RunMigrations=false" \
              "SearchProjection__WarmupOnStartup=true" \
              "Persistence__UseDenormalizedScoringSearch=false" \
              "Persistence__RunBrowseCountAndItemsInParallel=false" \
              "MotivatedSellers__ReadEnabled=false" \
            --only-show-errors >/dev/null
          NEW_REVISION="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_NAME" --query properties.latestRevisionName -o tsv)"
          test "$NEW_REVISION" != "$CURRENT_API_REVISION"
          az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=95" "$NEW_REVISION=5" --only-show-errors
          for attempt in $(seq 1 30); do
            state="$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$API_NAME" --query "[?name=='$NEW_REVISION'].properties.runningState | [0]" -o tsv)"
            echo "canary attempt=$attempt revision=$NEW_REVISION state=$state"
            [[ "$state" == "Running" ]] && break
            [[ "$state" == "Failed" ]] && exit 1
            sleep 10
          done
          test "${state:-}" = "Running"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "https://$API_FQDN/healthz" >/dev/null
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"
          trap - ERR

      - name: Increase code canary traffic before enabling optimization
        shell: bash
        run: |
          set -euo pipefail
          az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=50" "$NEW_REVISION=50" --only-show-errors
          sleep 20
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$API_FQDN/healthz" >/dev/null

      - name: Activate optimization in a second canary revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            -g "$RESOURCE_GROUP" -n "$API_NAME" \
            --image "$CANDIDATE_IMAGE" \
            --revision-suffix "so${GITHUB_RUN_NUMBER}" \
            --set-env-vars \
              "Sync__Enabled=false" \
              "Persistence__RunMigrations=false" \
              "SearchProjection__WarmupOnStartup=true" \
              "Persistence__UseDenormalizedScoringSearch=true" \
              "Persistence__RunBrowseCountAndItemsInParallel=true" \
              "MotivatedSellers__ReadEnabled=true" \
            --only-show-errors >/dev/null
          ENABLED_REVISION="$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_NAME" --query properties.latestRevisionName -o tsv)"
          test "$ENABLED_REVISION" != "$NEW_REVISION"
          test "$ENABLED_REVISION" != "$CURRENT_API_REVISION"
          az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=95" "$NEW_REVISION=0" "$ENABLED_REVISION=5" --only-show-errors
          for attempt in $(seq 1 30); do
            state="$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$API_NAME" --query "[?name=='$ENABLED_REVISION'].properties.runningState | [0]" -o tsv)"
            echo "enabled-canary attempt=$attempt revision=$ENABLED_REVISION state=$state"
            [[ "$state" == "Running" ]] && break
            [[ "$state" == "Failed" ]] && exit 1
            sleep 10
          done
          test "${state:-}" = "Running"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "https://$API_FQDN/healthz" >/dev/null
          echo "ENABLED_REVISION=$ENABLED_REVISION" >> "$GITHUB_ENV"

      - name: Promote enabled optimization revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=50" "$NEW_REVISION=0" "$ENABLED_REVISION=50" --only-show-errors
          sleep 30
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$API_FQDN/healthz" >/dev/null
          az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "$CURRENT_API_REVISION=0" "$NEW_REVISION=0" "$ENABLED_REVISION=100" --only-show-errors
          echo "CANARY_PROMOTION_COMPLETED=true" >> "$GITHUB_STEP_SUMMARY"
          echo "Enabled optimization revision=$ENABLED_REVISION now receives 100%; previous revision=$CURRENT_API_REVISION remains active at 0% for rollback." >> "$GITHUB_STEP_SUMMARY"

      - name: Automatic rollback on any failed canary step
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CURRENT_API_REVISION:-}" ]]; then
            weights=("$CURRENT_API_REVISION=100")
            [[ -n "${NEW_REVISION:-}" ]] && weights+=("$NEW_REVISION=0")
            [[ -n "${ENABLED_REVISION:-}" ]] && weights+=("$ENABLED_REVISION=0")
            az containerapp ingress traffic set -g "$RESOURCE_GROUP" -n "$API_NAME" --revision-weight "${weights[@]}" --only-show-errors || true
            [[ -n "${ENABLED_REVISION:-}" ]] && az containerapp revision deactivate -g "$RESOURCE_GROUP" -n "$API_NAME" --revision "$ENABLED_REVISION" --only-show-errors || true
            [[ -n "${NEW_REVISION:-}" ]] && az containerapp revision deactivate -g "$RESOURCE_GROUP" -n "$API_NAME" --revision "$NEW_REVISION" --only-show-errors || true
            az containerapp revision set-mode -g "$RESOURCE_GROUP" -n "$API_NAME" --mode Single --only-show-errors || true
          fi
          echo "Automatic rollback attempted; previous revision restored to 100%." >> "$GITHUB_STEP_SUMMARY"
