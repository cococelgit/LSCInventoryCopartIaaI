name: Stop Non Backfill Scoring Execution

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SCORING_JOB: job-lsc-inventory-scoring-prod
  EXECUTION_NAME: job-lsc-inventory-scoring-prod-sc1ffnw

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Stop only the non-backfill execution
        shell: bash
        run: |
          set -euo pipefail
          before="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --job-execution-name "$EXECUTION_NAME" -o json)"
          echo "$before" | jq '{name, status:.properties.status, startTime:.properties.startTime, template:.properties.template}'
          status="$(echo "$before" | jq -r '.properties.status // .status // "Unknown"')"
          test "$status" = Running
          az containerapp job stop --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --job-execution-name "$EXECUTION_NAME" --only-show-errors
          for attempt in $(seq 1 30); do
            after="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --job-execution-name "$EXECUTION_NAME" -o json)"
            status="$(echo "$after" | jq -r '.properties.status // .status // "Unknown"')"
            echo "STOP_VERIFY attempt=$attempt status=$status"
            case "$status" in
              Succeeded|Failed|Canceled|Cancelled|Stopped) break ;;
            esac
            sleep 5
          done
          case "$status" in
            Succeeded|Failed|Canceled|Cancelled|Stopped) ;;
            *) echo "Execution did not stop: $status" >&2; exit 1 ;;
          esac
          echo "STOPPED_NON_BACKFILL_EXECUTION=$EXECUTION_NAME FINAL_STATUS=$status"
