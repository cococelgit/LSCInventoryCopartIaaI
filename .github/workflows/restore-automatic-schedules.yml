name: Restore Automatic Auction Schedules

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_AUCTION_SCHEDULES"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: restore-automatic-auction-schedules
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Restore schedules with guarded execution policy
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_AUCTION_SCHEDULES
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running']" -o json | jq 'length')"
            test "$active" -eq 0
            job_id="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
            body='{"properties":{"configuration":{"triggerType":"Schedule","replicaTimeout":10800,"replicaRetryLimit":0,"scheduleTriggerConfig":{"cronExpression":"0 */3 * * *","parallelism":1,"replicaCompletionCount":1}}}}'
            az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors
            echo "RESTORED_SCHEDULE=$job CRON=0 */3 * * * RETRY=0"
          done
      - name: Verify schedules and protected runtime values
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Schedule
            test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = '0 */3 * * *'
            test "$(echo "$json" | jq -r '.properties.configuration.replicaRetryLimit')" = 0
            test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.parallelism')" = 1
            echo "$json" | jq '{name:.name,trigger:.properties.configuration.triggerType,cron:.properties.configuration.scheduleTriggerConfig.cronExpression,retry:.properties.configuration.replicaRetryLimit,parallelism:.properties.configuration.scheduleTriggerConfig.parallelism,image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,allowWrites:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites") | .value)}'
          done
          echo "Both automatic schedules restored with no retry duplication policy."
