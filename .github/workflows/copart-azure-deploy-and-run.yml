name: Copart Azure Deploy and Run

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Execution mode
        required: true
        default: normal
        type: choice
        options:
          - normal
          - diagnostics
          - publication_report
          - storage_diagnostics
          - media_probe
          - media_enrich
          - media_404_report
          - future_body_style_backfill
          - reset_and_fresh_future
          - lot_media_diagnostics
          - title_backfill
          - auction_history_backfill
          - auction_history_report
          - scoring_backfill
          - scoring_report
          - seller_audit_report
          - recover
      scoring_limit:
        description: Optional Copart scoring backfill cap; 0 means unlimited
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-azure-deploy-and-run
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  ENVIRONMENT_NAME: cae-lsc-inventory-prod
  COPART_JOB_NAME: job-lsc-copart-excel-prod
  INVENTORY_API_APP_NAME: ca-lsc-inventory-api-prod
  RUNTIME_IDENTITY: /subscriptions/99edf3d1-a651-4d2d-af8e-d44a3360f584/resourceGroups/rg-lsc-inventory-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-lsc-inventory-db-runtime-prod

jobs:
  deploy-and-run:
    name: Build and run isolated Copart processor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Build immutable Inventory Engine image in ACR
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:copart-${GITHUB_SHA}" \
            --file inventory-engine/Dockerfile \
            inventory-engine

      - name: Capture protected Inventory API image before Copart Job update
        shell: bash
        run: |
          set -euo pipefail
          api_image_before="$(az containerapp show --name "$INVENTORY_API_APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          test -n "$api_image_before" && test "$api_image_before" != "None"
          echo "API_IMAGE_BEFORE=$api_image_before" >> "$GITHUB_ENV"
          echo "Protected API image before: $api_image_before"

      - name: Create or update only the isolated Copart Job
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_SERVER}/${IMAGE_NAME}:copart-${GITHUB_SHA}"
          case "${{ inputs.run_mode }}" in
            normal) job_args=("--copart-excel-run"); allow_interrupted_retry=false ;;
            diagnostics) job_args=("--copart-excel-diagnostics"); allow_interrupted_retry=false ;;
            publication_report) job_args=("--copart-publication-report"); allow_interrupted_retry=false ;;
            storage_diagnostics) job_args=("--storage-diagnostics"); allow_interrupted_retry=false ;;
            media_probe) job_args=("--copart-media-probe"); allow_interrupted_retry=false ;;
            media_enrich) job_args=("--copart-media-enrich"); allow_interrupted_retry=false ;;
            media_404_report) job_args=("--copart-media-404-report"); allow_interrupted_retry=false ;;
            future_body_style_backfill) job_args=("--copart-future-body-style-backfill"); allow_interrupted_retry=false ;;
            reset_and_fresh_future) job_args=("--copart-reset-and-fresh-future"); allow_interrupted_retry=false ;;
            lot_media_diagnostics) job_args=("--copart-lot-media-diagnostics=48826366"); allow_interrupted_retry=false ;;
            title_backfill) job_args=("--copart-title-backfill"); allow_interrupted_retry=false ;;
            auction_history_backfill) job_args=("--copart-auction-history-backfill"); allow_interrupted_retry=false ;;
            auction_history_report) job_args=("--copart-auction-history-report"); allow_interrupted_retry=false ;;
            scoring_backfill) job_args=("--copart-scoring-backfill"); allow_interrupted_retry=false ;;
            scoring_report) job_args=("--copart-scoring-report"); allow_interrupted_retry=false ;;
            seller_audit_report) job_args=("--seller-audit-report"); allow_interrupted_retry=false ;;
            recover) job_args=("--copart-excel-run"); allow_interrupted_retry=true ;;
            *) echo "Unsupported run mode." >&2; exit 2 ;;
          esac
          env_args=(
            "CopartExcel__AccountUrl=https://stlscinvprodeus2.blob.core.windows.net"
            "CopartExcel__ContainerName=copart-raw"
            "CopartExcel__MinimumFileSizeKilobytes=1024"
            "CopartExcel__MaximumFileSizeMegabytes=512"
            "CopartExcel__MinimumRowsForCompleteSnapshot=1000"
            "CopartExcel__MinimumRowCountRatioToRecentMedian=0.70"
            "CopartExcel__RecentSnapshotCountForBaseline=6"
            "CopartExcel__ProcessingBatchSize=1000"
            "CopartExcel__PersistenceConcurrency=12"
            "CopartExcel__MediaResolutionConcurrency=8"
            "CopartExcel__AuctionHistoryBackfillBatchSize=100000"
            "CopartExcel__ScoringBackfillBatchSize=500"
            "CopartExcel__ScoringBackfillConcurrency=8"
            "CopartExcel__ScoringBackfillLimit=${{ inputs.scoring_limit }}"
            "CopartExcel__DiagnosticHoldSeconds=300"
            "CopartExcel__PublicationReportHoldSeconds=60"
            "CopartExcel__AllowInterruptedSnapshotRetry=${allow_interrupted_retry}"
            "CopartExcel__FutureBodyStyleBackfillOnly=${{ inputs.run_mode == 'future_body_style_backfill' }}"
            "CopartExcel__BodyStyleBackfillBatchSize=100"
            "CopartExcel__BodyStyleBackfillLimit=100"
            "CopartExcel__BodyStyleBackfillConcurrency=8"
            "CopartExcel__MediaEnrichmentBatchSize=100"
            "CopartExcel__FutureMediaEnrichmentBatchSize=100"
          )
          env_args+=("Persistence__RunMigrations=false")

          if ! az containerapp job show --name "$COPART_JOB_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "The dedicated Copart Job $COPART_JOB_NAME must already exist; this workflow will not create any resource." >&2
            exit 2
          fi

          az containerapp job update \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$image" \
            --command dotnet Lsc.Inventory.Api.dll \
            --args="${job_args[*]}" \
            --set-env-vars "${env_args[@]}" \
            --replica-timeout 3600 \
            --replica-retry-limit 0 \
            --parallelism 1 \
            --replica-completion-count 1 \
            --only-show-errors

      - name: Start the selected isolated Copart Job execution
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --name "$COPART_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          echo "$execution" | jq .
          execution_name="$(echo "$execution" | jq -r '.name // .properties.name // empty')"
          if [ -z "$execution_name" ]; then
            echo "Azure did not return an execution name." >&2
            exit 1
          fi
          echo "COPART_EXECUTION_NAME=$execution_name" >> "$GITHUB_ENV"

      - name: Capture live Copart diagnostic output
        if: ${{ inputs.run_mode == 'diagnostics' || inputs.run_mode == 'publication_report' || inputs.run_mode == 'storage_diagnostics' || inputs.run_mode == 'media_probe' || inputs.run_mode == 'media_enrich' || inputs.run_mode == 'media_404_report' || inputs.run_mode == 'future_body_style_backfill' || inputs.run_mode == 'lot_media_diagnostics' || inputs.run_mode == 'title_backfill' || inputs.run_mode == 'auction_history_backfill' || inputs.run_mode == 'auction_history_report' || inputs.run_mode == 'scoring_backfill' || inputs.run_mode == 'scoring_report' || inputs.run_mode == 'seller_audit_report' }}
        shell: bash
        run: |
          set -euo pipefail
          replica=""
          container=""
          for attempt in {1..12}; do
            replica="$(az containerapp job replica list \
              --name "$COPART_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$COPART_EXECUTION_NAME" \
              --query '[0].name' -o tsv 2>/dev/null || true)"
            container="$(az containerapp job replica list \
              --name "$COPART_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$COPART_EXECUTION_NAME" \
              --query '[0].properties.containers[0].name' -o tsv 2>/dev/null || true)"
            if [ -n "$replica" ] && [ -n "$container" ]; then break; fi
            sleep 5
          done
          if [ -z "$replica" ] || [ -z "$container" ]; then
            echo "Replica or container was unavailable for Copart log capture." >&2
            exit 0
          fi
          az containerapp job logs show \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --execution "$COPART_EXECUTION_NAME" \
            --replica "$replica" \
            --container "$container" \
            --tail 300 \
            --format text || true
          az containerapp job logs show \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --execution "$COPART_EXECUTION_NAME" \
            --replica "$replica" \
            --container "$container" \
            --follow \
            --tail 20 \
            --format text || true

      - name: Wait for the Copart execution result
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            execution="$(az containerapp job execution show \
              --name "$COPART_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$COPART_EXECUTION_NAME" -o json)"
            status="$(echo "$execution" | jq -r '.properties.status // .properties.runningState // "Unknown"')"
            echo "Copart execution status: $status"
            case "$status" in
              Succeeded)
                echo "$execution" | jq .
                echo "Replica completion details:" >&2
                replica_json="$(az containerapp job replica list \
                  --name "$COPART_JOB_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --execution "$COPART_EXECUTION_NAME" \
                  -o json || true)"
                echo "$replica_json" | jq . || true
                replica="$(echo "$replica_json" | jq -r '.[0].name // empty')"
                container="$(echo "$replica_json" | jq -r '.[0].properties.containers[0].name // empty')"
                if [ -n "$replica" ] && [ -n "$container" ]; then
                  az containerapp job logs show \
                    --name "$COPART_JOB_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$COPART_EXECUTION_NAME" \
                    --replica "$replica" \
                    --container "$container" \
                    --tail 300 \
                    --format text || true
                fi
                exit 0
                ;;
              Failed|Canceled)
                echo "$execution" | jq .
                echo "Replica termination details:" >&2
                replica_json="$(az containerapp job replica list \
                  --name "$COPART_JOB_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --execution "$COPART_EXECUTION_NAME" \
                  -o json || true)"
                echo "$replica_json" | jq . || true
                replica="$(echo "$replica_json" | jq -r '.[0].name // empty')"
                container="$(echo "$replica_json" | jq -r '.[0].properties.containers[0].name // empty')"
                if [ -n "$replica" ] && [ -n "$container" ]; then
                  az containerapp job logs show \
                    --name "$COPART_JOB_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --execution "$COPART_EXECUTION_NAME" \
                    --replica "$replica" \
                    --container "$container" \
                    --tail 300 \
                    --format text || true
                fi
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Copart execution." >&2
          exit 1

      - name: Verify protected Inventory API image is unchanged
        shell: bash
        run: |
          set -euo pipefail
          api_image_after="$(az containerapp show --name "$INVENTORY_API_APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          echo "Protected API image after: $api_image_after"
          test "$api_image_after" = "$API_IMAGE_BEFORE"

      - name: Publish execution reference
        run: |
          echo "Image: ${ACR_SERVER}/${IMAGE_NAME}:copart-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: ${COPART_JOB_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution: ${COPART_EXECUTION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Protected API image unchanged: ${API_IMAGE_BEFORE}" >> "$GITHUB_STEP_SUMMARY"
