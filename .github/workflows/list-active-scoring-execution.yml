name: List Active Scoring Execution

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SCORING_JOB: job-lsc-inventory-scoring-prod

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: List active scoring executions and configuration
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json | jq '{name,triggerType:.properties.configuration.triggerType,schedule:.properties.configuration.scheduleTriggerConfig,manual:.properties.configuration.manualTriggerConfig,args:.properties.template.containers[0].args,scoringBackfillMaximum:(.properties.template.containers[0].env[]? | select(.name=="Scoring__BackfillMaximumLots") | .value),scoringRunOnStartup:(.properties.template.containers[0].env[]? | select(.name=="Scoring__RunOnStartup") | .value)}'
          az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json | jq '[.[] | select((.properties.status // .status) == "Running" or (.properties.status // .status) == "Pending") | {name,status:.properties.status,startTime:.properties.startTime}]'
