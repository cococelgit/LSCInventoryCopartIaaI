name: Run AuctionsAPI V2 Initial Block

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to load"
        required: true
        type: choice
        options: [copart, iaai]
      maximum:
        description: "Maximum vehicles in this block (1-1000)"
        required: true
        default: "1000"
        type: string
      start_page:
        description: "AuctionsAPI page cursor"
        required: true
        default: "1"
        type: string
      sale_date_from:
        description: "Minimum auction date as ISO-8601 UTC timestamp"
        required: true
        type: string
      write_mode:
        description: "Type LOAD_V2_WRITE to allow V2 writes; otherwise dry-run"
        required: true
        default: "DRY_RUN"
        type: string
      expected_sha:
        description: "Exact full source SHA"
        required: true
        type: string
      loader_image:
        description: "Existing immutable loader image URI; leave empty to build"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: auctionsapi-v2-initial-block-${{ inputs.platform }}
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  SOURCE_JOB: job-lsc-copart-auto-prod
  TEMP_JOB: job-lsc-v2-initial-block-prod

jobs:
  initial-block:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MAXIMUM: ${{ inputs.maximum }}
          START_PAGE: ${{ inputs.start_page }}
          SALE_DATE_FROM: ${{ inputs.sale_date_from }}
          WRITE_MODE: ${{ inputs.write_mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$MAXIMUM" =~ ^[0-9]+$ ]] && (( MAXIMUM >= 1 && MAXIMUM <= 1000 ))
          [[ "$START_PAGE" =~ ^[0-9]+$ ]] && (( START_PAGE >= 1 ))
          [[ "$SALE_DATE_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          if [[ "$WRITE_MODE" != "DRY_RUN" && "$WRITE_MODE" != "LOAD_V2_WRITE" ]]; then
            echo "write_mode must be DRY_RUN or LOAD_V2_WRITE" >&2
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Build or reuse immutable loader image
        shell: bash
        env:
          EXISTING_IMAGE: ${{ inputs.loader_image }}
        run: |
          set -euo pipefail
          if [[ -n "$EXISTING_IMAGE" ]]; then
            echo "LOADER_IMAGE=$EXISTING_IMAGE" >> "$GITHUB_ENV"
            az acr repository show --name "$ACR_NAME" --image "${EXISTING_IMAGE#*/}" --only-show-errors -o json >/dev/null
          else
            tag="inventory-v2-initial-block-$(git rev-parse HEAD)"
            az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file Dockerfile .
            echo "LOADER_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"
          fi

      - name: Create and run isolated V2 block job
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          MAXIMUM: ${{ inputs.maximum }}
          START_PAGE: ${{ inputs.start_page }}
          SALE_DATE_FROM: ${{ inputs.sale_date_from }}
          WRITE_MODE: ${{ inputs.write_mode }}
        run: |
          set -euo pipefail
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMP_JOB?api-version=2024-03-01"
          cleanup() { az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors || true; }
          trap cleanup EXIT
          cleanup
          source_json="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$SOURCE_JOB?api-version=2024-03-01" -o json)"
          args_json="[\"Lsc.Inventory.Api.dll\",\"--auctionsapi-v2-initial-block\",\"--platform\",\"$PLATFORM\",\"--maximum\",\"$MAXIMUM\",\"--start-page\",\"$START_PAGE\",\"--sale-date-from\",\"$SALE_DATE_FROM\"]"
          if [[ "$WRITE_MODE" == "LOAD_V2_WRITE" ]]; then args_json="$(echo "$args_json" | jq '. + ["--write"]')"; fi
          body="$(echo "$source_json" | jq --arg name "$TEMP_JOB" --arg image "$LOADER_IMAGE" --argjson args "$args_json" '
            .location as $location
            | .properties.environmentId as $environmentId
            | {type:(.identity.type // "UserAssigned"), userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
            | .properties.configuration as $sourceConfiguration
            | .properties.template as $sourceTemplate
            | ($sourceTemplate.containers[0]
                | del(.imageType)
                | .name=$name
                | .image=$image
                | .command=["dotnet"]
                | .args=$args
                | .env=((.env // []) | map(select(((.secretRef // "") == "" and (.name | test("Blob|Storage|AzureWebJobsStorage"; "i") | not)) or .name == "OPENAI_API_KEY")) + [{name:"SellerClassifier__Enabled",value:"true"}])) as $container
            | {location:$location, identity:$identity, properties:{environmentId:$environmentId, configuration:(($sourceConfiguration
                | del(.identitySettings,.scheduleTriggerConfig)
                | .secrets=((.secrets // []) | map(select(.name == "OPENAI_API_KEY")))
                | .triggerType="Manual"
                | .manualTriggerConfig={parallelism:1,replicaCompletionCount:1}
                | .replicaRetryLimit=0
                | .replicaTimeout=1800)), template:($sourceTemplate | .containers=[$container])}}')"
          az rest --method put --uri "$uri" --body "$body" --output none
          for _ in $(seq 1 60); do
            state="$(az rest --method get --uri "$uri" --query 'properties.provisioningState' -o tsv 2>/dev/null || true)"
            case "$state" in Succeeded) break ;; Failed|Canceled) exit 1 ;; esac
            sleep 5
          done
          test "$state" = Succeeded
          execution="$(az containerapp job start --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq -r '.name // .properties.name // empty')"
          test -n "$execution"
          status=Unknown
          for _ in $(seq 1 360); do
            status="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" -o json | jq -r '.properties.status // "Unknown"')"
            case "$status" in Succeeded|Failed|Canceled|Stopped) break ;; esac
            sleep 5
          done
          replicas="$(az containerapp job replica list --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" -o json)"
          replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
          container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
          az containerapp job logs show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" --replica "$replica" --container "$container" --tail 300 --format text | tee "$RUNNER_TEMP/v2-initial-block.log"
          test "$status" = Succeeded
          grep -q '"RunId"' "$RUNNER_TEMP/v2-initial-block.log"
          grep -q '"Platform"' "$RUNNER_TEMP/v2-initial-block.log"
          grep -q '"RequestedMaximum"' "$RUNNER_TEMP/v2-initial-block.log"
          grep -q '"DiscardReasonBreakdown"' "$RUNNER_TEMP/v2-initial-block.log"
          grep -q '"QuarantineReasonBreakdown"' "$RUNNER_TEMP/v2-initial-block.log"
          cleanup
          trap - EXIT
