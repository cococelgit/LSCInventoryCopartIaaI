name: Activate Copart Production Schedule

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-production-schedule
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ENVIRONMENT_NAME: cae-lsc-inventory-prod
  COPART_DOWNLOAD_JOB_NAME: job-lsc-copart-download-prod
  COPART_MANUAL_PROCESS_JOB_NAME: job-lsc-copart-excel-prod
  COPART_SCHEDULED_PROCESS_JOB_NAME: job-lsc-copart-auto-prod
  COPART_MEDIA_JOB_NAME: job-lsc-copart-media-prod
  COPART_DOWNLOAD_CRON: 25,55 * * * *
  COPART_PROCESS_CRON: 0,30 * * * *
  COPART_MEDIA_CRON: 25,55 * * * *
  RUNTIME_IDENTITY: /subscriptions/99edf3d1-a651-4d2d-af8e-d44a3360f584/resourceGroups/rg-lsc-inventory-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-lsc-inventory-db-runtime-prod
  ACR_SERVER: acrlscinvprodeus2.azurecr.io

jobs:
  activate-copart-schedule:
    name: Activate only Copart schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Set Copart download schedule only
        shell: bash
        run: |
          set -euo pipefail
          # Downloads five minutes before each `:00/:30` process run. Updating only its cron preserves Key Vault references and managed identity.
          az containerapp job update \
            --name "$COPART_DOWNLOAD_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --cron-expression "$COPART_DOWNLOAD_CRON" \
            --parallelism 1 \
            --replica-completion-count 1 \
            --replica-retry-limit 0 \
            --only-show-errors

      - name: Create or update dedicated Copart processor schedule
        shell: bash
        run: |
          set -euo pipefail
          # The processor runs at `:00/:30`; IAAI remains owned by its separate job at `:15/:45`.
          # Keep the existing manual processor intact for diagnostic/recovery runs.
          # Copy only its non-secret runtime configuration into a new Schedule-type job.
          manual_job="$(az containerapp job show --name "$COPART_MANUAL_PROCESS_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          processor_image="$(echo "$manual_job" | jq -r '.properties.template.containers[0].image')"
          if [ -z "$processor_image" ] || [ "$processor_image" = "null" ]; then
            echo "Could not obtain the validated Copart processor image." >&2
            exit 1
          fi
          mapfile -t processor_env < <(
            echo "$manual_job" | jq -r '
              .properties.template.containers[0].env[]
              | select(.value != null)
              | "\(.name)=\(.value)"'
          )
          if [ "${#processor_env[@]}" -eq 0 ]; then
            echo "The validated Copart processor has no copyable runtime settings." >&2
            exit 1
          fi

          if az containerapp job show --name "$COPART_SCHEDULED_PROCESS_JOB_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp job update \
              --name "$COPART_SCHEDULED_PROCESS_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$processor_image" \
              --command dotnet Lsc.Inventory.Api.dll \
              --args=--copart-excel-run \
              --cron-expression "$COPART_PROCESS_CRON" \
              --parallelism 1 \
              --replica-completion-count 1 \
              --replica-retry-limit 0 \
              --replica-timeout 3600 \
              --replace-env-vars "${processor_env[@]}" \
              --only-show-errors
          else
            az containerapp job create \
              --name "$COPART_SCHEDULED_PROCESS_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT_NAME" \
              --trigger-type Schedule \
              --cron-expression "$COPART_PROCESS_CRON" \
              --image "$processor_image" \
              --cpu 1.0 \
              --memory 2Gi \
              --command dotnet Lsc.Inventory.Api.dll \
              --args=--copart-excel-run \
              --env-vars "${processor_env[@]}" \
              --replica-timeout 3600 \
              --replica-retry-limit 0 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --mi-user-assigned "$RUNTIME_IDENTITY" \
              --registry-server "$ACR_SERVER" \
              --registry-identity "$RUNTIME_IDENTITY" \
              --only-show-errors
          fi

      - name: Create or update scheduled Copart media enrichment
        shell: bash
        run: |
          set -euo pipefail
          # At :25/:55, the :00/:30 Copart ingest has normally completed and IAAI owns :15/:45.
          # Keep media as a small independent batch: no eligibility, reconciliation, or IAAI writes occur here.
          manual_job="$(az containerapp job show --name "$COPART_MANUAL_PROCESS_JOB_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          media_image="$(echo "$manual_job" | jq -r '.properties.template.containers[0].image')"
          mapfile -t media_env < <(
            echo "$manual_job" | jq -r '
              .properties.template.containers[0].env[]
              | select(.value != null)
              | "\(.name)=\(.value)"'
          )
          if [ -z "$media_image" ] || [ "$media_image" = "null" ] || [ "${#media_env[@]}" -eq 0 ]; then
            echo "Could not obtain validated Copart media runtime settings." >&2
            exit 1
          fi
          if az containerapp job show --name "$COPART_MEDIA_JOB_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp job update \
              --name "$COPART_MEDIA_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$media_image" \
              --command dotnet Lsc.Inventory.Api.dll \
              --args=--copart-media-enrich \
              --cron-expression "$COPART_MEDIA_CRON" \
              --parallelism 1 \
              --replica-completion-count 1 \
              --replica-retry-limit 0 \
              --replica-timeout 900 \
              --replace-env-vars "${media_env[@]}" \
              --only-show-errors
          else
            az containerapp job create \
              --name "$COPART_MEDIA_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT_NAME" \
              --trigger-type Schedule \
              --cron-expression "$COPART_MEDIA_CRON" \
              --image "$media_image" \
              --cpu 1.0 \
              --memory 2Gi \
              --command dotnet Lsc.Inventory.Api.dll \
              --args=--copart-media-enrich \
              --env-vars "${media_env[@]}" \
              --replica-timeout 900 \
              --replica-retry-limit 0 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --mi-user-assigned "$RUNTIME_IDENTITY" \
              --registry-server "$ACR_SERVER" \
              --registry-identity "$RUNTIME_IDENTITY" \
              --only-show-errors
          fi

      - name: Confirm only Copart schedules
        shell: bash
        run: |
          set -euo pipefail
          for job in "$COPART_DOWNLOAD_JOB_NAME" "$COPART_SCHEDULED_PROCESS_JOB_NAME" "$COPART_MEDIA_JOB_NAME"; do
            az containerapp job show \
              --name "$job" \
              --resource-group "$RESOURCE_GROUP" \
              --query '{name:name,triggerType:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,args:properties.template.containers[0].args,parallelism:properties.configuration.scheduleTriggerConfig.parallelism,replicaCompletionCount:properties.configuration.scheduleTriggerConfig.replicaCompletionCount,replicaRetryLimit:properties.configuration.replicaRetryLimit,replicaTimeout:properties.configuration.replicaTimeout}' \
              -o json
          done
