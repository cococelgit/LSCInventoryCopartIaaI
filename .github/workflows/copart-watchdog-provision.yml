name: Provision Copart Durable Watchdog

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE-COPART-WATCHDOG to authorize provisioning
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  LOCATION: eastus2
  FUNCTION_APP: func-lsc-copart-watchdog-prod
  STORAGE_ACCOUNT: stlscinvprodeus2
  TABLE_NAME: CopartExecutionAttempts
  COPART_AUTO_JOB: job-lsc-copart-auto-prod
  API_APP: ca-lsc-inventory-api-prod

jobs:
  provision:
    if: inputs.confirm == 'CREATE-COPART-WATCHDOG'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Provision isolated Copart watchdog
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name storage-preview --only-show-errors || true
          az storage table create --name "$TABLE_NAME" --account-name "$STORAGE_ACCOUNT" --auth-mode login --only-show-errors
          az functionapp create \
            --name "$FUNCTION_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --consumption-plan-location "$LOCATION" \
            --storage-account "$STORAGE_ACCOUNT" \
            --runtime python \
            --runtime-version 3.11 \
            --functions-version 4 \
            --os-type Linux \
            --only-show-errors || true
          principal_id="$(az functionapp identity assign --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query principalId -o tsv)"
          storage_id="$(az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
          job_id="$(az containerapp job show --name "$COPART_AUTO_JOB" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
          az role assignment create --assignee-object-id "$principal_id" --assignee-principal-type ServicePrincipal --role "Storage Table Data Contributor" --scope "$storage_id" --only-show-errors || true
          az role assignment create --assignee-object-id "$principal_id" --assignee-principal-type ServicePrincipal --role Reader --scope "$job_id" --only-show-errors || true
          az functionapp config appsettings set --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --settings \
            COPART_AUTO_JOB_NAME="$COPART_AUTO_JOB" \
            COPART_RESOURCE_GROUP="$RESOURCE_GROUP" \
            COPART_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID" \
            COPART_ATTEMPTS_TABLE="$TABLE_NAME" \
            COPART_STORAGE_TABLE_ENDPOINT="https://${STORAGE_ACCOUNT}.table.core.windows.net" \
            FUNCTIONS_WORKER_RUNTIME=python \
            FUNCTIONS_EXTENSION_VERSION=~4 \
            SCM_DO_BUILD_DURING_DEPLOYMENT=1 \
            --only-show-errors
      - name: Deploy watchdog code
        shell: bash
        run: |
          set -euo pipefail
          cd copart-watchdog
          zip -qr ../copart-watchdog.zip .
          az functionapp deployment source config-zip --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --src ../copart-watchdog.zip --only-show-errors
      - name: Protected post-check
        shell: bash
        run: |
          set -euo pipefail
          api_image="$(az containerapp show --name "$API_APP" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          auto_job="$(az containerapp job show --name "$COPART_AUTO_JOB" --resource-group "$RESOURCE_GROUP" --query '{cron:properties.configuration.scheduleTriggerConfig.cronExpression,image:properties.template.containers[0].image,parallelism:properties.configuration.scheduleTriggerConfig.parallelism,retry:properties.configuration.replicaRetryLimit,timeout:properties.configuration.replicaTimeout}' -o json)"
          echo "API image preserved: ${api_image%%:*}:<protected>"
          echo "Copart job protected configuration: $auto_job"
          test "$api_image" != ""
