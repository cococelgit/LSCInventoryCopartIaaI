name: Retire Copart Excel legacy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "precheck validates only; retire stops and removes approved Excel/Watchdog resources"
        required: true
        type: choice
        default: precheck
        options:
          - precheck
          - retire
      confirmation:
        description: "Required only for retire: RETIRE_COPART_EXCEL_LEGACY"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: retire-copart-excel-legacy-production
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACTIVE_COPART_JOB: job-lsc-copart-auto-prod
  ACTIVE_IAAI_JOB: job-lsc-iaai-pilot-prod
  EXCEL_DOWNLOAD_JOB: job-lsc-copart-download-prod
  EXCEL_PROCESS_JOB: job-lsc-copart-excel-prod
  WATCHDOG_FUNCTION: func-lsc-copart-watchdog-prod
  WATCHDOG_STORAGE: stlscinvprodeus2wd
  EXCEL_VAULT: kv-lsc-copart-prod-eus2
  ACTIVE_STORAGE: stlscinvprodeus2
  ACTIVE_ACR: acrlscinvprodeus2
  EXCEL_IMAGE_REPOSITORY: copart-downloader

jobs:
  retire:
    name: Precheck and retire Excel-only Copart resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Validate isolation and retire approved legacy resources
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          mkdir -p retirement
          exec > >(tee -a retirement/manifest.txt) 2>&1

          fail() { echo "RETIRE_COPART_EXCEL_FAILED: $*" >&2; exit 1; }
          exists() { az resource show --ids "$1" --only-show-errors >/dev/null 2>&1; }
          job_id() { printf '/subscriptions/%s/resourceGroups/%s/providers/Microsoft.App/jobs/%s' "$AZURE_SUBSCRIPTION_ID" "$RESOURCE_GROUP" "$1"; }
          app_id() { printf '/subscriptions/%s/resourceGroups/%s/providers/Microsoft.App/containerApps/%s' "$AZURE_SUBSCRIPTION_ID" "$RESOURCE_GROUP" "$1"; }

          [[ "$ACTION" == "precheck" || "$ACTION" == "retire" ]] || fail "Unknown action: $ACTION"
          if [[ "$ACTION" == "retire" ]]; then
            [[ "$CONFIRMATION" == "RETIRE_COPART_EXCEL_LEGACY" ]] || fail "Explicit confirmation string is required for destructive retirement"
          fi

          echo "RETIRE_COPART_EXCEL_SCOPE=jobs:$EXCEL_DOWNLOAD_JOB,$EXCEL_PROCESS_JOB;function:$WATCHDOG_FUNCTION;storage:$WATCHDOG_STORAGE;vault:$EXCEL_VAULT;containers:copart-raw,copart-quarantine,copart-control;acr-repository:$EXCEL_IMAGE_REPOSITORY"

          active_copart="$(az containerapp job show --name "$ACTIVE_COPART_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          active_iaai="$(az containerapp job show --name "$ACTIVE_IAAI_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          [[ "$(jq -r '.properties.configuration.triggerType' <<<"$active_copart")" == "Schedule" ]] || fail "Active Copart AuctionsAPI job is not scheduled"
          [[ "$(jq -r '.properties.configuration.triggerType' <<<"$active_iaai")" == "Schedule" ]] || fail "Active IAAI job is not scheduled"
          jq -e '[.properties.template.containers[].env[]? | select(.name=="AuctionsApi__Enabled" and .value=="true")] | length > 0' <<<"$active_copart" >/dev/null || fail "Active Copart job does not prove AuctionsAPI is enabled"
          jq -e '[.properties.template.containers[].env[]? | select(.name=="AuctionsApi__AllowWrites" and .value=="true")] | length > 0' <<<"$active_copart" >/dev/null || fail "Active Copart job does not prove AuctionsAPI writes are enabled"

          for protected in "$ACTIVE_COPART_JOB" "$ACTIVE_IAAI_JOB"; do
            payload="$(az containerapp job show --name "$protected" --resource-group "$RESOURCE_GROUP" -o json)"
            jq -e --arg vault "https://$EXCEL_VAULT.vault.azure.net" --arg raw "copart-raw" --arg q "copart-quarantine" --arg c "copart-control" '
              [.. | strings? | select(contains($vault) or .==$raw or .==$q or .==$c)] | length == 0
            ' <<<"$payload" >/dev/null || fail "Protected job $protected still references an Excel-only resource"
          done

          for app in $(az containerapp list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv); do
            payload="$(az containerapp show --name "$app" --resource-group "$RESOURCE_GROUP" -o json)"
            jq -e --arg vault "https://$EXCEL_VAULT.vault.azure.net" --arg raw "copart-raw" --arg q "copart-quarantine" --arg c "copart-control" '
              [.. | strings? | select(contains($vault) or .==$raw or .==$q or .==$c)] | length == 0
            ' <<<"$payload" >/dev/null || fail "Protected Container App $app still references an Excel-only resource"
          done

          active_storage_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$ACTIVE_STORAGE"
          exists "$active_storage_id" || fail "Active Blob Storage account is missing"

          for job in "$EXCEL_DOWNLOAD_JOB" "$EXCEL_PROCESS_JOB"; do
            if exists "$(job_id "$job")"; then
              echo "RETIRE_COPART_EXCEL_JOB_PRESENT=$job"
              az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running'].name" -o tsv | while read -r execution; do
                [[ -n "$execution" ]] || continue
                echo "RETIRE_COPART_EXCEL_STOP_EXECUTION=$job/$execution"
                az containerapp job stop --name "$job" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" --only-show-errors
              done
            fi
          done

          if [[ "$ACTION" == "precheck" ]]; then
            echo "RETIRE_COPART_EXCEL_PRECHECK=PASSED"
            exit 0
          fi

          for job in "$EXCEL_DOWNLOAD_JOB" "$EXCEL_PROCESS_JOB"; do
            if exists "$(job_id "$job")"; then
              echo "RETIRE_COPART_EXCEL_DELETE_JOB=$job"
              az containerapp job delete --name "$job" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors
            fi
          done

          if az functionapp show --name "$WATCHDOG_FUNCTION" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            echo "RETIRE_COPART_EXCEL_DELETE_FUNCTION=$WATCHDOG_FUNCTION"
            az functionapp delete --name "$WATCHDOG_FUNCTION" --resource-group "$RESOURCE_GROUP" --only-show-errors
          fi

          for container in copart-raw copart-quarantine copart-control; do
            container_id="$active_storage_id/blobServices/default/containers/$container"
            if exists "$container_id"; then
              echo "RETIRE_COPART_EXCEL_DELETE_CONTAINER=$container"
              az resource delete --ids "$container_id" --only-show-errors
            fi
          done

          if az acr repository show --name "$ACTIVE_ACR" --repository "$EXCEL_IMAGE_REPOSITORY" --only-show-errors >/dev/null 2>&1; then
            echo "RETIRE_COPART_EXCEL_DELETE_ACR_REPOSITORY=$EXCEL_IMAGE_REPOSITORY"
            az acr repository delete --name "$ACTIVE_ACR" --repository "$EXCEL_IMAGE_REPOSITORY" --yes --only-show-errors
          fi

          if az keyvault show --name "$EXCEL_VAULT" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            echo "RETIRE_COPART_EXCEL_DELETE_KEYVAULT=$EXCEL_VAULT"
            az keyvault delete --name "$EXCEL_VAULT" --resource-group "$RESOURCE_GROUP" --only-show-errors
          fi

          if az storage account show --name "$WATCHDOG_STORAGE" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            echo "RETIRE_COPART_EXCEL_DELETE_WATCHDOG_STORAGE=$WATCHDOG_STORAGE"
            az storage account delete --name "$WATCHDOG_STORAGE" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors
          fi

          for deleted_job in "$EXCEL_DOWNLOAD_JOB" "$EXCEL_PROCESS_JOB"; do
            ! exists "$(job_id "$deleted_job")" || fail "Job still exists after deletion: $deleted_job"
          done
          ! az functionapp show --name "$WATCHDOG_FUNCTION" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1 || fail "Watchdog Function still exists"
          ! az storage account show --name "$WATCHDOG_STORAGE" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1 || fail "Watchdog Storage still exists"
          echo "RETIRE_COPART_EXCEL=COMPLETED"

      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire-copart-excel-legacy-${{ github.run_id }}
          path: retirement/
          if-no-files-found: ignore
          retention-days: 14
