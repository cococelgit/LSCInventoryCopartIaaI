name: Restore Alternating AuctionsAPI Schedules

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_ALTERNATING_AUCTION_SCHEDULES"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: restore-alternating-auctionsapi-schedules
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod
  API_APP: ca-lsc-inventory-api-prod
  OVERLAP_MINUTES: "140"

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Apply alternating schedules and 140 minute window
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_ALTERNATING_AUCTION_SCHEDULES
          test -n "$AUCTIONS_API_KEY"
          api_json="$(az containerapp show --name "$API_APP" --resource-group "$RESOURCE_GROUP" -o json)"
          persistence_env="$(echo "$api_json" | jq '[.properties.template.containers[0].env[]? | select(.name=="Persistence__Provider" or .name=="Persistence__PostgreSqlHost" or .name=="Persistence__Database" or .name=="Persistence__ManagedIdentityClientId" or .name=="Persistence__DatabaseUser" or .name=="Persistence__RuntimePrincipalName" or .name=="Persistence__RuntimePrincipalObjectId" or .name=="Persistence__RunMigrations" or .name=="BlobAudit__AccountUrl" or .name=="BlobAudit__ContainerName") | {name:.name,value:.value}]')"
          test "$(echo "$persistence_env" | jq 'length')" -eq 10
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running']" -o json | jq 'length')"
            test "$active" -eq 0
            current="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            job_id="$(echo "$current" | jq -r '.id')"
            if [ "$job" = "$IAAI_JOB" ]; then
              cron='0 1-23/2 * * *'
            else
              cron='0 0-22/2 * * *'
            fi
            body="$(echo "$current" | jq --arg cron "$cron" --arg minutes "$OVERLAP_MINUTES" --arg apiKey "$AUCTIONS_API_KEY" --argjson persistence "$persistence_env" '
              .properties.template.containers[0] |= (
                del(.imageType)
                | if .name == "job-lsc-iaai-pilot-prod" then
                    .command=["dotnet"]
                    | .args=["Lsc.Inventory.Api.dll","--iaai-national"]
                  else . end
                | .env=((.env // [])
                    | map(select(type=="object") | select(.name != "Persistence__Provider" and .name != "Persistence__PostgreSqlHost" and .name != "Persistence__Database" and .name != "Persistence__ManagedIdentityClientId" and .name != "Persistence__DatabaseUser" and .name != "Persistence__RuntimePrincipalName" and .name != "Persistence__RuntimePrincipalObjectId" and .name != "Persistence__RunMigrations" and .name != "BlobAudit__AccountUrl" and .name != "BlobAudit__ContainerName" and .name != "AuctionsApi__DefaultOverlapMinutes" and .name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites" and .name != "AuctionsApi__ApiKey" and .name != "IaaINational__Enabled" and .name != "IaaINational__RunOnStartup" and .name != "IaaINational__PrimaryProvider" and .name != "IaaINational__FallbackProvider" and .name != "IaaINational__UpdatedWithinMinutes" and .name != "IaaINational__RequireInitialImportCompleted" and .name != "IaaINational__EnforceScheduleWindow" and .name != "IaaINational__ScheduleIntervalHours"))
                    + $persistence
                    + [
                        {name:"AuctionsApi__DefaultOverlapMinutes",value:$minutes},
                        {name:"AuctionsApi__Enabled",value:"true"},
                        {name:"AuctionsApi__AllowWrites",value:"true"},
                        {name:"AuctionsApi__ApiKey",value:$apiKey}
                      ]
                    + (if .name == "job-lsc-iaai-pilot-prod" then [
                        {name:"IaaINational__Enabled",value:"true"},
                        {name:"IaaINational__RunOnStartup",value:"true"},
                        {name:"IaaINational__PrimaryProvider",value:"auctionsapi"},
                        {name:"IaaINational__FallbackProvider",value:"apibara"},
                        {name:"IaaINational__UpdatedWithinMinutes",value:$minutes},
                        {name:"IaaINational__RequireInitialImportCompleted",value:"false"},
                        {name:"IaaINational__EnforceScheduleWindow",value:"false"},
                        {name:"IaaINational__ScheduleIntervalHours",value:"2"}
                      ] else [] end))
              )
              | .properties.configuration |= (
                  del(.identitySettings,.secrets,.manualTriggerConfig)
                  | .triggerType="Schedule"
                  | .scheduleTriggerConfig={cronExpression:$cron,parallelism:1,replicaCompletionCount:1}
                  | .replicaTimeout=10800
                  | .replicaRetryLimit=0)
              | {properties:{template:.properties.template,configuration:.properties.configuration}}')"
            az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors
            echo "CONFIGURED_JOB=$job CRON=$cron OVERLAP_MINUTES=$OVERLAP_MINUTES RETRY=0"
          done
      - name: Verify exact final configuration and protect Excel/catch-up
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            if [ "$job" = "$IAAI_JOB" ]; then expected='0 1-23/2 * * *'; else expected='0 0-22/2 * * *'; fi
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Schedule
            test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = "$expected"
            test "$(echo "$json" | jq -r '.properties.configuration.replicaRetryLimit')" = 0
            test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes")][0].value // ""')" = 140
            test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // ""')" = true
            test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""')" = true
            test -n "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__ApiKey")][0] | .value // .secretRef // ""')"
            if [ "$job" = "$IAAI_JOB" ]; then
              test "$(echo "$json" | jq -r '.properties.template.containers[0].args | join(" ")')" = 'Lsc.Inventory.Api.dll --iaai-national'
              test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="IaaINational__PrimaryProvider")][0].value // ""')" = auctionsapi
              test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="IaaINational__EnforceScheduleWindow")][0].value // ""')" = false
            fi
            echo "$json" | jq '{name:.name,trigger:.properties.configuration.triggerType,cron:.properties.configuration.scheduleTriggerConfig.cronExpression,retry:.properties.configuration.replicaRetryLimit,parallelism:.properties.configuration.scheduleTriggerConfig.parallelism,overlapMinutes:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes") | .value),enabled:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled") | .value),allowWrites:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites") | .value),image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args}'
          done
          excel="$(az containerapp job show --name job-lsc-copart-excel-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$excel" | jq -r '.properties.configuration.triggerType')" = Manual
          test "$(echo "$excel" | jq -r '.properties.configuration.scheduleTriggerConfig // null')" = null
          catchup="$(az containerapp job show --name job-lsc-copart-catchup-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$catchup" | jq -r '.properties.configuration.triggerType')" = Manual
          echo "Excel remains Manual; catch-up remains Manual; no unrelated job was changed."
