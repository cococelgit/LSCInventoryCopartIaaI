name: Diagnose Execution Metrics Canary

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Inventory sync run UUID"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  POSTGRES_HOST: psql-lsc-inventory-cu.postgres.database.azure.com
  POSTGRES_DATABASE: lsc_inventory
  POSTGRES_USER: id-lsc-inventory-loader-prod

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Query canary metrics read-only
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          runner_ip="$(curl -fsS https://api.ipify.org)"
          firewall_rule="allow-execution-metrics-${GITHUB_RUN_ID}"
          cleanup() {
            unset PGPASSWORD || true
            az postgres flexible-server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server-name psql-lsc-inventory-cu --name "$firewall_rule" --yes --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name psql-lsc-inventory-cu \
            --name "$firewall_rule" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors >/dev/null
          export PGPASSWORD="$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)"
          conn="host=$POSTGRES_HOST port=5432 dbname=$POSTGRES_DATABASE user=$POSTGRES_USER sslmode=require"
          for attempt in $(seq 1 12); do
            if psql "$conn" -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null 2>&1; then break; fi
            sleep 5
          done
          psql "$conn" -v ON_ERROR_STOP=1 -P pager=off -v run_id="$RUN_ID" -c "
            select r.run_id, r.provider, r.platform_scope, r.state_scope, r.status,
                   r.vehicles_observed, r.requests_issued,
                   m.loaded_count, m.created_count, m.updated_count, m.unchanged_count, m.stale_count,
                   m.discarded_count, m.quarantined_count, m.error_count,
                   m.archived_observed_count, m.scoring_queued_count,
                   m.scoring_completed_count, m.scoring_failed_count,
                   (coalesce(m.created_count,0) + coalesce(m.updated_count,0) + coalesce(m.unchanged_count,0)) as loaded_reconciled,
                   (coalesce(m.created_count,0) + coalesce(m.updated_count,0) + coalesce(m.unchanged_count,0)
                    + coalesce(m.stale_count,0) + coalesce(m.discarded_count,0) + coalesce(m.quarantined_count,0)) as observed_reconciled
            from public.inventory_sync_runs r
            left join public.inventory_execution_run_metrics m on m.run_id = r.run_id
            where r.run_id = :'run_id'::uuid;
          "
