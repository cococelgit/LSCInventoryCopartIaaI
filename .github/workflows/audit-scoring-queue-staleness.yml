name: Audit Scoring Queue Staleness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: audit-scoring-queue-staleness
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SOURCE_JOB: job-lsc-iaai-inc-v2-prod
  TEMP_JOB: job-lsc-scoring-queue-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Read scoring queue and hash consistency from healthy database
        shell: bash
        run: |
          set -euo pipefail
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMP_JOB?api-version=2024-03-01"

          cleanup() {
            az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors || true
          }
          trap cleanup EXIT
          source_json="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$SOURCE_JOB?api-version=2024-03-01" -o json)"
          source_secrets="$(az containerapp job secret list --name "$SOURCE_JOB" --resource-group "$RESOURCE_GROUP" --show-values -o json)"

          source_env_value() {
            local name="$1" literal ref
            literal="$(echo "$source_json" | jq -r --arg name "$name" '.properties.template.containers[0].env[]? | select(.name == $name) | .value // empty' | head -n1)"
            ref="$(echo "$source_json" | jq -r --arg name "$name" '.properties.template.containers[0].env[]? | select(.name == $name) | .secretRef // empty' | head -n1)"
            if [ -n "$literal" ]; then
              printf '%s' "$literal"
            elif [ -n "$ref" ]; then
              echo "$source_secrets" | jq -r --arg ref "$ref" '.[] | select(.name == $ref) | .value // empty' | head -n1
            fi
          }

          db_host="$(source_env_value Persistence__PostgreSqlHost)"
          db_name="$(source_env_value Persistence__Database)"
          db_user="$(source_env_value Persistence__DatabaseUser)"
          db_client_id="$(source_env_value Persistence__ManagedIdentityClientId)"
          test -n "$db_host"
          test -n "$db_name"
          test -n "$db_user"
          test -n "$db_client_id"

          read -r -d '' script <<'SCRIPT' || true
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl jq ca-certificates >/dev/null
          token_response="$(curl --fail --silent --show-error --max-time 30 \
            --header "X-IDENTITY-HEADER: ${IDENTITY_HEADER}" \
            "${IDENTITY_ENDPOINT}?resource=https%3A%2F%2Fossrdbms-aad.database.windows.net&api-version=2019-08-01&client_id=${AZURE_CLIENT_ID}")"
          export PGPASSWORD="$(printf '%s' "$token_response" | jq -r '.access_token')"
          test -n "$PGPASSWORD"
          psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            "host=$PGHOST port=5432 dbname=$PGDATABASE user=$PGUSER sslmode=require" <<'SQL'
          begin transaction read only;
          set local statement_timeout = '45s';
          select json_build_object('section','queue_state','status',q.status,'rows',count(*),'inventoryMissing',count(*) filter (where c.lot_key is null),'inactive',count(*) filter (where not coalesce(c.is_active,false)),'hashMismatch',count(*) filter (where c.score_input_hash is distinct from q.input_hash),'alreadyCurrentScore',count(*) filter (where s.input_hash=c.score_input_hash and s.policy_version=q.policy_version),'activeHashMatching',count(*) filter (where c.is_active and c.score_input_hash=q.input_hash))::text
          from inventory_vehicle_scoring_queue q left join inventory_current_v2 c on c.lot_key=q.lot_key left join inventory_vehicle_score_current s on s.lot_key=q.lot_key
          where q.status in ('queued','processing','failed') group by q.status;
          select json_build_object('section','failure_reason','lastError',last_error,'rows',count(*))::text from inventory_vehicle_scoring_queue where status='failed' group by last_error order by count(*) desc limit 5;
          select json_build_object('section','failed_example','lot',q.lot_key,'status',q.status,'attempts',q.attempts,'isActive',c.is_active,'queueHash',q.input_hash,'currentHash',c.score_input_hash,'scoreHash',s.input_hash,'lastSeen',c.last_seen_at,'queueUpdated',q.updated_at,'error',q.last_error)::text from inventory_vehicle_scoring_queue q left join inventory_current_v2 c on c.lot_key=q.lot_key left join inventory_vehicle_score_current s on s.lot_key=q.lot_key where q.status='failed' order by q.updated_at desc limit 8;
          commit;
          SQL
          SCRIPT

          body="$(echo "$source_json" | jq \
            --arg name "$TEMP_JOB" \
            --arg host "$db_host" \
            --arg database "$db_name" \
            --arg user "$db_user" \
            --arg clientId "$db_client_id" \
            --arg script "$script" '
              .location as $location
              | .properties.environmentId as $environmentId
              | {type:(.identity.type // "UserAssigned"), userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
              | {
                  location:$location,
                  identity:$identity,
                  properties:{
                    environmentId:$environmentId,
                    configuration:{
                      triggerType:"Manual",
                      replicaTimeout:600,
                      replicaRetryLimit:0,
                      manualTriggerConfig:{parallelism:1,replicaCompletionCount:1}
                    },
                    template:{
                      containers:[{
                        name:$name,
                        image:"postgres:16-bookworm",
                        command:["/bin/bash","-lc"],
                        args:[$script],
                        resources:{cpu:0.5,memory:"1Gi"},
                        env:[
                          {name:"PGHOST",value:$host},
                          {name:"PGDATABASE",value:$database},
                          {name:"PGUSER",value:$user},
                          {name:"PGSSLMODE",value:"require"},
                          {name:"AZURE_CLIENT_ID",value:$clientId}
                        ]
                      }]
                    }
                  }
                }
            ')"

          az rest --method put --uri "$uri" --body "$body" --output none
          state=Unknown
          for _ in $(seq 1 60); do
            state="$(az rest --method get --uri "$uri" --query 'properties.provisioningState' -o tsv 2>/dev/null || true)"
            case "$state" in Succeeded) break ;; Failed|Canceled) exit 1 ;; esac
            sleep 5
          done
          test "$state" = Succeeded

          execution="$(az containerapp job start --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq -r '.name // .properties.name // empty')"
          test -n "$execution"
          status=Unknown
          for _ in $(seq 1 120); do
            status="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" -o json | jq -r '.properties.status // "Unknown"')"
            case "$status" in Succeeded|Failed|Canceled|Stopped) break ;; esac
            sleep 5
          done

          replicas="$(az containerapp job replica list --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" -o json || true)"
          replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
          container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
          test -n "$replica"
          test -n "$container"
          mkdir -p evidence
          az containerapp job logs show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" --replica "$replica" --container "$container" --tail 100 --format text | tee evidence/queue-audit.txt
          test "$status" = Succeeded

          cleanup
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoring-queue-audit-${{ github.run_id }}
          path: evidence/
          retention-days: 14
