name: Copart Processing Fix CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'inventory-engine/**'
      - '.github/workflows/copart-fix-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and test Copart scenarios
        run: dotnet test inventory-engine/Lsc.Inventory.sln -c Release --filter FullyQualifiedName~Copart

      - name: Restore and test Inventory Engine
        run: dotnet test inventory-engine/Lsc.Inventory.sln -c Release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check
