name: Restore Automatic Job Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_AUTOMATIC_RUNTIME"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Restore paused job runtimes
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_AUTOMATIC_RUNTIME
          test -n "$AUCTIONS_API_KEY"
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            before="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$before" | jq -r '.properties.configuration.triggerType')" = Manual
            job_id="$(echo "$before" | jq -r '.id')"
            if [ "$job" = "$IAAI_JOB" ]; then
              command='["dotnet"]'
              args='["Lsc.Inventory.Api.dll","--iaai-national"]'
            else
              command='["/app/run-auctionsapi-dry-run.sh"]'
              args='["copart","run","500"]'
            fi
            body="$(echo "$before" | jq --argjson command "$command" --argjson args "$args" --arg apiKey "$AUCTIONS_API_KEY" --arg job "$job" '
              .properties.template.containers[0] |= del(.imageType)
              | .properties.template.containers[0].command=$command
              | .properties.template.containers[0].args=$args
              | .properties.template.containers[0].env=((.properties.template.containers[0].env // [])
                  | map(select(.name != "AuctionsApi__ApiKey" and .name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites" and .name != "AuctionsApi__DefaultOverlapMinutes" and .name != "IaaINational__Enabled" and .name != "IaaINational__RunOnStartup" and .name != "IaaINational__PrimaryProvider" and .name != "IaaINational__FallbackProvider" and .name != "IaaINational__UpdatedWithinMinutes" and .name != "IaaINational__RequireInitialImportCompleted" and .name != "IaaINational__EnforceScheduleWindow" and .name != "IaaINational__ScheduleIntervalHours"))
                  + [
                      {name:"AuctionsApi__ApiKey",value:$apiKey},
                      {name:"AuctionsApi__Enabled",value:"true"},
                      {name:"AuctionsApi__AllowWrites",value:"true"},
                      {name:"AuctionsApi__DefaultOverlapMinutes",value:"140"}
                    ]
                  + (if $job == "job-lsc-iaai-pilot-prod" then [
                      {name:"IaaINational__Enabled",value:"true"},
                      {name:"IaaINational__RunOnStartup",value:"true"},
                      {name:"IaaINational__PrimaryProvider",value:"auctionsapi"},
                      {name:"IaaINational__FallbackProvider",value:"apibara"},
                      {name:"IaaINational__UpdatedWithinMinutes",value:"140"},
                      {name:"IaaINational__RequireInitialImportCompleted",value:"false"},
                      {name:"IaaINational__EnforceScheduleWindow",value:"false"},
                      {name:"IaaINational__ScheduleIntervalHours",value:"2"}
                    ] else [] end))
              | {properties:{template:.properties.template}}')"
            az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors
            echo "RESTORED_RUNTIME=$job"
          done
      - name: Verify runtimes and paused schedules
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Manual
            test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // ""')" = true
            test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""')" = true
            test -n "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__ApiKey")][0] | .value // .secretRef // ""')"
            echo "$json" | jq '{name:.name,trigger:.properties.configuration.triggerType,image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,enabled:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled") | .value),allowWrites:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites") | .value),overlapMinutes:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes") | .value)}'
          done
          echo "Runtime restored; schedules remain paused; no execution started."
