name: Restore Automatic Job Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_AUTOMATIC_RUNTIME"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Restore paused job runtimes
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RESTORE_AUTOMATIC_RUNTIME
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            before="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$before" | jq -r '.properties.configuration.triggerType')" = Manual
            job_id="$(echo "$before" | jq -r '.id')"
            if [ "$job" = "$IAAI_JOB" ]; then
              command='["dotnet"]'
              args='["Lsc.Inventory.Api.dll"]'
            else
              command='["/app/run-auctionsapi-dry-run.sh"]'
              args='["copart","run","500"]'
            fi
            body="$(echo "$before" | jq --argjson command "$command" --argjson args "$args" '
              .properties.template.containers[0] |= del(.imageType)
              | .properties.template.containers[0].command=$command
              | .properties.template.containers[0].args=$args
              | .properties.template.containers[0].env=((.properties.template.containers[0].env // []) | map(select(.name != "AuctionsApi__AllowWrites")) + [{name:"AuctionsApi__AllowWrites",value:"true"}])
              | {properties:{template:.properties.template}}')"
            az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors
            echo "RESTORED_RUNTIME=$job"
          done
      - name: Verify runtimes and paused schedules
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Manual
            echo "$json" | jq '{name:.name,trigger:.properties.configuration.triggerType,image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,allowWrites:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites") | .value)}'
          done
          echo "Runtime restored; schedules remain paused; no execution started."
