name: Azure Readonly Inventory Audit
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Collect readonly inventory and cost data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          az extension add --name resource-graph --upgrade --only-show-errors || true
          az group list -o json > audit/resource-groups.json
          az resource list --subscription "$AZURE_SUBSCRIPTION_ID" -o json > audit/resources.json
          az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --query '[].{name:name,type:type,location:location,resourceGroup:resourceGroup,kind:kind,sku:sku,tags:tags}' -o json > audit/resources-summary.json
          az graph query -q "Resources | summarize count() by type | order by count_ desc" --subscriptions "$AZURE_SUBSCRIPTION_ID" -o json > audit/resource-types.json || true
          az consumption usage list --subscription "$AZURE_SUBSCRIPTION_ID" --start-date $(date -u -d '31 days ago' +%Y-%m-%d) --end-date $(date -u +%Y-%m-%d) --top 5000 -o json > audit/consumption-usage-31d.json || true
          az costmanagement query --scope "/subscriptions/$AZURE_SUBSCRIPTION_ID" --type ActualCost --timeframe Custom --time-period from=$(date -u -d '31 days ago' +%Y-%m-%d),to=$(date -u +%Y-%m-%d) --dataset '{"granularity":"Daily","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ResourceGroupName"},{"type":"Dimension","name":"ResourceType"}]}' -o json > audit/cost-by-rg-type-31d.json || true
          az costmanagement query --scope "/subscriptions/$AZURE_SUBSCRIPTION_ID" --type ActualCost --timeframe Custom --time-period from=$(date -u -d '31 days ago' +%Y-%m-%d),to=$(date -u +%Y-%m-%d) --dataset '{"granularity":"None","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ResourceId"},{"type":"Dimension","name":"Meter"}]}' -o json > audit/cost-by-resource-meter-31d.json || true
          date -u > audit/collected-at.txt
      - name: Upload readonly audit
        uses: actions/upload-artifact@v4
        with:
          name: azure-readonly-inventory-audit-${{ github.run_id }}
          path: audit
          retention-days: 7
          if-no-files-found: error
      - name: Print compact inventory summary
        shell: bash
        run: |
          jq -r 'group_by(.resourceGroup)[] | "\(.[0].resourceGroup)\t\(.|length) resources"' audit/resources.json | sort
          jq -r '.properties.rows // [] | .[] | @tsv' audit/cost-by-rg-type-31d.json 2>/dev/null | head -50 || true
          echo 'READONLY_AUDIT_COMPLETE=true'
      - name: Reject mutations in workflow source
        shell: bash
        run: |
          ! grep -REn 'az (create|update|delete|set|patch|start|stop|restart|scale|deploy)' "$GITHUB_WORKSPACE/.github/workflows/azure-readonly-inventory-audit.yml"
        continue-on-error: false
      - name: Finalize
        run: echo 'No Azure resource mutation commands were executed.'

      
