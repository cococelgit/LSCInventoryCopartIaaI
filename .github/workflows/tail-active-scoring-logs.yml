name: Tail Active Scoring Logs

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SCORING_JOB: job-lsc-inventory-scoring-prod

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Read active execution logs
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json | jq -r '[.[] | select((.properties.status // .status) == "Running" or (.properties.status // .status) == "Pending") | .name] | .[0] // empty')"
          test -n "$execution"
          echo "ACTIVE_EXECUTION=$execution"
          replicas="$(az containerapp job replica list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --execution "$execution" -o json 2>/dev/null || echo '[]')"
          replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
          container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
          echo "REPLICA=$replica CONTAINER=$container"
          test -n "$replica" && test -n "$container"
          az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --execution "$execution" --replica "$replica" --container "$container" --tail 120 --format text
