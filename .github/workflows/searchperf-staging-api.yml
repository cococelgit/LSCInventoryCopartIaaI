name: Search performance staging API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE-LSC-STAGING-API to deploy only the isolated search-performance API"
        required: true
        type: string
      operation:
        description: "Select the allowlisted one-shot operation"
        required: true
        type: choice
        options:
          - migration
          - report
          - sample
          - api-only

permissions:
  contents: read
  id-token: write

concurrency:
  group: search-performance-staging-api
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID:  e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID:  ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  LOCATION: eastus2
  STAGING_RESOURCE_GROUP: rg-lsc-inventory-staging
  STAGING_POSTGRES_SERVER: psql-lsc-inventory-staging
  STAGING_IDENTITY_NAME: uai-lsc-searchperf-staging
  STAGING_STORAGE_ACCOUNT: stgsearch
  STAGING_ENVIRONMENT: cae-lsc-searchperf-staging
  STAGING_API_NAME: ca-lsc-searchperf-api-staging
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  PROD_RESOURCE_GROUP: rg-lsc-inventory-prod
  PROD_API_NAME: ca-lsc-inventory-api-prod
  GITHUB_BOOTSTRAP_OBJECT_ID: 547895b8-3b4e-490a-8135-a3d82d7fdeca

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "CREATE-LSC-STAGING-API"
          case "${{ inputs.operation }}" in migration|report|sample|api-only) ;; *) exit 1 ;; esac

      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: manus/search-latency-prod-base
          fetch-depth: 1

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Verify Production fingerprint before any Staging operation
        shell: bash
        run: |
          set -euo pipefail
          prod_image="$(az containerapp show -g "$PROD_RESOURCE_GROUP" -n "$PROD_API_NAME" --query 'properties.template.containers[0].image' -o tsv)"
          prod_revision="$(az containerapp show -g "$PROD_RESOURCE_GROUP" -n "$PROD_API_NAME" --query 'properties.latestRevisionName' -o tsv)"
          echo "PROD_IMAGE_BEFORE=$prod_image" >> "$GITHUB_ENV"
          echo "PROD_REVISION_BEFORE=$prod_revision" >> "$GITHUB_ENV"
          test -n "$prod_image" && test -n "$prod_revision"

      - name: Create isolated managed identity
        shell: bash
        run: |
          set -euo pipefail
          if ! az identity show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_IDENTITY_NAME" --only-show-errors >/dev/null 2>&1; then
            az identity create -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_IDENTITY_NAME" -l "$LOCATION" --only-show-errors >/dev/null
          fi
          identity_id="$(az identity show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_IDENTITY_NAME" --query id -o tsv)"
          identity_client_id="$(az identity show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_IDENTITY_NAME" --query clientId -o tsv)"
          identity_principal_id="$(az identity show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_IDENTITY_NAME" --query principalId -o tsv)"
          echo "STAGING_IDENTITY_ID=$identity_id" >> "$GITHUB_ENV"
          echo "STAGING_IDENTITY_CLIENT_ID=$identity_client_id" >> "$GITHUB_ENV"
          echo "STAGING_IDENTITY_PRINCIPAL_ID=$identity_principal_id" >> "$GITHUB_ENV"

      - name: Configure isolated PostgreSQL Entra access
        shell: bash
        run: |
          set -euo pipefail
          az postgres flexible-server firewall-rule create \
            -g "$STAGING_RESOURCE_GROUP" \
            -s "$STAGING_POSTGRES_SERVER" \
            -n allow-azure-services \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0 \
            --only-show-errors >/dev/null || true
          az postgres flexible-server microsoft-entra-admin create \
            -g "$STAGING_RESOURCE_GROUP" \
            -s "$STAGING_POSTGRES_SERVER" \
            -u github-actions-staging-bootstrap \
            -i "$GITHUB_BOOTSTRAP_OBJECT_ID" \
            -t ServicePrincipal \
            --only-show-errors >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          db_name="$(az containerapp show -g "$PROD_RESOURCE_GROUP" -n "$PROD_API_NAME" --query "properties.template.containers[0].env[?name=='Persistence__Database'].value | [0]" -o tsv)"
          test -n "$db_name" && test "$db_name" != "None"
          echo "STAGING_DATABASE=$db_name" >> "$GITHUB_ENV"
          access_token="$(az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv)"
          export PGPASSWORD="$access_token"
          if ! psql "host=psql-lsc-inventory-staging.postgres.database.azure.com port=5432 dbname=postgres user=github-actions-staging-bootstrap sslmode=require" \
            -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$STAGING_IDENTITY_NAME'" | grep -qx '1'; then
            psql "host=psql-lsc-inventory-staging.postgres.database.azure.com port=5432 dbname=postgres user=github-actions-staging-bootstrap sslmode=require" \
              -v ON_ERROR_STOP=1 \
              -c "SELECT pgaadauth_create_principal('$STAGING_IDENTITY_NAME', false, false);"
          fi
          psql "host=psql-lsc-inventory-staging.postgres.database.azure.com port=5432 dbname=postgres user=github-actions-staging-bootstrap sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE \"$db_name\" TO \"$STAGING_IDENTITY_NAME\";"
          psql "host=psql-lsc-inventory-staging.postgres.database.azure.com port=5432 dbname=$db_name user=github-actions-staging-bootstrap sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO \"$STAGING_IDENTITY_NAME\"; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"$STAGING_IDENTITY_NAME\"; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO \"$STAGING_IDENTITY_NAME\"; ALTER TABLE inventory_search_current OWNER TO \"$STAGING_IDENTITY_NAME\"; ALTER TABLE inventory_vehicle_score_current OWNER TO \"$STAGING_IDENTITY_NAME\"; ALTER TABLE schema_migrations OWNER TO \"$STAGING_IDENTITY_NAME\";"

      - name: Create isolated Blob Storage
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID:0:10}"
          storage_name="${STAGING_STORAGE_ACCOUNT}${suffix}"
          az storage account create -g "$STAGING_RESOURCE_GROUP" -n "$storage_name" -l "$LOCATION" --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 --allow-blob-public-access false --only-show-errors >/dev/null
          storage_id="$(az storage account show -g "$STAGING_RESOURCE_GROUP" -n "$storage_name" --query id -o tsv)"
          storage_url="https://${storage_name}.blob.core.windows.net"
          storage_key="$(az storage account keys list -g "$STAGING_RESOURCE_GROUP" -n "$storage_name" --query '[0].value' -o tsv)"
          az storage container create --account-name "$storage_name" --account-key "$storage_key" --name raw-apibara --only-show-errors >/dev/null
          echo "STAGING_STORAGE_NAME=$storage_name" >> "$GITHUB_ENV"
          echo "STAGING_STORAGE_URL=$storage_url" >> "$GITHUB_ENV"

      - name: Create isolated Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp env show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_ENVIRONMENT" --only-show-errors >/dev/null 2>&1; then
            az containerapp env create -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_ENVIRONMENT" -l "$LOCATION" --environment-mode ConsumptionOnly --only-show-errors >/dev/null
          fi

      - name: Build immutable candidate image in ACR
        shell: bash
        run: |
          set -euo pipefail
          image_tag="searchperf-staging-${GITHUB_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$image_tag" --file inventory-engine/Dockerfile inventory-engine
          echo "STAGING_IMAGE=$ACR_SERVER/$IMAGE_NAME:$image_tag" >> "$GITHUB_ENV"
          registry_identity="$(az identity show -g "$PROD_RESOURCE_GROUP" -n uai-lsc-inventory-release-afaac3d --query id -o tsv)"
          test -n "$registry_identity" && test "$registry_identity" != "None"
          echo "REGISTRY_IDENTITY_ID=$registry_identity" >> "$GITHUB_ENV"

      - name: Create or update isolated API Container App
        shell: bash
        run: |
          set -euo pipefail
          inventory_token="$(openssl rand -hex 32)"
          echo "::add-mask::$inventory_token"
          echo "STAGING_INVENTORY_TOKEN=$inventory_token" >> "$GITHUB_ENV"
          if ! az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --only-show-errors >/dev/null 2>&1; then
            az containerapp create \
              -g "$STAGING_RESOURCE_GROUP" \
              -n "$STAGING_API_NAME" \
              --environment "$STAGING_ENVIRONMENT" \
              --image "$STAGING_IMAGE" \
              --user-assigned "$STAGING_IDENTITY_ID" \
              --registry-server "$ACR_SERVER" \
              --registry-identity "$REGISTRY_IDENTITY_ID" \
              --ingress external \
              --target-port 8080 \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --secrets "inventory-api-token=$inventory_token" \
              --env-vars \
                "Sync__Enabled=false" \
                "Persistence__Provider=Postgres" \
                "Persistence__PostgreSqlHost=psql-lsc-inventory-staging.postgres.database.azure.com" \
                "Persistence__Database=$STAGING_DATABASE" \
                "Persistence__ManagedIdentityClientId=$STAGING_IDENTITY_CLIENT_ID" \
                "Persistence__DatabaseUser=$STAGING_IDENTITY_NAME" \
                "Persistence__RuntimePrincipalName=$STAGING_IDENTITY_NAME" \
                "Persistence__RuntimePrincipalObjectId=$STAGING_IDENTITY_PRINCIPAL_ID" \
                "Persistence__RunMigrations=false" \
                "Persistence__UseDenormalizedScoringSearch=false" \
                "Persistence__RunBrowseCountAndItemsInParallel=false" \
                "SearchProjection__WarmupOnStartup=false" \
                "MotivatedSellers__ReadEnabled=true" \
                "InventoryApi__Token=secretref:inventory-api-token" \
                "BlobAudit__AccountUrl=$STAGING_STORAGE_URL" \
                "BlobAudit__ContainerName=raw-apibara" \
                "CopartExcel__AccountUrl=$STAGING_STORAGE_URL" \
              --only-show-errors >/dev/null
          else
            az containerapp update -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --image "$STAGING_IMAGE" --revision-suffix "searchperf-${GITHUB_RUN_NUMBER}" --set-env-vars \
              "Sync__Enabled=false" \
              "Persistence__RunMigrations=false" \
              "Persistence__UseDenormalizedScoringSearch=false" \
              "Persistence__RunBrowseCountAndItemsInParallel=false" \
              "SearchProjection__WarmupOnStartup=false" \
              "MotivatedSellers__ReadEnabled=true" \
              "InventoryApi__Token=secretref:inventory-api-token" \
              "Persistence__PostgreSqlHost=psql-lsc-inventory-staging.postgres.database.azure.com" \
              "Persistence__Database=$STAGING_DATABASE" \
              "Persistence__ManagedIdentityClientId=$STAGING_IDENTITY_CLIENT_ID" \
              "Persistence__DatabaseUser=$STAGING_IDENTITY_NAME" \
              "Persistence__RuntimePrincipalName=$STAGING_IDENTITY_NAME" \
              "Persistence__RuntimePrincipalObjectId=$STAGING_IDENTITY_PRINCIPAL_ID" \
              "BlobAudit__AccountUrl=$STAGING_STORAGE_URL" \
              "BlobAudit__ContainerName=raw-apibara" \
              --only-show-errors >/dev/null
            az containerapp secret set -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --secrets "inventory-api-token=$inventory_token" --only-show-errors >/dev/null
          fi
          if [[ "${{ inputs.operation }}" == "api-only" ]]; then
            az containerapp revision set-mode -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --mode Single --only-show-errors >/dev/null
          fi
      - name: Verify authenticated Motivated Sellers sample in Staging
        if: ${{ inputs.operation == 'api-only' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fqdn="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          test -n "$fqdn" && test "$fqdn" != "None"
          response_file="$(mktemp)"
          status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$response_file" -w '%{http_code}' -H "Authorization: Bearer $STAGING_INVENTORY_TOKEN" "https://$fqdn/internal/copart/auction-history-sample")"
          test "$status" = "200"
          jq '{generatedAt, count, sampleCount: (.samples | length)}' "$response_file"
          echo "STAGING_MOTIVATED_SAMPLE_HTTP=$status"

      - name: Run internal Staging migration runner
        if: ${{ inputs.operation != 'api-only' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          job="job-lsc-spmig-stg-${GITHUB_RUN_NUMBER}"
          operation="${{ inputs.operation }}"
          runner_command=dotnet
          runner_first_arg=Lsc.Inventory.Api.dll
          if [[ "$operation" == "report" ]]; then
            runner_second_arg=copart-auction-history-report
          elif [[ "$operation" == "sample" ]]; then
            runner_second_arg=copart-auction-history-sample
          else
            runner_second_arg=search-projection-migration
          fi
          cleanup() {
            az containerapp job delete -g "$STAGING_RESOURCE_GROUP" -n "$job" --yes --only-show-errors >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          acr_user="00000000-0000-0000-0000-000000000000"
          acr_password="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
          test -n "$acr_password"
          echo "::add-mask::$acr_password"
          az containerapp job create \
            -g "$STAGING_RESOURCE_GROUP" -n "$job" \
            --environment "$STAGING_ENVIRONMENT" \
            --trigger-type Manual \
            --replica-timeout 900 \
            --parallelism 1 \
            --replica-completion-count 1 \
            --image "$STAGING_IMAGE" \
            --registry-server "$ACR_SERVER" \
            --registry-username "$acr_user" \
            --registry-password "$acr_password" \
            --mi-user-assigned "$STAGING_IDENTITY_ID" \
            --command "$runner_command" \
            --args "$runner_first_arg" "$runner_second_arg" \
            --env-vars \
              "Persistence__Provider=Postgres" \
              "Persistence__PostgreSqlHost=psql-lsc-inventory-staging.postgres.database.azure.com" \
              "Persistence__Database=$STAGING_DATABASE" \
              "Persistence__ManagedIdentityClientId=$STAGING_IDENTITY_CLIENT_ID" \
              "Persistence__DatabaseUser=$STAGING_IDENTITY_NAME" \
              "Persistence__RuntimePrincipalName=$STAGING_IDENTITY_NAME" \
              "Persistence__RuntimePrincipalObjectId=$STAGING_IDENTITY_PRINCIPAL_ID" \
              "Persistence__RunMigrations=false" \
              "Sync__Enabled=false" \
              "BlobAudit__AccountUrl=$STAGING_STORAGE_URL" \
              "BlobAudit__ContainerName=raw-apibara" \
            --only-show-errors >/dev/null
          az containerapp job start -g "$STAGING_RESOURCE_GROUP" -n "$job" --only-show-errors >/dev/null
          for attempt in $(seq 1 120); do
            execution="$(az containerapp job execution list -g "$STAGING_RESOURCE_GROUP" -n "$job" --query '[0].name' -o tsv 2>/dev/null || true)"
            status="$(az containerapp job execution list -g "$STAGING_RESOURCE_GROUP" -n "$job" --query '[0].properties.status' -o tsv 2>/dev/null || true)"
            echo "staging migration attempt=$attempt execution=$execution status=$status"
            [[ "$status" == "Succeeded" ]] && break
            if [[ "$status" == "Failed" || "$status" == "Stopped" ]]; then
              replica="$(az containerapp job replica list -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].name' -o tsv 2>/dev/null || true)"
              container="$(az containerapp job replica list -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].properties.containers[0].name' -o tsv 2>/dev/null || true)"
              echo "staging migration replica=$replica container=$container"
              if [[ -n "$replica" && -n "$container" ]]; then
                az containerapp job logs show -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --replica "$replica" --container "$container" --tail 100 --format text || true
              fi
              exit 1
            fi
            sleep 10
          done
          test "${status:-}" = "Succeeded"
          if [[ "$operation" == "report" ]]; then
            replica="$(az containerapp job replica list -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].name' -o tsv 2>/dev/null || true)"
            container="$(az containerapp job replica list -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --query '[0].properties.containers[0].name' -o tsv 2>/dev/null || true)"
            if [[ -n "$replica" && -n "$container" ]]; then
              report_log="$(az containerapp job logs show -g "$STAGING_RESOURCE_GROUP" -n "$job" --execution "$execution" --replica "$replica" --container "$container" --tail 100 --format text 2>/dev/null || true)"
              printf '%s\n' "$report_log"
              {
                echo "### Copart auction-history report"
                printf '%s\n' '```text'
                printf '%s\n' "$report_log"
                printf '%s\n' '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "STAGING_MIGRATION_RUNNER=Succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify authenticated history sample after report
        if: ${{ inputs.operation == 'report' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fqdn="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          response_file="$(mktemp)"
          status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$response_file" -w '%{http_code}' -H "Authorization: Bearer $STAGING_INVENTORY_TOKEN" "https://$fqdn/internal/copart/auction-history-sample")"
          test "$status" = "200"
          jq '{generatedAt, count, signalLevels: ([.samples[] | select(.signalLevel != null) | .signalLevel] | sort | group_by(.) | map({key: .[0], value: length}) | from_entries), withSignal: ([.samples[] | select(.hasSignal == true)] | length), maxAttempts: ([.samples[].attemptCount] | max // 0)}' "$response_file"
          echo "STAGING_HISTORY_SAMPLE_HTTP=$status"

      - name: Verify Staging API and Production unchanged
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            state="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.runningStatus' -o tsv 2>/dev/null || true)"
            echo "STAGING_API_STATUS attempt=$attempt state=$state"
            [[ "$state" == "Running" ]] && break
            sleep 15
          done
          staging_image="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.template.containers[0].image' -o tsv)"
          staging_fqdn="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          staging_revision="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.latestRevisionName' -o tsv)"
          staging_mode="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          staging_flag="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query "properties.template.containers[0].env[?name=='MotivatedSellers__ReadEnabled'].value | [0]" -o tsv)"
          staging_traffic="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.ingress.traffic' -o json)"
          echo "STAGING_ACTIVE_REVISION=$staging_revision"
          echo "STAGING_ACTIVE_MODE=$staging_mode"
          echo "STAGING_MOTIVATED_FLAG=$staging_flag"
          echo "STAGING_TRAFFIC=$staging_traffic"
          prod_image_after="$(az containerapp show -g "$PROD_RESOURCE_GROUP" -n "$PROD_API_NAME" --query 'properties.template.containers[0].image' -o tsv)"
          prod_revision_after="$(az containerapp show -g "$PROD_RESOURCE_GROUP" -n "$PROD_API_NAME" --query 'properties.latestRevisionName' -o tsv)"
          test "$staging_image" = "$STAGING_IMAGE"
          test "$prod_image_after" = "$PROD_IMAGE_BEFORE"
          test "$prod_revision_after" = "$PROD_REVISION_BEFORE"
          echo "STAGING_API_IMAGE=$staging_image"
          echo "STAGING_API_FQDN=$staging_fqdn"
          echo "PRODUCTION_UNCHANGED=true"
          {
            echo "### Search performance Staging API"
            echo "- Image: $staging_image"
            echo "- URL: https://$staging_fqdn"
            echo "- Active revision: $staging_revision"
            echo "- Active mode: $staging_mode"
            echo "- Motivated Sellers read flag: $staging_flag"
            echo "- Traffic: $staging_traffic"
            echo "- Production unchanged: true"
          } >> "$GITHUB_STEP_SUMMARY"
