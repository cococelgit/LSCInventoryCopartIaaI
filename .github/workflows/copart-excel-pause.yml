name: Pause Copart Excel ingestion

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PAUSE_COPART_EXCEL to stop active Excel executions"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  COPART_EXCEL_JOB_NAME: job-lsc-copart-excel-prod

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit pause confirmation
        run: test "${{ inputs.confirm }}" = "PAUSE_COPART_EXCEL"

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Stop active Excel executions and verify
        shell: bash
        run: |
          set -euo pipefail
          echo "Excel job configuration before pause:"
          az containerapp job show \
            --name "$COPART_EXCEL_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '{name:name,triggerType:properties.configuration.triggerType,image:properties.template.containers[0].image,command:properties.template.containers[0].command,args:properties.template.containers[0].args}' \
            -o json

          mapfile -t running < <(az containerapp job execution list \
            --name "$COPART_EXCEL_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.status=='Running'].name" -o tsv)

          echo "RUNNING_BEFORE=${#running[@]}"
          for execution in "${running[@]}"; do
            [ -n "$execution" ] || continue
            echo "Stopping Excel execution: $execution"
            az containerapp job stop \
              --name "$COPART_EXCEL_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --only-show-errors
          done

          sleep 8
          mapfile -t remaining < <(az containerapp job execution list \
            --name "$COPART_EXCEL_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.status=='Running'].name" -o tsv)
          echo "RUNNING_AFTER=${#remaining[@]}"
          test "${#remaining[@]}" -eq 0
          echo "Copart Excel ingestion is paused: no active Excel execution remains."
