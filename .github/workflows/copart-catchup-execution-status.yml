name: Check Copart Catch-up Execution

on:
  workflow_dispatch:
    inputs:
      execution:
        required: true
        default: job-lsc-copart-catchup-prod-msu204n
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  CATCHUP_JOB: job-lsc-copart-catchup-prod

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Read job and execution state
        env:
          EXECUTION: ${{ inputs.execution }}
        shell: bash
        run: |
          set -euo pipefail
          job_uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB?api-version=2024-03-01"
          execution_uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB/executions/$EXECUTION?api-version=2024-03-01"
          job="$(az rest --method get --uri "$job_uri" -o json)"
          execution="$(az rest --method get --uri "$execution_uri" -o json)"
          echo "$job" | jq '{job:.name,provisioningState:.properties.provisioningState,triggerType:.properties.configuration.triggerType,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,allowWrites:([.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""),enabled:([.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // "")}'
          echo "$execution" | jq '{execution:.name,status:.properties.status,start:.properties.startTime,end:.properties.endTime,replicaStatuses:.properties.replicaStatuses}'
          az containerapp job logs show -n "$CATCHUP_JOB" -g "$RESOURCE_GROUP" --execution "$EXECUTION" --container job-lsc-copart-catchup-prod --tail 300 2>&1 || true
