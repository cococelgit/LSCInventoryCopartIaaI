name: Create Copart AuctionsAPI Catch-up Job

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-catchup-job-create
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SOURCE_JOB: job-lsc-copart-auto-prod
  CATCHUP_JOB: job-lsc-copart-catchup-prod

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Create isolated manual catch-up Job
        env:
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUCTIONS_API_KEY"
          source_json="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$SOURCE_JOB?api-version=2024-03-01" -o json)"
          body="$(echo "$source_json" | jq --arg name "$CATCHUP_JOB" --arg key "$AUCTIONS_API_KEY" '
            .location as $location
            | {type:(.identity.type // "UserAssigned"), userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
            | .properties.configuration as $sourceConfiguration
            | .properties.template as $sourceTemplate
            | ($sourceTemplate.containers[0]
                | del(.imageType)
                | .name=$name
                | .command=["/app/run-auctionsapi-dry-run.sh"]
                | .args=["copart","catch-up-dry-run","500"]
                | .env=((.env // []) | map(select(.name != "AuctionsApi__ApiKey" and .name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites")) + [{name:"AuctionsApi__ApiKey",value:$key},{name:"AuctionsApi__Enabled",value:"true"},{name:"AuctionsApi__AllowWrites",value:"false"}])) as $container
            | {location:$location, identity:$identity, properties:{configuration:(($sourceConfiguration
                | del(.identitySettings,.secrets,.scheduleTriggerConfig)
                | .triggerType="Manual"
                | .manualTriggerConfig={parallelism:1,replicaCompletionCount:1}
                | .replicaRetryLimit=0
                | .replicaTimeout=10800)), template:($sourceTemplate | .containers=[$container])}}')"
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB?api-version=2024-03-01"
          az rest --method put --uri "$uri" --body "$body" --output none
          echo "COPART_CATCHUP_JOB_CREATED=$CATCHUP_JOB"
      - name: Verify isolation and safety state
        shell: bash
        run: |
          set -euo pipefail
          result="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB?api-version=2024-03-01" -o json)"
          echo "$result" | jq '{name:.name, provisioningState:.properties.provisioningState, triggerType:.properties.configuration.triggerType, scheduleTriggerConfig:.properties.configuration.scheduleTriggerConfig, command:.properties.template.containers[0].command, args:.properties.template.containers[0].args, image:.properties.template.containers[0].image, enabled:([.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // ""), allowWrites:([.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""), hasApiKey:([.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__ApiKey")][0].value != null)}'
