name: Validate live Copart history lookup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Lsc.Inventory.Api/**'
      - 'tests/Lsc.Inventory.Api.Tests/**'
      - '.github/workflows/live-copart-history-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test live Copart history lookup
        run: dotnet test Lsc.Inventory.sln -c Release --filter FullyQualifiedName~LiveCopartAuctionHistoryLookupTests

      - name: Build production engine source
        run: dotnet build src/Lsc.Inventory.Api/Lsc.Inventory.Api.csproj -c Release --no-restore
