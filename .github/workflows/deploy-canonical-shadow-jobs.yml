name: Deploy AuctionsAPI canonical shadow jobs

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_CANONICAL_SHADOW to update both jobs without starting them"
        required: true
        type: string
      canonical_shadow_enabled:
        description: "Enable old-vs-canonical shadow comparison"
        required: true
        default: true
        type: boolean
      canonical_mapper_enabled:
        description: "Use canonical mapper output; keep false for first canary"
        required: true
        default: false
        type: boolean
      allow_auctions_writes:
        description: "Allow writes; must remain false for first canary"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-canonical-shadow-jobs
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate manual guardrails
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'DEPLOY_CANONICAL_SHADOW'
          test '${{ inputs.allow_auctions_writes }}' = 'false'
          echo "Canonical shadow: ${{ inputs.canonical_shadow_enabled }}"
          echo "Canonical mapper: ${{ inputs.canonical_mapper_enabled }}"
          echo "Allow writes: ${{ inputs.allow_auctions_writes }}"

      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture paused job baseline
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = "Manual"
            echo "$json" | jq -S 'del(.properties.template.containers[0].image,.properties.provisioningState,.systemData)' > "$RUNNER_TEMP/$job.before.json"
            echo "BASELINE_$job=$(echo "$json" | jq -c '{trigger: .properties.configuration.triggerType, cron: .properties.configuration.scheduleTriggerConfig.cronExpression, image: .properties.template.containers[0].image}')"
          done

      - name: Build immutable shadow image
        shell: bash
        run: |
          set -euo pipefail
          tag="canonical-shadow-${GITHUB_SHA}"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file Dockerfile .
          echo "PROMOTED_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"

      - name: Update images and shadow flags only
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            az containerapp job update \
              --name "$job" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$PROMOTED_IMAGE" \
              --set-env-vars \
                "AuctionsApi__CanonicalShadowEnabled=${{ inputs.canonical_shadow_enabled }}" \
                "AuctionsApi__CanonicalMapperEnabled=${{ inputs.canonical_mapper_enabled }}" \
                "AuctionsApi__AllowWrites=${{ inputs.allow_auctions_writes }}" \
              --only-show-errors
          done

      - name: Verify no execution, schedule preservation and safe flags
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = "Manual"
            echo "$json" | jq -S 'del(.properties.template.containers[0].image,.properties.provisioningState,.systemData)' > "$RUNNER_TEMP/$job.after.json"
            diff -u "$RUNNER_TEMP/$job.before.json" "$RUNNER_TEMP/$job.after.json" || true
            test "$(echo "$json" | jq -r '.properties.template.containers[0].image')" = "$PROMOTED_IMAGE"
            test "$(echo "$json" | jq -r '.properties.template.containers[0].env[] | select(.name=="AuctionsApi__CanonicalShadowEnabled") | .value')" = "${{ inputs.canonical_shadow_enabled }}"
            test "$(echo "$json" | jq -r '.properties.template.containers[0].env[] | select(.name=="AuctionsApi__CanonicalMapperEnabled") | .value')" = "${{ inputs.canonical_mapper_enabled }}"
            test "$(echo "$json" | jq -r '.properties.template.containers[0].env[] | select(.name=="AuctionsApi__AllowWrites") | .value')" = "false"
            echo "VERIFIED_JOB=$job IMAGE=$PROMOTED_IMAGE TRIGGER=Manual SHADOW=${{ inputs.canonical_shadow_enabled }} CANONICAL=${{ inputs.canonical_mapper_enabled }} WRITES=false"
          done
          echo "No job execution was started."
