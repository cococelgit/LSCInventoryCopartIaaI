name: Diagnose Copart Catch-up Job

on:
  workflow_dispatch:
    inputs:
      execution:
        description: 'Optional Azure Container Apps execution name to isolate'
        required: false
        type: string
        default: ''
      replica:
        description: 'Optional exact replica name from the system log'
        required: false
        type: string
        default: ''
      job_name:
        description: 'Job name that owns the target execution'
        required: false
        type: string
        default: 'job-lsc-copart-catchup-prod'

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  CATCHUP_JOB: job-lsc-copart-catchup-prod
  ENVIRONMENT: cae-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  WORKSPACE_ID: d3998ed7-22f3-4fcc-af4d-8645e6fa0960

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect Job, executions and activity events
        shell: bash
        run: |
          set -euo pipefail
          job_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB"
          job_uri="https://management.azure.com$job_id?api-version=2024-03-01"
          executions_uri="https://management.azure.com$job_id/executions?api-version=2024-03-01"
          job="$(az rest --method get --uri "$job_uri" -o json)"
          echo '=== JOB CONFIG (NON-SENSITIVE) ==='
          echo "$job" | jq '{name:.name,location:.location,provisioningState:.properties.provisioningState,triggerType:.properties.configuration.triggerType,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,resources:.properties.template.containers[0].resources,envNames:[.properties.template.containers[0].env[]?.name],registries:.properties.configuration.registries}'
          echo '=== RECENT EXECUTIONS ==='
          az rest --method get --uri "$executions_uri" -o json | jq '[.value[] | {name:.name,status:.properties.status,start:.properties.startTime,end:.properties.endTime,replicaStatuses:.properties.replicaStatuses}] | .[0:10]'
          echo '=== ACTIVITY LOG ==='
          az monitor activity-log list --resource-id "$job_id" --offset 4h -o json | jq '[.[] | {eventTimestamp,operationName:.operationName.value,status:.status.value,subStatus:.subStatus.value,caller,description,correlationId}] | .[0:30]'
          echo '=== JOB IDENTITY ==='
          identity_id="$(echo "$job" | jq -r '.identity.userAssignedIdentities // {} | keys[0] // empty')"
          if [ -n "$identity_id" ]; then
            principal_id="$(az identity show --ids "$identity_id" --query principalId -o tsv)"
            echo "$job" | jq --arg identity_id "$identity_id" --arg principal_id "$principal_id" '{identityResourceId:$identity_id,principalId:$principal_id}'
            acr_id="$(az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" --query id -o tsv)"
            az role assignment list --assignee-object-id "$principal_id" --scope "$acr_id" -o json | jq '[.[] | {roleDefinitionName,scope,principalId}]'
          else
            echo '{"identityResourceId":null,"principalId":null,"acrPullAssignments":[]}'
          fi
      - name: Inspect image, registry and resource quotas
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ACR ==='
          az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" -o json | jq '{loginServer,sku:.sku.name,adminUserEnabled,provisioningState,publicNetworkAccess}'
          az acr repository show-manifests -n "$ACR_NAME" --repository lsc-inventory-engine --orderby time_desc -o json | jq '[.[] | {digest,tags,lastUpdateTime}] | .[0:10]'
          echo '=== CONTAINER APPS ENVIRONMENT ==='
          az containerapp env show -n "$ENVIRONMENT" -g "$RESOURCE_GROUP" -o json | jq '{name,location,provisioningState:.properties.provisioningState,defaultDomain:.properties.defaultDomain,workloadProfiles:.properties.workloadProfiles,appLogsConfiguration:.properties.appLogsConfiguration}'
          echo '=== RESOURCE GROUP USAGE ==='
          az resource list -g "$RESOURCE_GROUP" --query '[].{type:type,name:name,location:location}' -o table
          echo '=== EAST US 2 QUOTAS ==='
          az vm list-usage --location eastus2 -o json | jq '[.[] | select(.name.value|test("cores|virtualMachines|container|storage";"i")) | {name:.name.localizedValue,currentValue,limit}]'
      - name: Query recent Container App logs
        shell: bash
        env:
          TARGET_EXECUTION: ${{ inputs.execution }}
          TARGET_REPLICA: ${{ inputs.replica }}
          TARGET_JOB: ${{ inputs.job_name }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_EXECUTION" ]; then
            filter="(ContainerGroupName_s startswith \"$TARGET_EXECUTION\" or Log_s contains \"$TARGET_EXECUTION\")"
          else
            filter='(ContainerName_s == "job-lsc-copart-catchup-prod" or Log_s contains "Copart catch-up" or Log_s contains "CATCHUP_")'
          fi
          query="union isfuzzy=true ContainerAppSystemLogs_CL, ContainerAppConsoleLogs_CL | where TimeGenerated > ago(4h) | where $filter | project TimeGenerated, ContainerGroupName_s, ContainerName_s, Log_s | order by TimeGenerated asc | take 1000"
          echo '=== FILTERED CONSOLE/SYSTEM LOGS ==='
          az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "$query" -o json || true
          if [ -n "$TARGET_EXECUTION" ]; then
            phase_query="ContainerAppConsoleLogs_CL | where TimeGenerated > ago(4h) | where ContainerGroupName_s startswith \"$TARGET_EXECUTION\" or Log_s contains \"$TARGET_EXECUTION\" | summarize first_seen=min(TimeGenerated), last_seen=max(TimeGenerated), rows=count() by ContainerGroupName_s, ContainerName_s"
            echo '=== EXECUTION LOG SUMMARY ==='
            az monitor log-analytics query --workspace "$WORKSPACE_ID" --analytics-query "$phase_query" -o json || true
            job_for_execution="${TARGET_JOB:-$CATCHUP_JOB}"
            job_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$job_for_execution"
            execution_uri="https://management.azure.com$job_id/executions/$TARGET_EXECUTION?api-version=2024-03-01"
            job_uri="https://management.azure.com$job_id?api-version=2024-03-01"
            job_json="$(az rest --method get --uri "$job_uri" -o json)"
            execution_json="$(az rest --method get --uri "$execution_uri" -o json)"
            container="$(echo "$job_json" | jq -r '.properties.template.containers[0].name // empty')"
            echo '=== DIRECT EXECUTION LOGS ==='
            replicas="$TARGET_REPLICA"
            if [ -z "$replicas" ]; then
              replicas="$(echo "$execution_json" | jq -r '.properties.replicaStatuses[]?.replicaName // empty')"
            fi
            echo "$replicas" | while IFS= read -r replica; do
              [ -z "$replica" ] && continue
              echo "--- replica=$replica container=$container ---"
              az containerapp job logs show --name "$job_for_execution" --resource-group "$RESOURCE_GROUP" --execution "$TARGET_EXECUTION" --replica "$replica" --container "$container" --tail 300 --format text 2>&1 || true
            done
          fi
