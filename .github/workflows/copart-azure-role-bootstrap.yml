name: Copart Azure Role Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-azure-role-bootstrap
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RELEASE_PRINCIPAL_ID: 547895b8-3b4e-490a-8135-a3d82d7fdeca
  RESOURCE_GROUP: rg-lsc-inventory-prod
  RUNTIME_IDENTITY_NAME: id-lsc-inventory-db-runtime-prod

jobs:
  assign-copart-deploy-roles:
    name: Assign minimum Copart deployment roles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Assign scoped deployment roles idempotently
        shell: bash
        run: |
          set -euo pipefail
          subscription_id="${AZURE_SUBSCRIPTION_ID}"
          rg_scope="/subscriptions/${subscription_id}/resourceGroups/${RESOURCE_GROUP}"
          runtime_identity_scope="${rg_scope}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${RUNTIME_IDENTITY_NAME}"

          az role assignment create \
            --assignee-object-id "${RELEASE_PRINCIPAL_ID}" \
            --assignee-principal-type ServicePrincipal \
            --role "Container Apps Jobs Contributor" \
            --scope "${rg_scope}" \
            --only-show-errors

          az role assignment create \
            --assignee-object-id "${RELEASE_PRINCIPAL_ID}" \
            --assignee-principal-type ServicePrincipal \
            --role "Managed Identity Operator" \
            --scope "${runtime_identity_scope}" \
            --only-show-errors

      - name: Verify assignments
        shell: bash
        run: |
          set -euo pipefail
          az role assignment list \
            --assignee-object-id "${RELEASE_PRINCIPAL_ID}" \
            --scope "/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}" \
            --include-inherited \
            --query "[].{role:roleDefinitionName,scope:scope}" -o table
