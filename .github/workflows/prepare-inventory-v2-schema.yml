name: Prepare Inventory V2 Schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREPARE_INVENTORY_V2_SCHEMA"
        required: true
        type: string
      source_ref:
        description: "Reviewed branch or commit"
        required: true
        default: "main"
        type: string
      expected_sha:
        description: "Exact full SHA approved for the schema preparation"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: prepare-inventory-v2-schema
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  SOURCE_JOB: job-lsc-copart-auto-prod
  TEMP_JOB: job-lsc-v2-schema-prod

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify confirmation and exact commit
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PREPARE_INVENTORY_V2_SCHEMA
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "APPROVED_SHA=$EXPECTED_SHA"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Verify source job is paused and idle
        shell: bash
        run: |
          set -euo pipefail
          source_json="$(az containerapp job show --name "$SOURCE_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          trigger="$(echo "$source_json" | jq -r '.properties.configuration.triggerType')"
          active="$(az containerapp job execution list --name "$SOURCE_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
          echo "SOURCE_JOB=$SOURCE_JOB TRIGGER=$trigger ACTIVE=$active"
          test "$trigger" = Manual
          test "$active" = 0

      - name: Build immutable V2 schema image
        shell: bash
        run: |
          set -euo pipefail
          tag="inventory-v2-schema-$(git rev-parse HEAD)"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file Dockerfile .
          echo "V2_SCHEMA_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"

      - name: Create isolated schema job
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors || true
          }
          trap cleanup EXIT
          cleanup

          source_json="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$SOURCE_JOB?api-version=2024-03-01" -o json)"
          body="$(echo "$source_json" | jq --arg name "$TEMP_JOB" --arg image "$V2_SCHEMA_IMAGE" '
            .location as $location
            | .properties.environmentId as $environmentId
            | {type:(.identity.type // "UserAssigned"), userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
            | .properties.configuration as $sourceConfiguration
            | .properties.template as $sourceTemplate
            | ($sourceTemplate.containers[0]
                | del(.imageType)
                | .name=$name
                | .image=$image
                | .command=["dotnet"]
                | .args=["Lsc.Inventory.Api.dll","--prepare-inventory-v2-schema"]
                | .env=((.env // []) | map(select((.secretRef // "") == "" and (.name | test("Blob|Storage|AzureWebJobsStorage"; "i") | not))))) as $container
            | {location:$location, identity:$identity, properties:{environmentId:$environmentId, configuration:(($sourceConfiguration
                | del(.identitySettings,.secrets,.scheduleTriggerConfig)
                | .triggerType="Manual"
                | .manualTriggerConfig={parallelism:1,replicaCompletionCount:1}
                | .replicaRetryLimit=0
                | .replicaTimeout=900)), template:($sourceTemplate | .containers=[$container])}}')"
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMP_JOB?api-version=2024-03-01"
          az rest --method put --uri "$uri" --body "$body" --output none

          for _ in $(seq 1 60); do
            state="$(az rest --method get --uri "$uri" --query 'properties.provisioningState' -o tsv 2>/dev/null || true)"
            echo "TEMP_JOB_PROVISIONING=$state"
            case "$state" in
              Succeeded) break ;;
              Failed|Canceled) exit 1 ;;
            esac
            sleep 5
          done
          test "$state" = Succeeded
          az rest --method get --uri "$uri" --query '{name:name,trigger:properties.configuration.triggerType,image:properties.template.containers[0].image,command:properties.template.containers[0].command,args:properties.template.containers[0].args}' -o json

          run_once() {
            local ordinal="$1"
            local execution
            execution="$(az containerapp job start --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq -r '.name // .properties.name // empty')"
            test -n "$execution"
            echo "V2_SCHEMA_EXECUTION_${ordinal}=$execution"
            local status="Unknown"
            for _ in $(seq 1 180); do
              status="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" -o json | jq -r '.properties.status // "Unknown"')"
              echo "V2_SCHEMA_STATUS_${ordinal}=$status"
              case "$status" in
                Succeeded|Failed|Canceled|Stopped) break ;;
              esac
              sleep 5
            done

            replicas="$(az containerapp job replica list --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" -o json || true)"
            replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
            container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
            if [ -n "$replica" ] && [ -n "$container" ]; then
              az containerapp job logs show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" --replica "$replica" --container "$container" --tail 300 --format text | tee "$RUNNER_TEMP/v2-schema-$ordinal.log" || true
            fi
            test "$status" = Succeeded
            grep -q '"schemaVersion":1' "$RUNNER_TEMP/v2-schema-$ordinal.log"
            grep -q '"writerEnabled":false' "$RUNNER_TEMP/v2-schema-$ordinal.log"
            grep -q '"readerEnabled":false' "$RUNNER_TEMP/v2-schema-$ordinal.log"
          }

          run_once 1
          run_once 2
          echo "INVENTORY_V2_SCHEMA_PREPARED=true"
          cleanup
          trap - EXIT

      - name: Verify production jobs remain paused and idle
        shell: bash
        run: |
          set -euo pipefail
          for job in job-lsc-iaai-pilot-prod job-lsc-copart-auto-prod; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            trigger="$(echo "$json" | jq -r '.properties.configuration.triggerType')"
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
            echo "UNCHANGED_JOB=$job TRIGGER=$trigger ACTIVE=$active"
            test "$trigger" = Manual
            test "$active" = 0
          done
