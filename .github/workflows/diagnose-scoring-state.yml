name: Diagnose Inventory V2 Scoring State

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  API_APP: ca-lsc-inventory-api-prod
  SCORING_JOB: job-lsc-inventory-scoring-prod

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Read scoring job and API status
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SCORING_JOB_CONFIG ==='
          az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json \
            | jq '{name,provisioningState:.properties.provisioningState,triggerType:.properties.configuration.triggerType,manualTriggerConfig:.properties.configuration.manualTriggerConfig,scheduleTriggerConfig:.properties.configuration.scheduleTriggerConfig,replicaTimeout:.properties.configuration.replicaTimeout,replicaRetryLimit:.properties.configuration.replicaRetryLimit,image:.properties.template.containers[0].image,args:.properties.template.containers[0].args}'
          echo '=== RECENT_EXECUTIONS ==='
          executions="$(az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json)"
          echo "$executions" | jq '[.[] | {name,status:(.properties.status // .status),startTime:.properties.startTime,endTime:.properties.endTime,replicaCount:.properties.replicaCompletionCount}] | sort_by(.startTime) | reverse | .[0:12]'
          echo '=== ACTIVE_EXECUTION_DETAIL ==='
          active="$(echo "$executions" | jq -r '.[] | select((.properties.status // .status) == "Running" or (.properties.status // .status) == "Pending") | .name' | head -n 1)"
          if [ -n "$active" ]; then
            echo "ACTIVE_EXECUTION=$active"
            az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --job-execution-name "$active" -o json \
              | jq '{name,status:(.properties.status // .status),startTime:.properties.startTime,endTime:.properties.endTime,template:.properties.template}'
            replicas="$(az containerapp job replica list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --execution "$active" -o json 2>/dev/null || echo '[]')"
            echo "$replicas" | jq '[.[] | {name,status:(.properties.status // .status),containers:.properties.containers}]'
            replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
            container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
            if [ -n "$replica" ] && [ -n "$container" ]; then
              echo '=== ACTIVE_EXECUTION_LOG ==='
              az containerapp job logs show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --execution "$active" --replica "$replica" --container "$container" --tail 160 --format text || true
            fi
          else
            echo 'ACTIVE_EXECUTION=none'
          fi
          echo '=== API_SCORING_STATUS ==='
          api_fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          token_ref="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP" --query "properties.template.containers[0].env[?name=='InventoryApi__Token'].secretRef | [0]" -o tsv)"
          inventory_token="$(az containerapp secret list --resource-group "$RESOURCE_GROUP" --name "$API_APP" --show-values --query "[?name=='$token_ref'].value | [0]" -o tsv)"
          curl --silent --show-error --fail --max-time 90 --header "Authorization: Bearer $inventory_token" "https://${api_fqdn}/internal/scoring/status" | jq .
          echo '=== RECENT_SCORING_RUNS ==='
          curl --silent --show-error --fail --max-time 90 --header "Authorization: Bearer $inventory_token" "https://${api_fqdn}/internal/scoring/runs?take=10" | jq .
          unset inventory_token
