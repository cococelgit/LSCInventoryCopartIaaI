name: Copart Azure Diagnostics

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Copart Job execution name
        required: true
        default: job-lsc-copart-excel-prod-n11yc6q
      stop_execution:
        description: Stop only the specified Copart execution before collecting diagnostics
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  COPART_JOB_NAME: job-lsc-copart-excel-prod
  INVENTORY_API_APP_NAME: ca-lsc-inventory-api-prod
  COPART_AUTO_PROCESS_JOB_NAME: job-lsc-copart-auto-prod

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Show failed replica and logs
        shell: bash
        run: |
          set -euo pipefail
          execution="${{ inputs.execution }}"
          if [ "$execution" = "latest" ]; then
            execution="$(az containerapp job execution list \
              --name "$COPART_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query '[0].name' -o tsv)"
          fi
          if [ -z "$execution" ] || [ "$execution" = "None" ]; then
            echo "No target Copart execution was found." >&2
            exit 2
          fi
          echo "Target Copart execution: $execution"
          echo "Protected Inventory API image baseline (read-only; no deployment action)."
          az containerapp show \
            --name "$INVENTORY_API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '{name:name,latestRevision:properties.latestRevisionName,image:properties.template.containers[0].image}' \
            -o json
          echo "Dedicated Copart Job configuration (read-only)."
          az containerapp job show \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '{name:name,triggerType:properties.configuration.triggerType,schedule:properties.configuration.scheduleTriggerConfig,manual:properties.configuration.manualTriggerConfig,template:properties.template}' \
            -o json
          echo "Scheduled Copart processor configuration and recent executions (read-only)."
          az containerapp job show \
            --name "$COPART_AUTO_PROCESS_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '{name:name,triggerType:properties.configuration.triggerType,cron:properties.configuration.scheduleTriggerConfig.cronExpression,replicaTimeout:properties.configuration.replicaTimeout,replicaRetryLimit:properties.configuration.replicaRetryLimit,parallelism:properties.configuration.scheduleTriggerConfig.parallelism,completionCount:properties.configuration.scheduleTriggerConfig.completionCount,image:properties.template.containers[0].image}' \
            -o json
          az containerapp job execution list \
            --name "$COPART_AUTO_PROCESS_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0:3].{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime,conditions:properties.conditions}' \
            -o json
          echo "Listing recent manual Copart processing executions."
          az containerapp job execution list \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            -o json
          if [ "${{ inputs.stop_execution }}" = "true" ]; then
            echo "Stopping only the specified Copart execution."
            az containerapp job stop \
              --name "$COPART_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --only-show-errors
          fi
          echo "Attempting Job logs without pinning a cleaned-up replica."
          az containerapp job logs show \
            --name "$COPART_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --execution "$execution" \
            --container "$COPART_JOB_NAME" \
            --tail 300 \
            --format text || true

          environment_id="$(az containerapp job show --name "$COPART_JOB_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.environmentId' -o tsv)"
          environment_name="${environment_id##*/}"
          workspace_id="$(az containerapp env show --name "$environment_name" --resource-group "$RESOURCE_GROUP" --query 'properties.appLogsConfiguration.logAnalyticsConfiguration.customerId' -o tsv)"
          if [ -n "$workspace_id" ] && [ "$workspace_id" != "None" ]; then
            echo "Dedicated Copart Job logs (read-only)."
            az monitor log-analytics query \
              --workspace "$workspace_id" \
              --analytics-query "union isfuzzy=true ContainerAppConsoleLogs_CL, ContainerAppSystemLogs_CL | where ContainerAppName_s == '$COPART_JOB_NAME' | order by TimeGenerated desc | take 500" \
              -o json
            echo "Scheduled Copart Job logs (read-only)."
            az monitor log-analytics query \
              --workspace "$workspace_id" \
              --analytics-query "union isfuzzy=true ContainerAppConsoleLogs_CL, ContainerAppSystemLogs_CL | where ContainerAppName_s == '$COPART_AUTO_PROCESS_JOB_NAME' | project TimeGenerated, ContainerAppName_s, Log_s, Reason_s | order by TimeGenerated desc | take 500" \
              -o json
          else
            echo "No Log Analytics workspace identifier was available."
          fi
