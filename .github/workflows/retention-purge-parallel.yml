name: Retention Purge Parallel Isolated

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_PARALLEL_RETENTION_PURGE to authorize raw blob deletion
        required: true
        type: string
      max_batches:
        description: Maximum number of 500-lot batches in this execution
        required: true
        default: '10'
        type: string
      retention_days:
        description: Inactive days before eligibility
        required: true
        default: '7'
        type: string

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SOURCE_JOB: job-lsc-copart-auto-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine

permissions:
  contents: read
  id-token: write

concurrency:
  group: retention-purge-parallel-production
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard authorization
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'RUN_PARALLEL_RETENTION_PURGE'
          [[ '${{ inputs.max_batches }}' =~ ^[1-9][0-9]{0,2}$ ]]
          [[ '${{ inputs.retention_days }}' =~ ^[1-9][0-9]{0,2}$ ]]
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build immutable engine image
        run: |
          set -euo pipefail
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:retention-parallel-${GITHUB_SHA}" inventory-engine
      - name: Create isolated manual purge job
        env:
          TEMP_JOB: lsc-retention-${{ github.run_id }}
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUCTIONS_API_KEY"
          az containerapp job show --name "$SOURCE_JOB" --resource-group "$RESOURCE_GROUP" -o json > /tmp/source.json
          image="$ACR_SERVER/$IMAGE_NAME:retention-parallel-${GITHUB_SHA}"
          jq --arg name "$TEMP_JOB" --arg image "$image" --arg days '${{ inputs.retention_days }}' --arg apiKey "$AUCTIONS_API_KEY" '
            del(.id,.name,.type,.systemData,.properties.provisioningState,.properties.runningStatus,.properties.configuration.secrets)
            | .name=$name
            | .properties.configuration.triggerType="Manual"
            | .properties.configuration.manualTriggerConfig.parallelism=1
            | .properties.configuration.manualTriggerConfig.replicaCompletionCount=1
            | .properties.configuration.replicaRetryLimit=0
            | .properties.template.containers[0].image=$image
            | .properties.template.containers[0].command=["dotnet"]
            | .properties.template.containers[0].args=["Lsc.Inventory.Api.dll","--retention-purge-pilot"]
            | .properties.template.containers[0].env=((.properties.template.containers[0].env // []) | map(select(.name != "AuctionsApi__ApiKey" and .name != "Retention__DryRunDays" and .name != "Retention__PurgePilotLotLimit" and .name != "Retention__PurgePilotExecute")) + [{name:"AuctionsApi__ApiKey",value:$apiKey},{name:"Retention__DryRunDays",value:$days},{name:"Retention__PurgePilotLotLimit",value:"500"},{name:"Retention__PurgePilotExecute",value:"true"}])
            | {type:(.identity.type // "UserAssigned"),userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
            | .location as $location
            | .properties.environmentId as $environmentId
            | {location:$location,identity:$identity,properties:{environmentId:$environmentId,configuration:(.properties.configuration | del(.identitySettings,.secrets,.scheduleTriggerConfig) | .triggerType="Manual" | .manualTriggerConfig={parallelism:1,replicaCompletionCount:1} | .replicaRetryLimit=0 | .replicaTimeout=900),template:.properties.template}}' /tmp/source.json > /tmp/purge-job.json
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMP_JOB?api-version=2024-03-01"
          az rest --method put --uri "$uri" --body @/tmp/purge-job.json --output none
          for _ in $(seq 1 24); do
            provisioning=$(az containerapp job show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --query properties.provisioningState -o tsv)
            echo "isolated_job_provisioning=$provisioning"
            case "$provisioning" in
              Succeeded) break ;;
              Failed|Canceled) echo "Isolated job provisioning failed" >&2; exit 1 ;;
            esac
            sleep 10
          done
          test "$provisioning" = Succeeded
      - name: Run bounded purge batches with cursor
        env:
          TEMP_JOB: lsc-retention-${{ github.run_id }}
        run: |
          set -euo pipefail
          cursor_at=""
          cursor_lot=""
          for batch in $(seq 1 '${{ inputs.max_batches }}'); do
            az containerapp job update --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --set-env-vars RETENTION_PURGE_CURSOR_AT="$cursor_at" RETENTION_PURGE_CURSOR_LOT_KEY="$cursor_lot" >/dev/null
            execution_name=$(az containerapp job start --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq -r '.name // .properties.name')
            status=Pending
            for _ in $(seq 1 120); do
              status=$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution_name" --query properties.status -o tsv)
              echo "batch=$batch execution=$execution_name status=$status"
              case "$status" in Succeeded|Failed|Canceled) break;; esac
              sleep 15
            done
            test "$status" = Succeeded
            replicas=$(az containerapp job replica list --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution_name" -o json)
            replica=$(echo "$replicas" | jq -r '.[0].name // empty')
            container=$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')
            test -n "$replica" && test -n "$container"
            logs=$(az containerapp job logs show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution_name" --replica "$replica" --container "$container" --tail 300 --format text)
            echo "$logs"
            report=$(echo "$logs" | grep -o '{.*}' | grep 'LastSelectedLotKey' | tail -1 || true)
            if [ -z "$report" ]; then echo 'No candidates remain; stopping.'; break; fi
            next_at=$(echo "$report" | jq -r '.LastSelectedDeactivatedAt // empty')
            next_lot=$(echo "$report" | jq -r '.LastSelectedLotKey // empty')
            test -n "$next_at" && test -n "$next_lot"
            cursor_at="$next_at"
            cursor_lot="$next_lot"
          done
      - name: Delete isolated purge job
        if: always()
        env:
          TEMP_JOB: lsc-retention-${{ github.run_id }}
        run: az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes
