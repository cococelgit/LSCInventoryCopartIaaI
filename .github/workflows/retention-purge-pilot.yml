name: Retention Purge Pilot 500 Lots

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type GENERATE_500_LOT_PURGE_MANIFEST or PURGE_500_RAW_BLOBS"
        required: true
        type: string
      mode:
        description: "Manifest is read-only; execute deletes only the approved 500-lot pilot"
        required: true
        default: manifest
        type: choice
        options: [manifest, execute]

permissions:
  contents: read
  id-token: write

concurrency:
  group: retention-purge-pilot
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  TEMPORARY_JOB: job-lsc-copart-catchup-prod

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Guard approved pilot mode
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.mode }}:${{ inputs.confirmation }}' in
            manifest:GENERATE_500_LOT_PURGE_MANIFEST|execute:PURGE_500_RAW_BLOBS) ;; *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Build immutable pilot image
        shell: bash
        run: |
          set -euo pipefail
          tag="retention-purge-pilot-${GITHUB_SHA}"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file inventory-engine/Dockerfile inventory-engine
          echo "PILOT_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"
      - name: Run isolated pilot and restore template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMPORARY_JOB?api-version=2024-03-01"
          current="$(az rest --method get --uri "$uri" -o json)"
          test "$(echo "$current" | jq -r '.properties.configuration.triggerType')" = Manual
          active="$(az containerapp job execution list --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
          test "$active" = 0
          echo "$current" | jq -S '.properties.template.containers[0] | del(.imageType)' > report/template-before.json
          echo "$current" | jq -S '{replicaTimeout:.properties.configuration.replicaTimeout,manualTriggerConfig:.properties.configuration.manualTriggerConfig}' > report/manual-config-before.json
          restore_body="$(echo "$current" | jq '{properties:{configuration:{replicaTimeout:.properties.configuration.replicaTimeout,manualTriggerConfig:.properties.configuration.manualTriggerConfig},template:{containers:[.properties.template.containers[0] | del(.imageType)]}}}')"
          restore() { az rest --method patch --uri "$uri" --body "$restore_body" --output none; }
          trap restore EXIT
          execute=false; test '${{ inputs.mode }}' = execute && execute=true
          body="$(echo "$current" | jq --arg image "$PILOT_IMAGE" --argjson execute "$execute" '
            .properties.configuration.replicaTimeout = 3300
            | .properties.template.containers[0]
              |= (del(.imageType) | .image = $image | .command = ["dotnet"] | .args = ["Lsc.Inventory.Api.dll", "--retention-purge-pilot"]
                  | .env = ((.env // []) | map(select(.name != "Retention__DryRunDays" and .name != "Retention__PurgePilotLotLimit" and .name != "Retention__PurgePilotExecute")) + [
                      {name:"Retention__DryRunDays", value:"7"},
                      {name:"Retention__PurgePilotLotLimit", value:"500"},
                      {name:"Retention__PurgePilotExecute", value:($execute|tostring)}]))
            | {properties:{configuration:{replicaTimeout:.properties.configuration.replicaTimeout,manualTriggerConfig:.properties.configuration.manualTriggerConfig},template:{containers:[.properties.template.containers[0]]}}}')"
          az rest --method patch --uri "$uri" --body "$body" --output none
          execution="$(az containerapp job start --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          execution_name="$(echo "$execution" | jq -r '.name // .properties.name // empty')"; test -n "$execution_name"
          echo "$execution" | jq . > report/execution-start.json
          deadline=$((SECONDS + 3300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status_json="$(az containerapp job execution show --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution_name" -o json)"
            status="$(echo "$status_json" | jq -r '.properties.status // .properties.runningState // "Unknown"')"
            case "$status" in
              Succeeded|Failed|Canceled)
                echo "$status_json" | jq . > report/execution-final.json
                replicas="$(az containerapp job replica list --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution_name" -o json || true)"
                echo "$replicas" | jq . > report/replicas.json
                replica="$(echo "$replicas" | jq -r '.[0].name // empty')"; container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
                if [ -n "$replica" ] && [ -n "$container" ]; then az containerapp job logs show --name "$TEMPORARY_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution_name" --replica "$replica" --container "$container" --tail 300 --format text | tee report/pilot.log || true; fi
                test "$status" = Succeeded; break ;;
            esac
            sleep 15
          done
          test "$SECONDS" -lt "$deadline"
      - name: Verify job restoration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMPORARY_JOB?api-version=2024-03-01"
          current="$(az rest --method get --uri "$uri" -o json)"
          echo "$current" | jq -S '.properties.template.containers[0] | del(.imageType)' > report/template-after.json
          echo "$current" | jq -S '{replicaTimeout:.properties.configuration.replicaTimeout,manualTriggerConfig:.properties.configuration.manualTriggerConfig}' > report/manual-config-after.json
          diff -u report/template-before.json report/template-after.json
          diff -u report/manual-config-before.json report/manual-config-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-purge-pilot-${{ github.run_id }}
          path: report
          retention-days: 30
