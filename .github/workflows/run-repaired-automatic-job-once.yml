name: Run Repaired Automatic Auction Job Once

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Automatic job to run"
        required: true
        type: choice
        options:
          - copart
          - iaai
      confirmation:
        description: "Type RUN_REPAIRED_AUTOMATIC_JOB"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: run-repaired-automatic-job-once
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Verify runtime and start exactly one execution as configured
        id: start
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RUN_REPAIRED_AUTOMATIC_JOB
          case "$PLATFORM" in
            copart) job=job-lsc-copart-auto-prod; expected_cron='0 0-22/2 * * *' ;;
            iaai) job=job-lsc-iaai-pilot-prod; expected_cron='0 1-23/2 * * *' ;;
            *) exit 2 ;;
          esac
          json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Schedule
          test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = "$expected_cron"
          test "$(echo "$json" | jq -r '.properties.configuration.replicaRetryLimit')" = 0
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // ""')" = true
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""')" = true
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes")][0].value // ""')" = 140
          active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running']" -o json | jq 'length')"
          test "$active" -eq 0
          execution="$(az containerapp job start --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
          execution_name="$(echo "$execution" | jq -r '.name // .properties.name // empty')"
          test -n "$execution_name"
          echo "JOB=$job" >> "$GITHUB_ENV"
          echo "EXPECTED_CRON=$expected_cron" >> "$GITHUB_ENV"
          echo "EXECUTION_NAME=$execution_name" >> "$GITHUB_ENV"
          echo "Started $execution_name without changing the job template."
      - name: Wait for completion and collect logs
        shell: bash
        run: |
          set -euo pipefail
          status=Unknown
          for attempt in $(seq 1 120); do
            execution="$(az containerapp job execution show --name "$JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$EXECUTION_NAME" -o json)"
            status="$(echo "$execution" | jq -r '.properties.status // .status // "Unknown"')"
            echo "attempt=$attempt status=$status"
            case "$status" in Succeeded|Failed|Canceled|Cancelled|Stopped) break ;; esac
            sleep 15
          done
          echo "$execution" | jq '{name:.name,status:.properties.status,start:.properties.startTime,end:.properties.endTime}'
          replica_json="$(az containerapp job replica list --name "$JOB" --resource-group "$RESOURCE_GROUP" --execution "$EXECUTION_NAME" -o json || true)"
          replica="$(echo "$replica_json" | jq -r '.[0].name // empty')"
          container="$(echo "$replica_json" | jq -r '.[0].properties.containers[0].name // empty')"
          if [ -n "$replica" ] && [ -n "$container" ]; then
            az containerapp job logs show --name "$JOB" --resource-group "$RESOURCE_GROUP" --execution "$EXECUTION_NAME" --replica "$replica" --container "$container" --tail 300 --format text || true
          fi
          test "$status" = Succeeded
      - name: Verify schedule and isolation were unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          json="$(az containerapp job show --name "$JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Schedule
          test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = "$EXPECTED_CRON"
          excel="$(az containerapp job show --name job-lsc-copart-excel-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$excel" | jq -r '.properties.configuration.triggerType')" = Manual
          catchup="$(az containerapp job show --name job-lsc-copart-catchup-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$catchup" | jq -r '.properties.configuration.triggerType')" = Manual
          echo "Automatic schedule unchanged; Excel and catch-up remain Manual."
