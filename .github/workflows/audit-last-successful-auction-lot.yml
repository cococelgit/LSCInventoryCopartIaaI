name: Audit Last Successful Auction Lot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  API_APP: ca-lsc-inventory-api-prod
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Find latest pre-recovery successful Copart and IAAI runs and their last lot events
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --name "$API_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          token_ref="$(az containerapp show --name "$API_APP" --resource-group "$RESOURCE_GROUP" --query "properties.template.containers[0].env[?name=='InventoryApi__Token'].secretRef | [0]" -o tsv)"
          token="$(az containerapp secret list --name "$API_APP" --resource-group "$RESOURCE_GROUP" --show-values --query "[?name=='$token_ref'].value | [0]" -o tsv)"
          test -n "$token" && test -n "$fqdn"
          for platform in copart iaai; do
            candidate=''
            for page in $(seq 1 40); do
              response="$(curl -fsS --max-time 35 --header "Authorization: Bearer $token" "https://${fqdn}/internal/executions?platform=$platform&page=$page&pageSize=100")"
              count="$(echo "$response" | jq '.items | length')"
              candidate="$(echo "$response" | jq -c '[.items[] | select(.provider == "auctions_api" and (.startedAt < "2026-10-07T12:34:00Z") and ((.created // 0) + (.updated // 0) > 0) and (.status == "succeeded" or .status == "completed_with_errors"))] | first // empty')"
              echo "PLATFORM=$platform PAGE=$page ITEMS=$count CANDIDATE=$([ -n "$candidate" ] && echo yes || echo no)"
              [ -n "$candidate" ] && break
              [ "$count" -lt 100 ] && break
            done
            echo "LAST_EFFECTIVE_PRE_RECOVERY_RUN_$platform=$candidate"
            if [ -n "$candidate" ]; then
              run_id="$(echo "$candidate" | jq -r '.runId')"
              events="$(curl -fsS --max-time 35 --header "Authorization: Bearer $token" "https://${fqdn}/internal/executions/${run_id}/events?page=1&pageSize=100")"
              echo "LAST_LOT_EVENTS_$platform=$(echo "$events" | jq -c '{total,latestEvent:(.items | first),latestChangedEvent:([.items[] | select(.action=="created" or .action=="updated")] | first)}')"
            fi
          done
          unset token
