name: Build and Promote Active Engine

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE_ACTIVE_ENGINE_FIX to build and update active IAAI/Copart jobs"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Capture active job baseline
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'PROMOTE_ACTIVE_ENGINE_FIX'
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            trigger="$(echo "$json" | jq -r '.properties.configuration.triggerType')"
            echo "BASELINE_JOB=$job TRIGGER=$trigger IMAGE=$(echo "$json" | jq -r '.properties.template.containers[0].image')"
            test "$trigger" = Schedule
            echo "$json" | jq -S 'del(.properties.template.containers[0].image,.properties.provisioningState,.systemData)' > "$RUNNER_TEMP/$job.before.json"
          done
      - name: Build immutable shared engine image
        shell: bash
        run: |
          set -euo pipefail
          tag="jobs-${GITHUB_SHA}"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file Dockerfile .
          echo "PROMOTED_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"
      - name: Update only active job images
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job update --name "$IAAI_JOB" --resource-group "$RESOURCE_GROUP" --image "$PROMOTED_IMAGE" --only-show-errors
          az containerapp job update --name "$COPART_JOB" --resource-group "$RESOURCE_GROUP" --image "$PROMOTED_IMAGE" --only-show-errors
      - name: Verify image and runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            trigger="$(echo "$json" | jq -r '.properties.configuration.triggerType')"
            echo "VERIFY_JOB=$job TRIGGER=$trigger IMAGE=$(echo "$json" | jq -r '.properties.template.containers[0].image')"
            test "$trigger" = Schedule
            echo "$json" | jq -S 'del(.properties.template.containers[0].image,.properties.provisioningState,.systemData)' > "$RUNNER_TEMP/$job.after.json"
            diff -u "$RUNNER_TEMP/$job.before.json" "$RUNNER_TEMP/$job.after.json"
            test "$(echo "$json" | jq -r '.properties.template.containers[0].image')" = "$PROMOTED_IMAGE"
            echo "VERIFIED_JOB=$job IMAGE=$PROMOTED_IMAGE TRIGGER=Schedule"
          done
          echo "Only images changed; cron, secrets, persistence, and write policy were preserved."
