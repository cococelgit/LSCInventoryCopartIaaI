name: AuctionsAPI canonical contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/auctionsapi-canonical-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Lsc.Inventory.sln

      - name: Build
        run: dotnet build Lsc.Inventory.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Lsc.Inventory.sln --configuration Release --no-build --logger 'console;verbosity=minimal'
