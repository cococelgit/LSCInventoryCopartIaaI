name: Search performance staging benchmark

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN-LSC-STAGING-SEARCHPERF-BENCHMARK to benchmark only Staging"
        required: true
        type: string
      samples:
        description: "Number of requests per mode"
        required: false
        default: "20"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: search-performance-staging-benchmark
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  STAGING_RESOURCE_GROUP: rg-lsc-inventory-staging
  STAGING_API_NAME: ca-lsc-searchperf-api-staging
  CANDIDATE_REF: manus/search-latency-prod-base

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Guard explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "RUN-LSC-STAGING-SEARCHPERF-BENCHMARK"
          test "${{ inputs.samples }}" -ge 5

      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Prepare isolated token and endpoint
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          test -n "$fqdn" && test "$fqdn" != "None"
          token="$(openssl rand -hex 32)"
          az containerapp secret set -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --secrets "inventory-api-token=$token" --only-show-errors >/dev/null
          echo "FQDN=$fqdn" >> "$GITHUB_ENV"
          echo "INVENTORY_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AUCTION_FROM=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SAMPLES=${{ inputs.samples }}" >> "$GITHUB_ENV"

      - name: Benchmark each search mode and compare ordering
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://$FQDN"
          wait_running() {
            for attempt in $(seq 1 30); do
              state="$(az containerapp show -g "$STAGING_RESOURCE_GROUP" -n "$STAGING_API_NAME" --query 'properties.runningStatus' -o tsv 2>/dev/null || true)"
              echo "API_STATUS attempt=$attempt state=$state"
              [[ "$state" == "Running" ]] && return 0
              sleep 10
            done
            return 1
          }
          set_mode() {
            denormalized="$1"
            parallel="$2"
            label="$3"
            az containerapp update \
              -g "$STAGING_RESOURCE_GROUP" \
              -n "$STAGING_API_NAME" \
              --revision-suffix "b${label:0:1}${GITHUB_RUN_NUMBER}" \
              --set-env-vars \
                "Sync__Enabled=false" \
                "Persistence__RunMigrations=false" \
                "Persistence__UseDenormalizedScoringSearch=$denormalized" \
                "Persistence__RunBrowseCountAndItemsInParallel=$parallel" \
                "SearchProjection__WarmupOnStartup=true" \
                "InventoryApi__Token=secretref:inventory-api-token" \
              --only-show-errors >/dev/null
            wait_running
            SAMPLES="$SAMPLES" PAGE_SIZE=24 INVENTORY_BASE_URL="$base_url" INVENTORY_API_TOKEN="$INVENTORY_API_TOKEN" AUCTION_FROM="$AUCTION_FROM" OUTPUT="benchmark-$label.tsv" bash tools/benchmark-inventory-search.sh | tee "summary-$label.txt"
          }
          set_mode false false legacy
          set_mode true false denormalized
          set_mode true true parallel
          legacy_order="$(sed -n '2p' benchmark-legacy.tsv | cut -f5)"
          denormalized_order="$(sed -n '2p' benchmark-denormalized.tsv | cut -f5)"
          parallel_order="$(sed -n '2p' benchmark-parallel.tsv | cut -f5)"
          test "$legacy_order" = "$denormalized_order"
          test "$legacy_order" = "$parallel_order"
          legacy_total="$(sed -n '2p' benchmark-legacy.tsv | cut -f4)"
          denormalized_total="$(sed -n '2p' benchmark-denormalized.tsv | cut -f4)"
          parallel_total="$(sed -n '2p' benchmark-parallel.tsv | cut -f4)"
          test "$legacy_total" = "$denormalized_total"
          test "$legacy_total" = "$parallel_total"
          echo "ORDER_EQUIVALENT=true"
          echo "TOTAL_EQUIVALENT=true"
          {
            echo "### Search performance Staging benchmark"
            echo "- Target: \\`https://$FQDN\\`"
            echo "- Samples per mode: \\`$SAMPLES\\`"
            echo "- Legacy: $(cat summary-legacy.txt)"
            echo "- Denormalized: $(cat summary-denormalized.txt)"
            echo "- Parallel: $(cat summary-parallel.txt)"
            echo "- Order equivalent: \\`true\\`"
            echo "- Total equivalent: \\`true\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: searchperf-staging-benchmark-${{ github.run_id }}
          path: |
            benchmark-*.tsv
            summary-*.txt
