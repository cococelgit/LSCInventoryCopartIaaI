name: Audit All Inventory Container Jobs

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Inventory all LSC jobs and recent executions
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(az containerapp job list --resource-group "$RESOURCE_GROUP" -o json)"
          echo "JOB_AUDIT_SUMMARY_BEGIN"
          echo "$jobs" | jq '[.[] | select(.name | startswith("job-lsc-")) | {
            name,
            provisioningState:.properties.provisioningState,
            triggerType:.properties.configuration.triggerType,
            cron:.properties.configuration.scheduleTriggerConfig.cronExpression,
            timezone:.properties.configuration.scheduleTriggerConfig.timeZone,
            replicaTimeout:.properties.configuration.replicaTimeout,
            replicaRetryLimit:.properties.configuration.replicaRetryLimit,
            parallelism:(.properties.configuration.manualTriggerConfig.parallelism // .properties.configuration.scheduleTriggerConfig.parallelism),
            completionCount:(.properties.configuration.manualTriggerConfig.replicaCompletionCount // .properties.configuration.scheduleTriggerConfig.replicaCompletionCount),
            workloadProfileName:.properties.workloadProfileName,
            image:.properties.template.containers[0].image,
            containerName:.properties.template.containers[0].name,
            command:.properties.template.containers[0].command,
            args:.properties.template.containers[0].args,
            resources:.properties.template.containers[0].resources,
            envNames:(.properties.template.containers[0].env // [] | map(.name) | sort),
            createdAt:.systemData.createdAt,
            lastModifiedAt:.systemData.lastModifiedAt
          }] | sort_by(.name)'
          echo "JOB_AUDIT_SUMMARY_END"

          echo "$jobs" | jq -r '.[] | select(.name | startswith("job-lsc-")) | .name' | sort | while read -r job; do
            executions="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            echo "JOB_EXECUTIONS_BEGIN=$job"
            echo "$executions" | jq '{
              active:([.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length),
              totalReturned:length,
              recent:([.[] | {name,status:.properties.status,start:.properties.startTime,end:.properties.endTime}] | sort_by(.start) | reverse | .[:5])
            }'
            echo "JOB_EXECUTIONS_END=$job"
          done
