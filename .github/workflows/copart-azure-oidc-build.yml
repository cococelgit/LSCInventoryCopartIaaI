name: Copart Azure OIDC Build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: copart-azure-build
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  ACR_NAME: acrlscinvprodeus2
  IMAGE_NAME: lsc-inventory-engine

jobs:
  build:
    name: Authenticate and build Copart image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity and subscription
        run: |
          set -euo pipefail
          az account show --query '{subscription:id, tenant:tenantId, user:user.name}' -o json

      - name: Build immutable Inventory Engine image in ACR
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:copart-${GITHUB_SHA}" \
            --file inventory-engine/Dockerfile \
            inventory-engine

      - name: Print immutable image reference
        run: |
          echo "IMAGE_REFERENCE=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:copart-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed. Deployment is intentionally a separate, reviewed workflow."
