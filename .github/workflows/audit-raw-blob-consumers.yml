name: Audit Raw Blob Consumers

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Audit apps and jobs for raw Blob dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CONTAINER APPS WITH BLOB ENV ==='
          for app in $(az containerapp list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv); do
            json="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app" -o json)"
            matches="$(echo "$json" | jq '[.properties.template.containers[]?.env[]? | select(.name | test("^(BlobAudit|CopartExcel)__(AccountUrl|ContainerName|SnapshotBlobName)$")) | .name]')"
            if [ "$(echo "$matches" | jq 'length')" -gt 0 ]; then
              echo "$json" | jq --argjson matches "$matches" '{type:"app",name:.name,image:.properties.template.containers[0].image,blobEnvNames:$matches}'
            fi
          done

          echo '=== CONTAINER APP JOBS WITH BLOB ENV ==='
          for job in $(az containerapp job list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv); do
            json="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$job" -o json)"
            matches="$(echo "$json" | jq '[.properties.template.containers[]?.env[]? | select(.name | test("^(BlobAudit|CopartExcel)__(AccountUrl|ContainerName|SnapshotBlobName)$")) | .name]')"
            if [ "$(echo "$matches" | jq 'length')" -gt 0 ]; then
              active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
              echo "$json" | jq --argjson matches "$matches" --argjson active "$active" '{type:"job",name:.name,trigger:.properties.configuration.triggerType,image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args,activeExecutions:$active,blobEnvNames:$matches}'
            fi
          done
