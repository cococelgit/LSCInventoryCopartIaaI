name: Pause Automatic IAAI and Copart Jobs

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PAUSE_AUTOMATIC_JOBS to pause both schedules"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pause-automatic-auction-jobs
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  IAAI_JOB: job-lsc-iaai-pilot-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Pause only automatic schedules
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PAUSE_AUTOMATIC_JOBS"
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            before="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            trigger="$(echo "$before" | jq -r '.properties.configuration.triggerType')"
            cron="$(echo "$before" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression // empty')"
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running']" -o json | jq 'length')"
            echo "JOB=$job TRIGGER=$trigger CRON=${cron:-none} ACTIVE=$active"
            test "$trigger" = "Schedule"
            test "$active" -eq 0
            test -n "$cron"
            job_id="$(echo "$before" | jq -r '.id')"
            az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body '{"properties":{"configuration":{"triggerType":"Manual"}}}' --only-show-errors
            echo "$job|$cron" >> "$RUNNER_TEMP/paused-jobs.txt"
          done
      - name: Verify both schedules are paused
        shell: bash
        run: |
          set -euo pipefail
          for job in "$IAAI_JOB" "$COPART_JOB"; do
            trigger="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" --query 'properties.configuration.triggerType' -o tsv)"
            echo "JOB=$job TRIGGER_AFTER=$trigger"
            test "$trigger" = "Manual"
          done
          echo "Both automatic schedules are paused. No image, command, identity, or data configuration was changed."
