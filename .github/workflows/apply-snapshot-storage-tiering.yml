name: Apply Snapshot Storage Tiering

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_SNAPSHOT_COOL_TIERING to apply non-destructive lifecycle tiering"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  STORAGE_ACCOUNT: stlscinvprodeus2
  SNAPSHOT_LIFECYCLE_RULE: tier-snapshots-to-cool-after-30d

jobs:
  apply-tiering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Apply snapshots-only Cool tiering
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'APPLY_SNAPSHOT_COOL_TIERING'
          existing="$RUNNER_TEMP/storage-lifecycle.before.json"
          policy="$RUNNER_TEMP/storage-lifecycle.after.json"
          az storage account management-policy show --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" -o json > "$existing" 2>/dev/null || echo '{"rules":[]}' > "$existing"
          rule='{
            "enabled": true,
            "name": "tier-snapshots-to-cool-after-30d",
            "type": "Lifecycle",
            "definition": {
              "actions": {"baseBlob": {"tierToCool": {"daysAfterModificationGreaterThan": 30}}},
              "filters": {"blobTypes": ["blockBlob"], "prefixMatch": ["raw-apibara/snapshots/"]}
            }
          }'
          jq --arg name "$SNAPSHOT_LIFECYCLE_RULE" --argjson rule "$rule" '
            (.properties.policy // .policy // .) as $current
            | {rules: ((($current.rules // []) | map(select(.name != $name))) + [$rule])}
          ' "$existing" > "$policy"
          az storage account management-policy create --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --policy "@$policy" --only-show-errors
      - name: Verify exact lifecycle rule
        shell: bash
        run: |
          set -euo pipefail
          az storage account management-policy show --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" -o json |
            jq -e --arg name "$SNAPSHOT_LIFECYCLE_RULE" '
              (.properties.policy // .policy // .).rules[]
              | select(.name == $name and .enabled == true and .definition.filters.prefixMatch == ["raw-apibara/snapshots/"] and .definition.actions.baseBlob.tierToCool.daysAfterModificationGreaterThan == 30)
            ' >/dev/null
          echo "VERIFIED_LIFECYCLE_RULE=$SNAPSHOT_LIFECYCLE_RULE PREFIX=raw-apibara/snapshots/ ACTION=Cool AFTER_DAYS=30"
