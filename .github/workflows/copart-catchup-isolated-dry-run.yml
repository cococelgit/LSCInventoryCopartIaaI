name: Run Isolated Copart Catch-up Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  CATCHUP_JOB: job-lsc-copart-catchup-prod

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Verify safe template
        shell: bash
        run: |
          set -euo pipefail
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$CATCHUP_JOB?api-version=2024-03-01"
          job="$(az rest --method get --uri "$uri" -o json)"
          state="$(echo "$job" | jq -r '.properties.provisioningState')"
          trigger="$(echo "$job" | jq -r '.properties.configuration.triggerType')"
          writes="$(echo "$job" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""')"
          args="$(echo "$job" | jq -c '.properties.template.containers[0].args')"
          echo "provisioningState=$state trigger=$trigger allowWrites=$writes args=$args"
          test "$state" = "Succeeded"
          test "$trigger" = "Manual"
          test "$writes" = "false"
          echo "$args" | grep -q 'catch-up-dry-run'
      - name: Start isolated dry-run
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start -n "$CATCHUP_JOB" -g "$RESOURCE_GROUP" --only-show-errors -o tsv --query name)"
          echo "COPART_CATCH_UP_EXECUTION=$execution"
