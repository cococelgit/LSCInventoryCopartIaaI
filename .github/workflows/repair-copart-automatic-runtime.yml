name: Repair Copart Automatic AuctionsAPI Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REPAIR_COPART_AUTOMATIC_RUNTIME"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: repair-copart-automatic-runtime
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  COPART_JOB: job-lsc-copart-auto-prod

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Repair Copart runtime flags without changing schedule or image
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = REPAIR_COPART_AUTOMATIC_RUNTIME
          test -n "$AUCTIONS_API_KEY"
          active="$(az containerapp job execution list --name "$COPART_JOB" --resource-group "$RESOURCE_GROUP" --query "[?properties.status=='Running']" -o json | jq 'length')"
          test "$active" -eq 0
          current="$(az containerapp job show --name "$COPART_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$current" | jq -r '.properties.configuration.triggerType')" = Schedule
          test "$(echo "$current" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = '0 0-22/2 * * *'
          job_id="$(echo "$current" | jq -r '.id')"
          body="$(echo "$current" | jq --arg apiKey "$AUCTIONS_API_KEY" '
            .properties.template.containers[0] |= (del(.imageType) | .command=["/app/run-auctionsapi-dry-run.sh"] | .args=["copart","run"])
            | .properties.template.containers[0].env=((.env // [])
                | map(select(.name != "AuctionsApi__Enabled" and .name != "AuctionsApi__AllowWrites" and .name != "AuctionsApi__DefaultOverlapMinutes" and .name != "AuctionsApi__ApiKey"))
                + [
                    {name:"AuctionsApi__Enabled",value:"true"},
                    {name:"AuctionsApi__AllowWrites",value:"true"},
                    {name:"AuctionsApi__DefaultOverlapMinutes",value:"140"},
                    {name:"AuctionsApi__ApiKey",value:$apiKey}
                  ])
            | {properties:{template:.properties.template}}')"
          az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors --output none
      - name: Verify repaired runtime and isolation
        shell: bash
        run: |
          set -euo pipefail
          json="$(az containerapp job show --name "$COPART_JOB" --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Schedule
          test "$(echo "$json" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = '0 0-22/2 * * *'
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled")][0].value // ""')" = true
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites")][0].value // ""')" = true
          test "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes")][0].value // ""')" = 140
          test -n "$(echo "$json" | jq -r '[.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__ApiKey")][0] | .value // .secretRef // ""')"
          test "$(echo "$json" | jq -r '.properties.configuration.replicaRetryLimit')" = 0
          test "$(echo "$json" | jq -r '.properties.template.containers[0].args | join(" ")')" = 'copart run'
          excel="$(az containerapp job show --name job-lsc-copart-excel-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$excel" | jq -r '.properties.configuration.triggerType')" = Manual
          catchup="$(az containerapp job show --name job-lsc-copart-catchup-prod --resource-group "$RESOURCE_GROUP" -o json)"
          test "$(echo "$catchup" | jq -r '.properties.configuration.triggerType')" = Manual
          echo "$json" | jq '{name:.name,trigger:.properties.configuration.triggerType,cron:.properties.configuration.scheduleTriggerConfig.cronExpression,retry:.properties.configuration.replicaRetryLimit,enabled:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__Enabled") | .value),allowWrites:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__AllowWrites") | .value),overlapMinutes:(.properties.template.containers[0].env[]? | select(.name=="AuctionsApi__DefaultOverlapMinutes") | .value),image:.properties.template.containers[0].image,command:.properties.template.containers[0].command,args:.properties.template.containers[0].args}'
          echo "Excel remains Manual; catch-up remains Manual."
