name: Audit Inventory Field Coverage

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  API_APP: ca-lsc-inventory-api-prod

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Collect validation and taxonomy coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          api_fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          token_secret_ref="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP" --query "properties.template.containers[0].env[?name=='InventoryApi__Token'].secretRef | [0]" -o tsv)"
          inventory_token="$(az containerapp secret list --resource-group "$RESOURCE_GROUP" --name "$API_APP" --show-values --query "[?name=='$token_secret_ref'].value | [0]" -o tsv)"
          test -n "$api_fqdn"
          test -n "$inventory_token"

          curl --silent --show-error --fail --max-time 120 \
            --header "Authorization: Bearer $inventory_token" \
            "https://${api_fqdn}/internal/validation" \
            --output report/validation.json

          jq '.' report/validation.json
          unset inventory_token

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: inventory-field-coverage-${{ github.run_id }}
          path: report/validation.json
          retention-days: 14
