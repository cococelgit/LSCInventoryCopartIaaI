name: Pause Inventory Scoring Schedule

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  SCORING_JOB: job-lsc-inventory-scoring-prod

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Pause only the scoring schedule
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" --query id -o tsv)"
          before="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json)"
          active_before="$(az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json | jq '[.[] | select((.properties.status // .status) == "Running" or (.properties.status // .status) == "Pending")] | length')"
          echo "$before" | jq '{name,triggerType:.properties.configuration.triggerType,schedule:.properties.configuration.scheduleTriggerConfig,manual:.properties.configuration.manualTriggerConfig,activeExpected:'"$active_before"'}'
          body="$(echo "$before" | jq '{properties:{configuration:{triggerType:"Manual",replicaTimeout:.properties.configuration.replicaTimeout,replicaRetryLimit:.properties.configuration.replicaRetryLimit,manualTriggerConfig:(.properties.configuration.manualTriggerConfig // {parallelism:1,replicaCompletionCount:1})}}}')"
          az rest --method patch --url "https://management.azure.com${job_id}?api-version=2024-03-01" --body "$body" --only-show-errors >/dev/null
          after="$(az containerapp job show --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json)"
          test "$(echo "$after" | jq -r '.properties.configuration.triggerType')" = Manual
          test "$(echo "$after" | jq -r '.properties.configuration.scheduleTriggerConfig // empty')" = ''
          active_after="$(az containerapp job execution list --resource-group "$RESOURCE_GROUP" --name "$SCORING_JOB" -o json | jq '[.[] | select((.properties.status // .status) == "Running" or (.properties.status // .status) == "Pending")] | length')"
          echo "$after" | jq '{name,triggerType:.properties.configuration.triggerType,schedule:.properties.configuration.scheduleTriggerConfig,manual:.properties.configuration.manualTriggerConfig,activeAfter:'"$active_after"'}'
          echo "PAUSED_SCORING_SCHEDULE activeBefore=$active_before activeAfter=$active_after"
