name: Stop running Copart automatic executions

on:
  workflow_dispatch:
    inputs:
      confirm_stop:
        description: Confirm stopping currently running Copart automatic executions only
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  COPART_AUTO_PROCESS_JOB_NAME: job-lsc-copart-auto-prod

jobs:
  stop-running-executions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure through federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Stop currently running Copart automatic executions only
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_stop }}" != "true" ]; then
            echo "Stop confirmation was not provided." >&2
            exit 2
          fi

          mapfile -t executions < <(az containerapp job execution list \
            --name "$COPART_AUTO_PROCESS_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.status=='Running'].name" \
            -o tsv)

          if [ "${#executions[@]}" -eq 0 ]; then
            echo "No running Copart automatic executions found."
            exit 0
          fi

          printf 'Stopping %s Copart automatic execution(s):\n' "${#executions[@]}"
          printf '%s\n' "${executions[@]}"
          for execution in "${executions[@]}"; do
            az containerapp job stop \
              --name "$COPART_AUTO_PROCESS_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --only-show-errors
          done

          echo "Post-stop status (read-only):"
          az containerapp job execution list \
            --name "$COPART_AUTO_PROCESS_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0:10].{name:name,status:properties.status,startTime:properties.startTime,endTime:properties.endTime}' \
            -o json
