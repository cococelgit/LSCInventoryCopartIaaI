name: Run Future Auction V2 Load

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to load"
        required: true
        type: choice
        options: [copart, iaai]
      maximum:
        description: "Maximum eligible source lots in this block"
        required: true
        default: "1000"
        type: string
      sale_date_from:
        description: "Inclusive UTC auction timestamp"
        required: true
        default: "2026-09-14T04:00:00Z"
        type: string
      start_page:
        description: "AuctionsAPI page cursor"
        required: true
        default: "1"
        type: string
      confirmation:
        description: "Type RUN_FUTURE_AUCTION_V2_LOAD"
        required: true
        type: string
      source_ref:
        description: "Reviewed commit"
        required: true
        default: "main"
        type: string
      expected_sha:
        description: "Exact full SHA approved for this run"
        required: true
        type: string
      immediate_scoring:
        description: "Process scoring tasks created by this ingestion run before exit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: future-auction-v2-load
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: e54f22e9-0a3a-42d8-b3d2-538e60872feb
  AZURE_TENANT_ID: ccfdc482-7c38-458c-b7b7-b7967a122f1d
  AZURE_SUBSCRIPTION_ID: 99edf3d1-a651-4d2d-af8e-d44a3360f584
  RESOURCE_GROUP: rg-lsc-inventory-prod
  ACR_NAME: acrlscinvprodeus2
  ACR_SERVER: acrlscinvprodeus2.azurecr.io
  IMAGE_NAME: lsc-inventory-engine
  TEMP_JOB: job-lsc-future-v2-load-prod

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify authorization, commit and inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MAXIMUM: ${{ inputs.maximum }}
          START_PAGE: ${{ inputs.start_page }}
          SALE_DATE_FROM: ${{ inputs.sale_date_from }}
          IMMEDIATE_SCORING: ${{ inputs.immediate_scoring }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RUN_FUTURE_AUCTION_V2_LOAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$MAXIMUM" =~ ^[1-9][0-9]{0,3}$ ]]
          test "$MAXIMUM" -le 2000
          [[ "$START_PAGE" =~ ^[1-9][0-9]*$ ]]
          date -u -d "$SALE_DATE_FROM" >/dev/null
          case "$IMMEDIATE_SCORING" in true|false) ;; *) exit 2 ;; esac

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Verify production ingestion jobs are paused and idle
        shell: bash
        run: |
          set -euo pipefail
          for job in job-lsc-iaai-pilot-prod job-lsc-copart-auto-prod; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            trigger="$(echo "$json" | jq -r '.properties.configuration.triggerType')"
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
            echo "PRODUCTION_JOB=$job TRIGGER=$trigger ACTIVE=$active"
            test "$trigger" = Manual
            test "$active" = 0
          done

      - name: Build immutable load image
        shell: bash
        run: |
          set -euo pipefail
          tag="future-auction-v2-load-$(git rev-parse HEAD)"
          az acr build --registry "$ACR_NAME" --image "$IMAGE_NAME:$tag" --file Dockerfile .
          echo "LOAD_IMAGE=$ACR_SERVER/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"

      - name: Run isolated V2 load and clean up
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          MAXIMUM: ${{ inputs.maximum }}
          START_PAGE: ${{ inputs.start_page }}
          SALE_DATE_FROM: ${{ inputs.sale_date_from }}
          IMMEDIATE_SCORING: ${{ inputs.immediate_scoring }}
          AUCTIONS_API_KEY: ${{ secrets.AUCTIONS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUCTIONS_API_KEY"
          case "$PLATFORM" in copart|iaai) ;; *) exit 2 ;; esac
          uri="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$TEMP_JOB?api-version=2024-03-01"
          cleanup() { az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors || true; }
          trap cleanup EXIT
          az containerapp job delete --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --yes --only-show-errors || true
          if [ "$PLATFORM" = copart ]; then source_job=job-lsc-copart-auto-prod; else source_job=job-lsc-iaai-pilot-prod; fi
          source_json="$(az rest --method get --uri "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/$source_job?api-version=2024-03-01" -o json)"
          body="$(echo "$source_json" | jq --arg name "$TEMP_JOB" --arg image "$LOAD_IMAGE" --arg key "$AUCTIONS_API_KEY" --arg platform "$PLATFORM" --arg immediate "$IMMEDIATE_SCORING" '
            .location as $location
            | .properties.environmentId as $environmentId
            | {type:(.identity.type // "UserAssigned"), userAssignedIdentities:((.identity.userAssignedIdentities // {}) | with_entries(.value={}))} as $identity
            | .properties.configuration as $sourceConfiguration
            | .properties.template as $sourceTemplate
            | ($sourceTemplate.containers[0]
                | del(.imageType)
                | .name=$name
                | .image=$image
                | .command=["dotnet"]
                | .args=["Lsc.Inventory.Api.dll","--auctionsapi-v2-initial-block","--platform",$platform,"--maximum",env.MAXIMUM,"--start-page",env.START_PAGE,"--sale-date-from",env.SALE_DATE_FROM,"--write"]
                | .env=((.env // [])
                    | map(select((.secretRef // "") == ""
                        and (.name | test("Blob|Storage|AzureWebJobsStorage"; "i") | not)
                        and (.name | IN("AuctionsApi__ApiKey","AuctionsApi__Enabled","AuctionsApi__AllowWrites","AuctionsApi__CanonicalMapperEnabled","InventoryV2__ShadowWriteEnabled","InventoryV2__BatchSize","Scoring__ProcessIngestionRunImmediately","Scoring__ImmediateMaximumLots","Scoring__RequireCurrentForPublication","Persistence__DatabaseUser") | not)))
                    + [
                        {name:"AuctionsApi__ApiKey",value:$key},
                        {name:"AuctionsApi__Enabled",value:"true"},
                        {name:"AuctionsApi__AllowWrites",value:"true"},
                        {name:"AuctionsApi__CanonicalMapperEnabled",value:"true"},
                        {name:"InventoryV2__ShadowWriteEnabled",value:"true"},
                        {name:"InventoryV2__BatchSize",value:"1000"},
                        {name:"Scoring__ProcessIngestionRunImmediately",value:$immediate},
                        {name:"Scoring__ImmediateMaximumLots",value:env.MAXIMUM},
                        {name:"Scoring__RequireCurrentForPublication",value:"false"},
                        {name:"Persistence__DatabaseUser",value:"id-lsc-inventory-loader-prod"}
                      ])) as $container
            | {location:$location, identity:$identity, properties:{environmentId:$environmentId, configuration:(($sourceConfiguration
                | del(.identitySettings,.secrets,.scheduleTriggerConfig)
                | .triggerType="Manual"
                | .manualTriggerConfig={parallelism:1,replicaCompletionCount:1}
                | .replicaRetryLimit=0
                | .replicaTimeout=3600)), template:($sourceTemplate | .containers=[$container])}}')"
          az rest --method put --uri "$uri" --body "$body" --output none
          for _ in $(seq 1 60); do
            state="$(az rest --method get --uri "$uri" --query 'properties.provisioningState' -o tsv 2>/dev/null || true)"
            echo "LOAD_JOB_PROVISIONING=$state"
            case "$state" in Succeeded) break ;; Failed|Canceled) exit 1 ;; esac
            sleep 5
          done
          test "$state" = Succeeded
          execution="$(az containerapp job start --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" -o json | jq -r '.name // .properties.name // empty')"
          test -n "$execution"
          echo "LOAD_EXECUTION=$execution"
          status=Unknown
          for _ in $(seq 1 1200); do
            status="$(az containerapp job execution show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" -o json | jq -r '.properties.status // "Unknown"')"
            echo "LOAD_STATUS=$status"
            case "$status" in Succeeded|Failed|Canceled|Stopped) break ;; esac
            sleep 5
          done
          replicas="$(az containerapp job replica list --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" -o json || true)"
          replica="$(echo "$replicas" | jq -r '.[0].name // empty')"
          container="$(echo "$replicas" | jq -r '.[0].properties.containers[0].name // empty')"
          if [ -n "$replica" ] && [ -n "$container" ]; then
            az containerapp job logs show --name "$TEMP_JOB" --resource-group "$RESOURCE_GROUP" --execution "$execution" --replica "$replica" --container "$container" --tail 300 --format text | tee "$RUNNER_TEMP/future-auction-v2-load.log" || true
          else
            echo "No replica/container metadata available for failed execution $execution" | tee "$RUNNER_TEMP/future-auction-v2-load.log"
          fi
          if [ "$status" != "Succeeded" ]; then
            echo "LOAD_FAILURE_STATUS=$status"
            exit 1
          fi
          result_line="$(grep -E 'stdout F \{"RunId"' "$RUNNER_TEMP/future-auction-v2-load.log" | tail -1 | sed -E 's/^.*stdout F //')"
          test -n "$result_line"
          printf '%s' "$result_line" | jq -e '.Persisted == true' >/dev/null
          printf '%s' "$result_line" | jq -e '(.Created >= 0 and .Updated >= 0 and .Unchanged >= 0)' >/dev/null
          failure_count="$(printf '%s' "$result_line" | jq '.Failures | length')"
          if [ "$failure_count" -gt 0 ]; then
            printf '%s' "$result_line" | jq -e '.Failures | all(. == "v2-initial-load:source-ended-before-block-limit")' >/dev/null
            echo "SOURCE_EXHAUSTED=true"
          else
            echo "SOURCE_EXHAUSTED=false"
          fi

      - name: Verify production ingestion jobs remain paused and idle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for job in job-lsc-iaai-pilot-prod job-lsc-copart-auto-prod; do
            json="$(az containerapp job show --name "$job" --resource-group "$RESOURCE_GROUP" -o json)"
            test "$(echo "$json" | jq -r '.properties.configuration.triggerType')" = Manual
            active="$(az containerapp job execution list --name "$job" --resource-group "$RESOURCE_GROUP" -o json | jq '[.[] | select(.properties.status == "Running" or .properties.status == "Pending")] | length')"
            test "$active" = 0
          done
